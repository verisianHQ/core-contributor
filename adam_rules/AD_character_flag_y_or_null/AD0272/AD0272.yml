Check:
  all:
    - name: '^AOCC(?P<zz>0[1-9]|[1-9][0-9])FL$'
      variable_regex_pattern: true
      operator: non_empty
    - name: 'AOCC{{zz}}FL'
      operator: not_equal_to
      value: 'Y'
      value_is_literal: true
Core:
  Id: AD0272
  Status: Published
  Version: '1'
Description: Raise an error when AOCCzzFL is not equal to Y or null within OCCDS or MDOCCDS.
Executability: Fully Executable
Outcome:
  Message: AOCCzzFL is not equal to Y or null within OCCDS or MDOCCDS.
  Output Variables:
    - 'AOCC{{zz}}FL$'
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - OCCDS
      - MDOCCDS
  Domains:
    Include:
      - OCCDS
      - MDOCCDS
Sensitivity: Record

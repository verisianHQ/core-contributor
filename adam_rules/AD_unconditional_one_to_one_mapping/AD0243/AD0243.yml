# Variable: TRTxxA where xx is an integer [01-99, zero-padded]
# Condition: 
# Rule: There is more than one value of TRTxxA for a given value of TRTxxAN
# verified
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '243'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: IG v1.0
        Section: ''
        Item: ''
        Cited Guidance: 'ADaMIG v1.0, Section 3.1, Table 3.1.1: TRTxxAN: The numeric
          code variable for TRTxxA. One-to-one map to TRTxxA.'
Check:
  all:
  - name: ^TRT(?P<xx>0[1-9]|[1-9][0-9])A$
    variable_regex_pattern: true
    operator: is_inconsistent_across_dataset
    value: TRT{{xx}}AN
Core:
  Id: AD0243
  Status: Draft
  Version: '1'
Description: Each TRTxxAN value must map to only one TRTxxA value.
Executability: Fully Executable
Outcome:
  Message: TRTxxA has more than one value for a given TRTxxAN value.
  Output Variables:
  - TRT{{xx}}A
  - TRT{{xx}}AN
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - SUBJECT LEVEL ANALYSIS DATASET
  Domains:
    Include:
    - ALL
Sensitivity: Record

# Variable: TRxxPGy where xx is an integer [01-99, zero-padded] and y is an integer [1-9, not zero-padded]
# Condition: 
# Rule: There is more than one value of TRxxPGy for a given value of TRxxPGyN
# verified
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '232'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: IG v1.0
        Section: ''
        Item: ''
        Cited Guidance: 'ADaMIG v1.0, Section 3.1, Table 3.1.1: TRxxPGyN: The numeric
          code for TRxxPGy. One-to-one map to TRxxPGy.'
Check:
  all:
  - name: ^TR(?P<xx>0[1-9]|[1-9][0-9])PG(?P<y>[1-9][0-9]?)$
    variable_regex_pattern: true
    operator: is_inconsistent_across_dataset
    value: TR{{xx}}PG{{y}}N
Core:
  Id: AD0232
  Status: Draft
  Version: '1'
Description: Each TRxxPGyN value must map to only one TRxxPGy value.
Executability: Fully Executable
Outcome:
  Message: TRxxPGy has more than one value for a given TRxxPGyN value.
  Output Variables:
  - TR{{xx}}PG{{y}}
  - TR{{xx}}PG{{y}}N
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - SUBJECT LEVEL ANALYSIS DATASET
  Domains:
    Include:
    - ALL
Sensitivity: Record

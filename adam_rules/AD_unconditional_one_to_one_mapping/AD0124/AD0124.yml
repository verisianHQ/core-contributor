# Variable: PARCATy where y is an integer [1-9, not zero-padded]
# Condition: 
# Rule: There is more than one value of PARCATy for a given value of PARAMCD
# verified
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '124'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: IG v1.0
        Section: ''
        Item: ''
        Cited Guidance: 'ADaMIG v1.0, Section 3.2.4, Table 3.2.4.1: A categorization
          of PARAM. For example, value of PARCAT1 might group the parameters having
          to do with a particular questionnaire, lab specimen type, or area of investigation.'
  - Name: ADaMIG
    Version: '1.1'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '124'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: IG v1.1
        Section: ''
        Item: ''
        Cited Guidance: 'ADaMIG v1.1, Section 3.3.4, Table 3.3.4.1: Note that PARCATy
          is not a qualifier for PARAM. PARAM to PARCATy is a many-to-one mapping;
          any given PARAM may be associated with at most one level of PARCATy (e.g.,
          one level of PARCAT1 and one level of PARCAT2).'
  - Name: ADaMIG
    Version: '1.2'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '124'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: IG v1.2
        Section: ''
        Item: ''
        Cited Guidance: 'ADaMIG v1.2, Section 3.3.4.1, Table 3.3.4.1.1: Note that
          PARCATy is not a qualifier for PARAM. PARAM to PARCATy is a many-to-one
          mapping; any given PARAM may be associated with at most one level of PARCATy
          (e.g., one level of PARCAT1 and one level of PARCAT2).'
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '124'
        Version: '2'
      Version: '5.0'
      Citations:
      - Document: IG v1.3
        Section: ''
        Item: ''
        Cited Guidance: 'ADaMIG v1.3, Section 3.3.4.1, Table 3.3.4.1.1: Note that
          PARCATy is not a qualifier for PARAM. PARAM to PARCATy is a many-to-one
          mapping; any given PARAM may be associated with at most one level of PARCATy
          (e.g., one level of PARCAT1 and one level of PARCAT2).'
      - Document: IG v1.3
        Section: ''
        Item: ''
        Cited Guidance: 'ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis
          needs by adding SPDEVID as a required key variable and USUBJID as a conditionally
          required variable. See the BDS class for further details.'
Check:
  all:
  - name: ^PARCAT(?P<y>[1-9][0-9]?)$
    variable_regex_pattern: true
    operator: is_inconsistent_across_dataset
    value: PARAMCD
Core:
  Id: AD0124
  Status: Draft
  Version: '1'
Description: Each PARAMCD value must map to only one PARCATy value.
Executability: Fully Executable
Outcome:
  Message: PARCATy has more than one value for a given PARAMCD value.
  Output Variables:
  - PARCAT{{y}}
  - PARAMCD
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BASIC DATA STRUCTURE
  Domains:
    Include:
    - ALL
Sensitivity: Record

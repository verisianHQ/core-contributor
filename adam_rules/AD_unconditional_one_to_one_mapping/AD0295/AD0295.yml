# Variable: ATOXGR
# Condition: 
# Rule: There is more than one value of ATOXGR for a given value of ATOXGRN
# verified
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '295'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.0
        Section: '3'
        Item: 9 (General Variable Naming Conventions)
        Cited Guidance: 'ADaMIG v1.0, Section 3, Item 9 (General Variable Naming Conventions):
          In general, if SDTM character variables are converted to numeric variables
          in ADaM datasets, then they should be named as they are in the SDTM with
          an "N" suffix added. For example, the numeric version of the DM SEX variable
          is SEXN in an ADaM dataset, and a numeric version of RACE is RACEN. If necessary
          to keep within the 8-character variable name length limit, the last character
          may be removed prior to appending the N. Note that this naming scheme applies
          only to numeric variables whose values map one-to-one to the values of the
          equivalent character variables. Note also that this convention does not
          apply to date/time variables.'
      - Document: OCCDS v1.0
        Section: 3.2.8
        Item: Table 3.2.8.1
        Cited Guidance: 'OCCDS v1.0, Section 3.2.8, Table 3.2.8.1: CDISC Notes for
          ATOXGRN state: "Code ATOXGR to numeric".'
      - Document: OCCDS v1.1
        Section: 3.2.8
        Item: Table 3.2.8.1
        Cited Guidance: 'OCCDS v1.1, Section 3.2.8, Table 3.2.8.1: CDISC Notes for
          ATOXGRN state: "Code ATOXGR to numeric".'
Check:
  all:
  - name: ATOXGR
    operator: is_inconsistent_across_dataset
    value: ATOXGRN
Core:
  Id: AD0295
  Status: Draft
  Version: '1'
Description: Raise an error when there is more than one value of ATOXGR for a given value of ATOXGRN.
Executability: Fully Executable
Outcome:
  Message: ATOXGR has more than one value for a given ATOXGRN value.
  Output Variables:
  - ATOXGR
  - ATOXGRN
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - OCCURRENCE DATA STRUCTURE
  Domains:
    Include:
    - ALL
Sensitivity: Record

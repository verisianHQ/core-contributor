# Variable: TRTPGy where y is an integer [1-9, not zero-padded]
# Condition: 
# Rule: There is more than one value of TRTPGy for a given value of TRTPGyN
# verified
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '237'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.0
        Section: 3.2.2
        Item: Table 3.2.2.1
        Cited Guidance: 'ADaMIG v1.0, Section 3.2.2, Table 3.2.2.1: TRTPGyN: The numeric
          code for TRTPGy. One-to-one map to TRTPGy.'
Check:
  all:
  - name: ^TRTPG(?P<y>[1-9][0-9]?)$
    variable_regex_pattern: true
    operator: is_inconsistent_across_dataset
    value: TRTPG{{y}}N
Core:
  Id: AD0237
  Status: Draft
  Version: '1'
Description: Raise an error when there is more than one value of TRTPGy for a given value of TRTPGyN, where y is a single-digit integer [1-9].
Executability: Fully Executable
Outcome:
  Message: TRTPGy has more than one value for a given TRTPGyN value.
  Output Variables:
  - TRTPG{{y}}
  - TRTPG{{y}}N
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BASIC DATA STRUCTURE
  Domains:
    Include:
    - ALL
Sensitivity: Record

# Variable: TRTxxPN where xx is an integer [01-99, zero-padded]
# Condition: 
# Rule: There is more than one value of TRTxxPN for a given value of TRTxxP
# verified
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '76'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.0
        Section: '3.1'
        Item: Table 3.1.1
        Cited Guidance: 'ADaMIG v1.0, Section 3.1, Table 3.1.1: One-to-one map to
          TRTxxP'
Check:
  all:
  - name: ^TRT(?P<xx>0[1-9]|[1-9][0-9])PN$
    variable_regex_pattern: true
    operator: is_inconsistent_across_dataset
    value: TRT{{xx}}P
Core:
  Id: AD0076
  Status: Draft
  Version: '1'
Description: Raise an error when there is more than one value of TRTxxPN for a given value of TRTxxP.
Executability: Fully Executable
Outcome:
  Message: TRTxxPN has more than one value for a given TRTxxP value.
  Output Variables:
  - TRT{{xx}}PN
  - TRT{{xx}}P
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - SUBJECT LEVEL ANALYSIS DATASET
  Domains:
    Include:
    - ALL
Sensitivity: Record

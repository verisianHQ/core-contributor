# Variable: PARCATyN where y is an integer [1-9, not zero-padded]
# Condition: 
# Rule: There is more than one value of PARCATyN for a given value of PARCATy
# verified
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '126'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.0
        Section: 3.2.4
        Item: Table 3.2.4.1
        Cited Guidance: 'ADaMIG v1.0, Section 3.2.4, Table 3.2.4.1: There should be
          a one to one relationship between PARCATy and PARCATyN.'
Check:
  all:
  - name: ^PARCAT(?P<y>[1-9])N$
    variable_regex_pattern: true
    operator: is_inconsistent_across_dataset
    value: PARCAT{{y}}
Core:
  Id: AD0126
  Status: Draft
  Version: '1'
Description: Raise an error when there is more than one value of PARCATyN for a given value of PARCATy.
Executability: Fully Executable
Outcome:
  Message: PARCATyN has more than one value for a given PARCATy value.
  Output Variables:
  - PARCAT{{y}}N
  - PARCAT{{y}}
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BASIC DATA STRUCTURE
  Domains:
    Include:
    - ALL
Sensitivity: Record

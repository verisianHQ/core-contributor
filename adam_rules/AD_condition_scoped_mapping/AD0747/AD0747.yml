# Variable: AVALCATy where y is an integer [1-9, not zero-padded]
# Condition: Within a given value of PARAMCD
# Rule: There is more than one value of AVALCATy for a given value of AVAL
# verified
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.1'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '747'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.1
        Section: 3.3.4
        Item: Table 3.3.4.1
        Cited Guidance: 'ADaMIG v1.1, Section 3.3.4, Table 3.3.4.1: A categorization
          of AVAL or AVALC within a parameter'
Check:
  all:
  - name: ^AVALCAT(?P<y>[1-9])$
    variable_regex_pattern: true
    operator: is_inconsistent_across_dataset
    value:
    - PARAMCD
    - AVAL
Core:
  Id: AD0747
  Status: Draft
  Version: '1'
Description: Raise an error when within a given value of PARAMCD, there is more than one value of AVALCATy for a given value of AVAL, where y is a single-digit integer [1-9].
Executability: Fully Executable
Outcome:
  Message: AVALCATy has more than one value for a given AVAL value within a parameter.
  Output Variables:
  - AVALCAT{{y}}
  - PARAMCD
  - AVAL
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BASIC DATA STRUCTURE
  Domains:
    Include:
    - ALL
Sensitivity: Record

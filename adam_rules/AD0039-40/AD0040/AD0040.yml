          "S". If a time was imputed *TMF must be populated and is required. Both
          *DTF and *TMF may be needed to describe the level of imputation in *DTM
          if imputation was done.'
  - Name: ADaMIG
    Version: '1.2'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '40'

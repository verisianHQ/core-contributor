Check:
  all:
    - name: variable_name
      operator: suffix_matches_regex
      suffix: 3
      value: 'TMF'
    - name: $timefl_codelist
      operator: does_not_contain
      value: variable_value
Core:
  Id: AD0040
  Status: Published
  Version: '1'
Description: Raise an error when a variable with a suffix of TMF has a value that is not within Controlled Terminology for TIMEFL
Executability: Fully Executable
Operations:
  - id: $timefl_codelist
    operator: distinct
    domain: ig_codelists
    name: value
    filter:
      codelist_code: 'C81226'
Outcome:
  Message: A variable with a suffix of TMF has a value that is not within Controlled Terminology for TIMEFL
  Output Variables:
    - variable_name
    - variable_value
Rule Type: Value Check with Variable Metadata
Scope:
  Classes:
    Include:
      - ALL
  Domains:
    Include:
      - ALL
Sensitivity: Record

# Variable: *TMF
# Condition: Variable with a suffix of TMF is present
# Rule: Value that is not within Controlled Terminology for TIMEFL
# verified
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '40'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: IG v1.0
        Section: '3'
        Item: '7 (General Timing Variable Conventions)'
        Cited Guidance: 'ADaMIG v1.0, Section 3, Item 7 (General Timing Variable Conventions):
          Variables whose names end in TMF are time imputation flags. *TMF variables
          represent the level of imputation of the *TM (and *DTM) variable based on
          the source SDTM DTC variable. *TMF = H if the entire time is imputed. *TMF
          = M if minutes and seconds are imputed. *TMF = S if only seconds are imputed.
          *TMF = null if *TM equals the SDTM DTC variable time part equivalent. For
          a given SDTM DTC variable, if only hours and minutes are ever collected,
          and seconds are imputed in *DTM as 00, then it is not necessary to set *TMF
          to "S". However if seconds are generally collected but are missing in a
          given value of the DTC variable and imputed as 00, or if a collected value
          of seconds is changed in the creation of *DTM, then the difference is significant
          and should be qualified in *TMF. If a time was imputed *TMF must be populated
          and is required. Both *DTF and *TMF may be needed to describe the level
          of imputation in *DTM if imputation was done.'
  - Name: ADaMIG
    Version: '1.1'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '40'
        Version: '1'
      Version: '5.0'

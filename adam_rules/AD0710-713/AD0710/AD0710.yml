Check:
  all:
    - name: variable_name
      operator: suffix_matches_regex
      suffix: 3
      value: 'RFL$'
Core:
  Id: AD0710
  Status: Published
  Version: '1'
Description: Raise an error when a variable with a suffix of RFL has a value that is not Y, N, or null.
Executability: Fully Executable
Outcome:
  Message: A variable with a suffix of RFL has a value that is not Y, N, or null.
  Output Variables:
    - variable_name
    - variable_value
Rule Type: Value Check with Variable Metadata
Scope:
  Classes:
    Include:
      - BDS
  Domains:
    Include:
      - BDS
Sensitivity: Record

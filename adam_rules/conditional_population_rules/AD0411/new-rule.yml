# Variable: ANLzzFL
# Condition: ANLzzFN is populated
# Rule: ANLzzFL must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '411'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3; ADaMIG-MD v1.0'
                Section: '3.3.8; 3.1'
                Item: 'Table 3.3.8.1'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.3.8, Table 3.3.8.1: There must be a one-to-one relationship between ANLzzFN and ANLzzFL within a dataset.
                  ANLzzFN cannot be present unless ANLzzFL is also present. When ANLzzFL and ANLzzFN are present, then on a given record, either both must be populated or both must be null.
                  
                  ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis needs by adding SPDEVID as a required key variable and USUBJID as a conditionally required variable. See the BDS class for further details.
Check:
  all:
    - name: '^ANL(?P<zz>0[1-9]|[1-9][0-9])FN$'
      variable_regex_pattern: true
      operator: non_empty
    - name: 'ANL{{zz}}FL'
      operator: empty
Core:
  Id: AD0411
  Status: Draft
  Version: '1'
Description: 'ANLzzFL must be populated when ANLzzFN is populated.'
Executability: Fully Executable
Outcome:
  Message: 'ANLzzFL is not populated when ANLzzFN is populated.'
  Output Variables:
    - 'ANL{{zz}}FL'
    - 'ANL{{zz}}FN'
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - BDS
      - MDBDS
  Domains:
    Include:
      - ALL
Sensitivity: Record

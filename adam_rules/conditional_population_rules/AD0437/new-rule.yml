# Variable: AVALCAyN
# Condition: AVALCATy is populated
# Rule: AVALCAyN must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '437'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3; ADaMIG-MD v1.0'
                Section: '3.3.4.1; 3.1'
                Item: 'Table 3.3.4.1.1'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.3.4.1, Table 3.3.4.1.1: There must be a one-to-one relationship between AVALCAyN and AVALCATy within a parameter.
                  AVALCAyN cannot be present unless AVALCATy is also present. When AVALCATy and AVALCAyN are present, then on a given record, either both must be populated or both must be null.
                  
                  ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis needs by adding SPDEVID as a required key variable and USUBJID as a conditionally required variable. See the BDS class for further details.
Check:
  all:
    - name: '^AVALCAT(?P<y>[1-9])$'
      variable_regex_pattern: true
      operator: non_empty
    - name: 'AVALCA{{y}}N'
      operator: empty
Core:
  Id: AD0437
  Status: Draft
  Version: '1'
Description: AVALCAyN must be populated when AVALCATy is populated.
Executability: Fully Executable
Outcome:
  Message: AVALCAyN is not populated when AVALCATy is populated.
  Output Variables:
    - 'AVALCA{{y}}N'
    - 'AVALCAT{{y}}'
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - BDS
      - MDBDS
  Domains:
    Include:
      - ALL
Sensitivity: Record

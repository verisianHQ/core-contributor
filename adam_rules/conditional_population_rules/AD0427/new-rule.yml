# Variable: TRTxxAN
# Condition: TRTxxA is populated
# Rule: TRTxxAN must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '427'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3'
                Section: '3.2'
                Item: 'Table 3.2.4'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.2, Table 3.2.4: TRTxxAN: Numeric representation of TRTxxA. There must be a one-to-one relationship between TRTxxAN and TRTxxA within a study. TRTxxAN cannot be present unless TRTxxA is also present. When TRTxxA and TRTxxAN are present, then on a given record, either both must be populated or both must be null.
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '427'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.2'
                Section: '3.2'
                Item: 'Table 3.2.4'
                Cited Guidance: |-
                  ADaMIG v1.2, Section 3.2, Table 3.2.4: TRTxxAN: Numeric representation of TRTxxA. There must be a one-to-one relationship between TRTxxAN and TRTxxA within a study. TRTxxAN cannot be present unless TRTxxA is also present. When TRTxxA and TRTxxAN are present, then on a given record, either both must be populated or both must be null.
Check:
  all:
    - name: '^TRT(?P<xx>0[1-9]|[1-9][0-9])A$'
      variable_regex_pattern: true
      operator: non_empty
    - name: 'TRT{{xx}}AN'
      operator: empty
Core:
  Id: AD0427
  Status: Draft
  Version: '1'
Description: TRTxxAN must be populated when TRTxxA is populated.
Executability: Fully Executable
Outcome:
  Message: TRTxxAN is not populated when TRTxxA is populated.
  Output Variables:
    - 'TRT{{xx}}AN'
    - 'TRT{{xx}}A'
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - ADSL
  Domains:
    Include:
      - ALL
Sensitivity: Record

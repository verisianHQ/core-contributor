# Variable: COHORT
# Condition: COHORTN is populated
# Rule: COHORT must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADNCA
        Version: '1.0'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '663'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: 'ADNCA v1.0'
                Section: '4.2'
                Item: 'Table 4.2.1'
                Cited Guidance: |-
                  ADNCA v1.0, Section 4.2, Table 4.2.1: There must be a one-to-one mapping between COHORT and COHORTN.  When COHORT and COHORTN are present, then on a given record, either both must be populated or both must be null.

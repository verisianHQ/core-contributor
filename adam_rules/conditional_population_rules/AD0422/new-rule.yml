# Variable: TRxxAGyN
# Condition: TRxxAGy is populated
# Rule: TRxxAGyN must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '422'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3'
                Section: '3.2'
                Item: 'Table 3.2.4'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.2, Table 3.2.4: There must be a one-to-one relationship between TRxxAGyN and TRxxAGy within a study.
                  TRxxAGyN cannot be present unless TRxxAGy is also present. When TRxxAGy and TRxxAGyN are present, then on a given record, either both must be populated or both must be null.
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '422'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.2'
                Section: '3.2'
                Item: 'Table 3.2.4'
                Cited Guidance: |-
                  ADaMIG v1.2, Section 3.2, Table 3.2.4: There must be a one-to-one relationship between TRxxAGyN and TRxxAGy within a study.
                  TRxxAGyN cannot be present unless TRxxAGy is also present. When TRxxAGy and TRxxAGyN are present, then on a given record, either both must be populated or both must be null.
Check:
  all:
    - name: '^TR(?P<xx>0[1-9]|[1-9][0-9])AG(?P<y>[1-9])$'
      variable_regex_pattern: true
      operator: non_empty
    - name: 'TR{{xx}}AG{{y}}N'
      operator: empty
Core:
  Id: AD0422
  Status: Draft
  Version: '1'
Description: TRxxAGyN must be populated when TRxxAGy is populated.
Executability: Fully Executable
Outcome:
  Message: TRxxAGyN is not populated when TRxxAGy is populated.
  Output Variables:
    - 'TR{{xx}}AG{{y}}N'
    - 'TR{{xx}}AG{{y}}'
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - ADSL
  Domains:
    Include:
      - ALL
Sensitivity: Record

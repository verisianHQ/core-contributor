# Variable: TRTAN
# Condition: TRTA is populated
# Rule: TRTAN must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '456'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3; ADaMIG-MD v1.0'
                Section: '3.3.2; 3.1'
                Item: 'Table 3.3.2.1'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.3.2, Table 3.3.2.1: There must be a one-to-one relationship between TRTAN and TRTA within a study.
                  TRTAN cannot be present unless TRTA is also present. When TRTA and TRTAN are present, then on a given record, either both must be populated or both must be null.
                  
                  ADaMIG-MD v1.0, Section 3.1: MDBDS and MDOCCDS support analysis needs by adding SPDEVID as a required key variable and USUBJID as a conditionally required variable. See the BDS and OCCDS class for further details.
Check:
  all:
    - name: TRTA
      operator: non_empty
    - name: TRTAN
      operator: empty
Core:
  Id: AD0456
  Status: Draft
  Version: '1'
Description: TRTAN must be populated when TRTA is populated.
Executability: Fully Executable
Outcome:
  Message: TRTAN is not populated when TRTA is populated.
  Output Variables:
    - TRTAN
    - TRTA
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - BDS
      - MDBDS
      - OCCDS
      - MDOCCDS
  Domains:
    Include:
      - ALL
Sensitivity: Record

# Variable: APERIODC
# Condition: APERIOD is populated
# Rule: APERIODC must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '429'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3; ADaMIG-MD v1.0'
                Section: '3.3.3; 3.1'
                Item: 'Table 3.3.3.1'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.3.3, Table 3.3.3.1: There must be a one-to-one relationship between APERIODC and APERIOD within a study.
                  APERIODC cannot be present unless APERIOD is also present. When APERIOD and APERIODC are present, then on a given record, either both must be populated or both must be null.
                  
                  ADaMIG-MD v1.0, Section 3.1: MDBDS and MDOCCDS support analysis needs by adding SPDEVID as a required key variable and USUBJID as a conditionally required variable. See the BDS and OCCDS class for further details.
Check:
  all:
    - name: APERIOD
      operator: non_empty
    - name: APERIODC
      operator: empty
Core:
  Id: AD0429
  Status: Draft
  Version: '1'
Description: APERIODC must be populated when APERIOD is populated.
Executability: Fully Executable
Outcome:
  Message: APERIODC is not populated when APERIOD is populated.
  Output Variables:
    - APERIODC
    - APERIOD
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - BDS
      - MDBDS
      - OCCDS
      - MDOCCDS
  Domains:
    Include:
      - ALL
Sensitivity: Record

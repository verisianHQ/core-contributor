# Variable: TRxxPGy
# Condition: TRxxPGyN is populated
# Rule: TRxxPGy must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '419'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3'
                Section: '3.2'
                Item: 'Table 3.2.4'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.2, Table 3.2.4: There must be a one-to-one relationship between TRxxPGyN and TRxxPGy within a study.
                  TRxxPGyN cannot be present unless TRxxPGy is also present. When TRxxPGy and TRxxPGyN are present, then on a given record, either both must be populated or both must be null.
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '419'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.2'
                Section: '3.2'
                Item: 'Table 3.2.4'
                Cited Guidance: |-
                  ADaMIG v1.2, Section 3.2, Table 3.2.4: There must be a one-to-one relationship between TRxxPGyN and TRxxPGy within a study.
                  TRxxPGyN cannot be present unless TRxxPGy is also present. When TRxxPGy and TRxxPGyN are present, then on a given record, either both must be populated or both must be null.
Check:
  all:
    - name: '^TR(?P<xx>0[1-9]|[1-9][0-9])PG(?P<y>[1-9])N$'
      variable_regex_pattern: true
      operator: non_empty
    - name: 'TR{{xx}}PG{{y}}'
      operator: empty
Core:
  Id: AD0419
  Status: Draft
  Version: '1'
Description: TRxxPGy must be populated when TRxxPGyN is populated.
Executability: Fully Executable
Outcome:
  Message: TRxxPGy is not populated when TRxxPGyN is populated.
  Output Variables:
    - 'TR{{xx}}PG{{y}}'
    - 'TR{{xx}}PG{{y}}N'
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - ADSL
  Domains:
    Include:
      - ALL
Sensitivity: Record

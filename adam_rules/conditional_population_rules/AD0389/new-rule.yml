# Variable: BTOXGRHN
# Condition: BTOXGRH is populated
# Rule: BTOXGRHN must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '389'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3; ADaMIG-MD v1.0'
                Section: '3.3.7; 3.1'
                Item: 'Table 3.3.7.1'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.3.7, Table 3.3.7.1: There must be a one-to-one relationship between ATOXGRHN and ATOXGRH within a parameter.
                  ATOXGRHN cannot be present unless ATOXGRH is also present. When ATOXGRH and ATOXGRHN are present, then on a given record, either both must be populated or both must be null.
                  
                  ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis needs by adding SPDEVID as a required key variable and USUBJID as a conditionally required variable. See the BDS class for further details.
Check:
  all:
    - name: BTOXGRH
      operator: non_empty
    - name: BTOXGRHN
      operator: empty
Core:
  Id: AD0389
  Status: Draft
  Version: '1'
Description: 'BTOXGRHN must be populated when BTOXGRH is populated.'
Executability: Fully Executable
Outcome:
  Message: 'BTOXGRHN is not populated when BTOXGRH is populated.'
  Output Variables:
    - BTOXGRHN
    - BTOXGRH
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - BDS
      - MDBDS
  Domains:
    Include:
      - ALL
Sensitivity: Record

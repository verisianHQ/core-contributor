Outcome:
  Message: TRTSEQP is not populated when TRTSEQPN is populated.
  Output Variables:
    - TRTSEQP
    - TRTSEQPN
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - ADSL
  Domains:
    Include:
      - ALL
Sensitivity: Record

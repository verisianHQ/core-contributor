# Variable: TRTSEQP
# Condition: TRTSEQPN is populated
# Rule: TRTSEQP must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '415'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: ADaMIG v1.3
                Section: '3.2'
                Item: Table 3.2.4
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.2, Table 3.2.4: There must be a one-to-one relationship between TRTSEQPN and TRTSEQP within a study.
                  TRTSEQPN cannot be present unless TRTSEQP is also present. When TRTSEQP and TRTSEQPN are present, then on a given record, either both must be populated or both must be null.
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '415'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: ADaMIG v1.2
                Section: '3.2'
                Item: Table 3.2.4
                Cited Guidance: |-
                  ADaMIG v1.2, Section 3.2, Table 3.2.4: There must be a one-to-one relationship between TRTSEQPN and TRTSEQP within a study.
                  TRTSEQPN cannot be present unless TRTSEQP is also present. When TRTSEQP and TRTSEQPN are present, then on a given record, either both must be populated or both must be null.
Check:
  all:
    - name: TRTSEQPN
      operator: non_empty
    - name: TRTSEQP
      operator: empty
Core:
  Id: AD0415
  Status: Draft
  Version: '1'
Description: TRTSEQP must be populated when TRTSEQPN is populated.

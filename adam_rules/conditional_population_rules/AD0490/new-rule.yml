# Variable: LVOTFN
# Condition: LVOTFL is populated
# Rule: LVOTFN must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '490'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3; ADaMIG-MD v1.0'
                Section: '3.3.8; 3.1'
                Item: 'Table 3.3.8.1'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.3.8, Table 3.3.8.1: There must be a one-to-one relationship between LVOTFN and LVOTFL within a dataset.
                  LVOTFN cannot be present unless LVOTFL is also present. When LVOTFL and LVOTFN are present, then on a given record, either both must be populated or both must be null.
                  
                  ADaMIG-MD v1.0, Section 3.1: MDBDS and MDOCCDS support analysis needs by adding SPDEVID as a required key variable and USUBJID as a conditionally required variable. See the BDS and OCCDS class for further details.
Check:
  all:
    - name: LVOTFL
      operator: non_empty
    - name: LVOTFN
      operator: empty
Core:
  Id: AD0490
  Status: Draft
  Version: '1'
Description: 'LVOTFN must be populated when LVOTFL is populated.'
Executability: Fully Executable
Outcome:
  Message: 'LVOTFN is not populated when LVOTFL is populated.'
  Output Variables:
    - LVOTFN
    - LVOTFL
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - BDS
      - MDBDS
      - OCCDS
      - MDOCCDS
  Domains:
    Include:
      - ALL
Sensitivity: Record

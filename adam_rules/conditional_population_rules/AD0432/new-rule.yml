# Variable: APHASE
# Condition: APHASEN is populated
# Rule: APHASE must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '432'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3; ADaMIG-MD v1.0'
                Section: '3.3.3; 3.1'
                Item: 'Table 3.3.3.1'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.3.3, Table 3.3.3.1: There must be a one-to-one relationship between APHASEN and APHASE within a study, which must be the same as the one-to-one mapping between w and APHASEw in ADSL.
                  APHASEN cannot be present unless APHASE is also present. When APHASE and APHASEN are present, then on a given record, either both must be populated or both must be null.
                  
                  ADaMIG-MD v1.0, Section 3.1: MDBDS and MDOCCDS support analysis needs by adding SPDEVID as a required key variable and USUBJID as a conditionally required variable. See the BDS and OCCDS class for further details.
Check:
  all:
    - name: APHASEN
      operator: non_empty
    - name: APHASE
      operator: empty
Core:
  Id: AD0432
  Status: Draft
  Version: '1'
Description: APHASE must be populated when APHASEN is populated.
Executability: Fully Executable
Outcome:
  Message: APHASE is not populated when APHASEN is populated.
  Output Variables:
    - APHASE
    - APHASEN
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - BDS
      - MDBDS
      - OCCDS
      - MDOCCDS
  Domains:
    Include:
      - ALL
Sensitivity: Record

# Variable: DTHCAUSN
# Condition: DTHCAUS is populated
# Rule: DTHCAUSN must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '448'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3'
                Section: '3.2'
                Item: 'Table 3.2.8'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.2, Table 3.2.8: There must be a one-to-one relationship between DTHCAUSN and DTHCAUS within a study.
                  DTHCAUSN cannot be present unless DTHCAUS is also present. When DTHCAUS and DTHCAUSN are present, then on a given record, either both must be populated or both must be null.
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '448'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.2'
                Section: '3.2'
                Item: 'Table 3.2.8'
                Cited Guidance: |-
                  ADaMIG v1.2, Section 3.2, Table 3.2.8: There must be a one-to-one relationship between DTHCAUSN and DTHCAUS within a study.
                  DTHCAUSN cannot be present unless DTHCAUS is also present. When DTHCAUS and DTHCAUSN are present, then on a given record, either both must be populated or both must be null.
Check:
  all:
    - name: DTHCAUS
      operator: non_empty
    - name: DTHCAUSN
      operator: empty
Core:
  Id: AD0448
  Status: Draft
  Version: '1'
Description: DTHCAUSN must be populated when DTHCAUS is populated.
Executability: Fully Executable
Outcome:
  Message: DTHCAUSN is not populated when DTHCAUS is populated.
  Output Variables:
    - DTHCAUSN
    - DTHCAUS
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - ADSL
  Domains:
    Include:
      - ALL
Sensitivity: Record

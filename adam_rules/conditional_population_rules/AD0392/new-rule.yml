# Variable: ATOXGR
# Condition: ATOXGRN is populated
# Rule: ATOXGR must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '392'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3; ADaMIG-MD v1.0'
                Section: '3.3.7; 3.1'
                Item: 'Table 3.3.7.1'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.3.7,  Table 3.3.7.1: There must be a one-to-one relationship between ATOXGRN and ATOXGR within a parameter.
                  ATOXGRN cannot be present unless ATOXGR is also present. When ATOXGR and ATOXGRN are present, then on a given record, either both must be populated or both must be null.
                  
                  ADaMIG-MD v1.0, Section 3.1: MDBDS and MDOCCDS support analysis needs by adding SPDEVID as a required key variable and USUBJID as a conditionally required variable. See the BDS and OCCDS class for further details.
Check:
  all:
    - name: ATOXGRN
      operator: non_empty
    - name: ATOXGR
      operator: empty
Core:
  Id: AD0392
  Status: Draft
  Version: '1'
Description: 'ATOXGR must be populated when ATOXGRN is populated.'
Executability: Fully Executable
Outcome:
  Message: 'ATOXGR is not populated when ATOXGRN is populated.'
  Output Variables:
    - ATOXGR
    - ATOXGRN
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - BDS
      - MDBDS
      - OCCDS
      - MDOCCDS
  Domains:
    Include:
      - ALL
Sensitivity: Record

# Variable: TRTSEQPN
# Condition: TRTSEQP is populated
# Rule: TRTSEQPN must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '416'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3'
                Section: '3.2'
                Item: 'Table 3.2.4'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.2, Table 3.2.4: There must be a one-to-one relationship between TRTSEQPN and TRTSEQP within a study.
                  TRTSEQPN cannot be present unless TRTSEQP is also present. When TRTSEQP and TRTSEQPN are present, then on a given record, either both must be populated or both must be null.
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '416'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.2'
                Section: '3.2'
                Item: 'Table 3.2.4'
                Cited Guidance: |-
                  ADaMIG v1.2, Section 3.2, Table 3.2.4: There must be a one-to-one relationship between TRTSEQPN and TRTSEQP within a study.
                  TRTSEQPN cannot be present unless TRTSEQP is also present. When TRTSEQP and TRTSEQPN are present, then on a given record, either both must be populated or both must be null.
Check:
  all:
    - name: TRTSEQP
      operator: non_empty
    - name: TRTSEQPN
      operator: empty
Core:
  Id: AD0416
  Status: Draft
  Version: '1'
Description: TRTSEQPN must be populated when TRTSEQP is populated.
Executability: Fully Executable
Outcome:
  Message: TRTSEQPN is not populated when TRTSEQP is populated.
  Output Variables:
    - TRTSEQPN
    - TRTSEQP
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - ADSL
  Domains:
    Include:
      - ALL
Sensitivity: Record

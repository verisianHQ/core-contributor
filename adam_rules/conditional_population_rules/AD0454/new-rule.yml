# Variable: SHIFTyN
# Condition: SHIFTy is populated
# Rule: SHIFTyN must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '454'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3; ADaMIG-MD v1.0'
                Section: '3.3.4.1; 3.1'
                Item: 'Table 3.3.4.1.1'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.3.4.1, Table 3.3.4.1.1: There must be a one-to-one relationship between SHIFTyN and SHIFTy within a parameter.SHIFTyN cannot be present unless SHIFTy is also present. When SHIFTy and SHIFTyN are present, then on a given record, either both must be populated or both must be null.
                  
                  ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis needs by adding SPDEVID as a required key variable and USUBJID as a conditionally required variable. See the BDS class for further details.
Check:
  all:
    - name: '^SHIFT(?P<y>[1-9][0-9]?)$'
      variable_regex_pattern: true
      operator: non_empty
    - name: 'SHIFT{{y}}N'
      operator: empty
Core:
  Id: AD0454
  Status: Draft
  Version: '1'
Description: SHIFTyN must be populated when SHIFTy is populated.
Executability: Fully Executable
Outcome:
  Message: SHIFTyN is not populated when SHIFTy is populated.
  Output Variables:
    - 'SHIFT{{y}}N'
    - 'SHIFT{{y}}'
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - BDS
      - MDBDS
  Domains:
    Include:
      - ALL
Sensitivity: Record

# Variable: TRTAGy
# Condition: TRTAGyN is populated
# Rule: TRTAGy must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '426'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3; ADaMIG-MD v1.0'
                Section: '3.3.2; 3.1'
                Item: 'Table 3.3.2.1'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.3.2, Table 3.3.2.1: There must be a one-to-one relationship between TRTAGyN and TRTAGy within a study.
                  TRTAGyN cannot be present unless TRTAGy is also present. When TRTAGy and TRTAGyN are present, then on a given record, either both must be populated or both must be null.
                  
                  ADaMIG-MD v1.0, Section 3.1: MDBDS and MDOCCDS support analysis needs by adding SPDEVID as a required key variable and USUBJID as a conditionally required variable. See the BDS and OCCDS class for further details.
Check:
  all:
    - name: '^TRTAG(?P<y>[1-9][0-9]?)N$'
      variable_regex_pattern: true
      operator: non_empty
    - name: 'TRTAG{{y}}'
      operator: empty
Core:
  Id: AD0426
  Status: Draft
  Version: '1'
Description: TRTAGy must be populated when TRTAGyN is populated.
Executability: Fully Executable
Outcome:
  Message: TRTAGy is not populated when TRTAGyN is populated.
  Output Variables:
    - 'TRTAG{{y}}'
    - 'TRTAG{{y}}N'
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - BDS
      - MDBDS
      - OCCDS
      - MDOCCDS
  Domains:
    Include:
      - ALL
Sensitivity: Record

# Variable: STRATwVN
# Condition: STRATwV is populated
# Rule: STRATwVN must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '478'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3'
                Section: '3.2'
                Item: 'Table 3.2.9'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.2, Table 3.2.9: There must be a one-to-one relationship between STRATwVN and STRATwV within a study.
                  STRATwVN cannot be present unless STRATwV is also present. When STRATwV and STRATwVN are present, then on a given record, either both must be populated or both must be null.
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '478'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.2'
                Section: '3.2'
                Item: 'Table 3.2.9'
                Cited Guidance: |-
                  ADaMIG v1.2, Section 3.2, Table 3.2.9: There must be a one-to-one relationship between STRATwVN and STRATwV within a study.
                  STRATwVN cannot be present unless STRATwV is also present. When STRATwV and STRATwVN are present, then on a given record, either both must be populated or both must be null.
Check:
  all:
    - name: '^STRAT(?P<w>[1-9])V$'
      variable_regex_pattern: true
      operator: non_empty
    - name: 'STRAT{{w}}VN'
      operator: empty
Core:
  Id: AD0478
  Status: Draft
  Version: '1'
Description: 'STRATwVN must be populated when STRATwV is populated.'
Executability: Fully Executable
Outcome:
  Message: 'STRATwVN is not populated when STRATwV is populated.'
  Output Variables:
    - 'STRAT{{w}}VN'
    - 'STRAT{{w}}V'
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - ADSL
  Domains:
    Include:
      - ALL
Sensitivity: Record

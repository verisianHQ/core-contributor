# Variable: STRATAV
# Condition: STRATAVN is populated
# Rule: STRATAV must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '475'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3'
                Section: '3.2'
                Item: 'Table 3.2.9'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.2, Table 3.2.9: There must be a one-to-one relationship between STRATAVN and STRATAV within a study.
                  STRATAVN cannot be present unless STRATAV is also present. When STRATAV and STRATAVN are present, then on a given record, either both must be populated or both must be null.
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '475'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.2'
                Section: '3.2'
                Item: 'Table 3.2.9'
                Cited Guidance: |-
                  ADaMIG v1.2, Section 3.2, Table 3.2.9: There must be a one-to-one relationship between STRATAVN and STRATAV within a study.
                  STRATAVN cannot be present unless STRATAV is also present. When STRATAV and STRATAVN are present, then on a given record, either both must be populated or both must be null.
Check:
  all:
    - name: STRATAVN
      operator: non_empty
    - name: STRATAV
      operator: empty
Core:
  Id: AD0475
  Status: Draft
  Version: '1'
Description: 'STRATAV must be populated when STRATAVN is populated.'
Executability: Fully Executable
Outcome:
  Message: 'STRATAV is not populated when STRATAVN is populated.'
  Output Variables:
    - STRATAV
    - STRATAVN
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - ADSL
  Domains:
    Include:
      - ALL
Sensitivity: Record

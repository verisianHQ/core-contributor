# Variable: DEVGRy
# Condition: DEVGRyN is populated
# Rule: DEVGRy must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG-MD
        Version: '1.0'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '676'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG-MD v1.0'
                Section: '3.2.1.2'
                Item: 'None'
                Cited Guidance: |-
                  ADaMIG-MD v1.0, Section 3.2.1.2: DEVGRyN cannot be present unless DEVGRy is also present. When DEVGRy and DEVGRyN are present, then on a given record, either both must be populated or both must be null.
Check:
  all:
    - name: '^DEVGR(?P<y>[1-9][0-9]?)N$'
      variable_regex_pattern: true
      operator: non_empty
    - name: 'DEVGR{{y}}'
      operator: empty
Core:
  Id: AD0676
  Status: Draft
  Version: '1'
Description: 'DEVGRy must be populated when DEVGRyN is populated.'
Executability: Fully Executable
Outcome:
  Message: 'DEVGRy is not populated when DEVGRyN is populated.'
  Output Variables:
    - 'DEVGR{{y}}'
    - 'DEVGR{{y}}N'
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - ADAM OTHER
  Domains:
    Include:
      - ALL
Sensitivity: Record

# Variable: CRITyFL
# Condition: CRITyFN is populated
# Rule: CRITyFL must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '487'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3; ADaMIG-MD v1.0'
                Section: '3.3.4.3; 3.1'
                Item: 'Table 3.3.4.3.1'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.3.4.3, Table 3.3.4.3.1: There must be a one-to-one relationship between CRITyFN and CRITyFL within a parameter.
                  CRITyFN cannot be present unless CRITyFL is also present. When CRITyFL and CRITyFN are present, then on a given record, either both must be populated or both must be null.
                  
                  ADaMIG-MD v1.0, Section 3.1: MDBDS and MDOCCDS support analysis needs by adding SPDEVID as a required key variable and USUBJID as a conditionally required variable. See the BDS and OCCDS class for further details.
Check:
  all:
    - name: '^CRIT(?P<y>[1-9][0-9]?)FN$'
      variable_regex_pattern: true
      operator: non_empty
    - name: 'CRIT{{y}}FL'
      operator: empty
Core:
  Id: AD0487
  Status: Draft
  Version: '1'
Description: 'CRITyFL must be populated when CRITyFN is populated.'
Executability: Fully Executable
Outcome:
  Message: 'CRITyFL is not populated when CRITyFN is populated.'
  Output Variables:
    - 'CRIT{{y}}FL'
    - 'CRIT{{y}}FN'
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - BDS
      - MDBDS
      - OCCDS
      - MDOCCDS
  Domains:
    Include:
      - ALL
Sensitivity: Record

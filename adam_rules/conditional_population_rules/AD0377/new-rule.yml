# Variable: TRTxxPN
# Condition: TRTxxP is populated
# Rule: TRTxxPN must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '377'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3'
                Section: '3.2'
                Item: 'Table 3.2.4'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.2, Table 3.2.4: There must be a one-to-one relationship between TRTxxPN and TRTxxP within a study.  TRTxxPN cannot be present unless TRTxxP is also present. When TRTxxP and TRTxxPN are present, then on a given record, either both must be populated or both must be null.
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '377'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.2'
                Section: '3.2'
                Item: 'Table 3.2.4'
                Cited Guidance: |-
                  ADaMIG v1.2, Section 3.2, Table 3.2.4: There must be a one-to-one relationship between TRTxxPN and TRTxxP within a study.  TRTxxPN cannot be present unless TRTxxP is also present. When TRTxxP and TRTxxPN are present, then on a given record, either both must be populated or both must be null.
Check:
  all:
    - name: '^TRT(?P<xx>0[1-9]|[1-9][0-9])P$'
      variable_regex_pattern: true
      operator: non_empty
    - name: 'TRT{{xx}}PN'
      operator: empty
Core:
  Id: AD0377
  Status: Draft
  Version: '1'
Description: 'TRTxxPN must be populated when TRTxxP is populated.'
Executability: Fully Executable
Outcome:
  Message: 'TRTxxPN is not populated when TRTxxP is populated.'
  Output Variables:
    - 'TRT{{xx}}PN'
    - 'TRT{{xx}}P'
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - ADSL
  Domains:
    Include:
      - ALL
Sensitivity: Record

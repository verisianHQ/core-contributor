# Variable: ARELTMU
# Condition: ARELTM is populated
# Rule: ARELTMU must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '112'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3; ADaMIG-MD v1.0'
                Section: '3.3.3; 3.1'
                Item: 'Table 3.3.3.1'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.3.3, Table 3.3.3.1: When ARELTM is present, the anchor time variable and ARELTMU must also be included in the dataset, and the anchor time variable must be identified in the metadata for ARELTM.
                  
                  ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis needs by adding SPDEVID as a required key variable and USUBJID as a conditionally required variable. See the BDS class for further details.
Check:
  all:
    - name: ARELTM
      operator: non_empty
    - name: ARELTMU
      operator: empty
Core:
  Id: AD0112
  Status: Draft
  Version: '1'
Description: 'ARELTMU must be populated when ARELTM is populated.'
Executability: Fully Executable
Outcome:
  Message: 'ARELTMU is not populated when ARELTM is populated.'
  Output Variables:
    - ARELTMU
    - ARELTM
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - BDS
      - MDBDS
  Domains:
    Include:
      - ALL
Sensitivity: Record

# Variable: PARCATyN
# Condition: PARCATy is populated
# Rule: PARCATyN must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '445'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3; ADaMIG-MD v1.0'
                Section: '3.3.4.1; 3.1'
                Item: 'Table 3.3.4.1.1'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.3.4.1, Table 3.3.4.1.1: There must be a one-to-one relationship between PARCATy and PARCATyN within a dataset.
                  PARCATyN cannot be present unless PARCATy is also present. When PARCATy and PARCATyN are present, then on a given record, either both must be populated or both must be null.
                  
                  ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis needs by adding SPDEVID as a required key variable and USUBJID as a conditionally required variable. See the BDS class for further details.
Check:
  all:
    - name: '^PARCAT(?P<y>[1-9])$'
      variable_regex_pattern: true
      operator: non_empty
    - name: 'PARCAT{{y}}N'
      operator: empty
Core:
  Id: AD0445
  Status: Draft
  Version: '1'
Description: PARCATyN must be populated when PARCATy is populated.
Executability: Fully Executable
Outcome:
  Message: PARCATyN is not populated when PARCATy is populated.
  Output Variables:
    - 'PARCAT{{y}}N'
    - 'PARCAT{{y}}'
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - BDS
      - MDBDS
  Domains:
    Include:
      - ALL
Sensitivity: Record

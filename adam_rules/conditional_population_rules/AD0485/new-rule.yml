# Variable: PBCHGCAy
# Condition: PBCHGCyN is populated
# Rule: PBCHGCAy must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '485'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3; ADaMIG-MD v1.0'
                Section: '3.3.4.1; 3.1'
                Item: 'Table 3.3.4.1.1'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.3.4.1, Table 3.3.4.1.1: There must be a one-to-one relationship between PBCHGCyN and PBCHGCAy within a parameter.
                  PBCHGCyN cannot be present unless PBCHGCAy is also present. When PBCHGCAy and PBCHGCyN are present, then on a given record, either both must be populated or both must be null.
                  
                  ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis needs by adding SPDEVID as a required key variable and USUBJID as a conditionally required variable. See the BDS class for further details.
Check:
  all:
    - name: '^PBCHGC(?P<y>[1-9])N$'
      variable_regex_pattern: true
      operator: non_empty
    - name: 'PBCHGCA{{y}}'
      operator: empty
Core:
  Id: AD0485
  Status: Draft
  Version: '1'
Description: 'PBCHGCAy must be populated when PBCHGCyN is populated.'
Executability: Fully Executable
Outcome:
  Message: 'PBCHGCAy is not populated when PBCHGCyN is populated.'
  Output Variables:
    - 'PBCHGCA{{y}}'
    - 'PBCHGC{{y}}N'
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - BDS
      - MDBDS
  Domains:
    Include:
      - ALL
Sensitivity: Record

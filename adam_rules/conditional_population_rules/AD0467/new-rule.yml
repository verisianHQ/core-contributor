# Variable: STRATAR
# Condition: STRATARN is populated
# Rule: STRATAR must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '467'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3'
                Section: '3.2'
                Item: 'Table 3.2.9'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.2, Table 3.2.9: There must be a one-to-one relationship between STRATARN and STRATAR within a study.
                  STRATARN cannot be present unless STRATAR is also present. When STRATAR and STRATARN are present, then on a given record, either both must be populated or both must be null.
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '467'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.2'
                Section: '3.2'
                Item: 'Table 3.2.9'
                Cited Guidance: |-
                  ADaMIG v1.2, Section 3.2, Table 3.2.9: There must be a one-to-one relationship between STRATARN and STRATAR within a study.
                  STRATARN cannot be present unless STRATAR is also present. When STRATAR and STRATARN are present, then on a given record, either both must be populated or both must be null.
Check:
  all:
    - name: STRATARN
      operator: non_empty
    - name: STRATAR
      operator: empty
Core:
  Id: AD0467
  Status: Draft
  Version: '1'
Description: STRATAR must be populated when STRATARN is populated.
Executability: Fully Executable
Outcome:
  Message: STRATAR is not populated when STRATARN is populated.
  Output Variables:
    - STRATAR
    - STRATARN
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - ADSL
  Domains:
    Include:
      - ALL
Sensitivity: Record

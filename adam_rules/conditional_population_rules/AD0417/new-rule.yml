# Variable: TRTSEQA
# Condition: TRTSEQAN is populated
# Rule: TRTSEQA must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '417'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3'
                Section: '3.2'
                Item: 'Table 3.2.4'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.2, Table 3.2.4: There must be a one-to-one relationship between TRTSEQAN and TRTSEQA within a study.
                  TRTSEQAN cannot be present unless TRTSEQA is also present. When TRTSEQA and TRTSEQAN are present, then on a given record, either both must be populated or both must be null.
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '417'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.2'
                Section: '3.2'
                Item: 'Table 3.2.4'
                Cited Guidance: |-
                  ADaMIG v1.2, Section 3.2, Table 3.2.4: There must be a one-to-one relationship between TRTSEQAN and TRTSEQA within a study.
                  TRTSEQAN cannot be present unless TRTSEQA is also present. When TRTSEQA and TRTSEQAN are present, then on a given record, either both must be populated or both must be null.
Check:
  all:
    - name: TRTSEQAN
      operator: non_empty
    - name: TRTSEQA
      operator: empty
Core:
  Id: AD0417
  Status: Draft
  Version: '1'
Description: TRTSEQA must be populated when TRTSEQAN is populated.
Executability: Fully Executable
Outcome:
  Message: TRTSEQA is not populated when TRTSEQAN is populated.
  Output Variables:
    - TRTSEQA
    - TRTSEQAN
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - ADSL
  Domains:
    Include:
      - ALL
Sensitivity: Record

# Variable: COHORTC
# Condition: COHORT is populated
# Rule: COHORTC must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADPPKIG
        Version: '1.0'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '860'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: 'ADPPKIG v1.0'
                Section: '3.2'
                Item: 'Table 3.2'
                Cited Guidance: |-
                  ADPPKIG v1.0, Section 3.2, Table 3.2: Character representation of the COHORT variable. There must be a one-to-one mapping to COHORT. The character versions of the primary/character variables can be assigned from its corresponding numeric pair variable.
Check:
  all:
    - name: COHORT
      operator: non_empty
    - name: COHORTC
      operator: empty
Core:
  Id: AD0860
  Status: Draft
  Version: '1'
Description: 'COHORTC must be populated when COHORT is populated.'
Executability: Fully Executable
Outcome:
  Message: 'COHORTC is not populated when COHORT is populated.'
  Output Variables:
    - COHORTC
    - COHORT
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - BDS
  Domains:
    Include:
      - ALL
Sensitivity: Record

# Variable: REGIONy
# Condition: REGIONyN is populated
# Rule: REGIONy must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '453'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3'
                Section: '3.2'
                Item: 'Table 3.2.1'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.2, Table 3.2.1: There must be a one-to-one relationship between REGIONyN and REGIONy within a study.
                  REGIONyN cannot be present unless REGIONy is also present. When REGIONy and REGIONyN are present, then on a given record, either both must be populated or both must be null.
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '453'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.2'
                Section: '3.2'
                Item: 'Table 3.2.1'
                Cited Guidance: |-
                  ADaMIG v1.2, Section 3.2, Table 3.2.1: There must be a one-to-one relationship between REGIONyN and REGIONy within a study.
                  REGIONyN cannot be present unless REGIONy is also present. When REGIONy and REGIONyN are present, then on a given record, either both must be populated or both must be null.
Check:
  all:
    - name: '^REGION(?P<y>[1-9])N$'
      variable_regex_pattern: true
      operator: non_empty
    - name: 'REGION{{y}}'
      operator: empty
Core:
  Id: AD0453
  Status: Draft
  Version: '1'
Description: REGIONy must be populated when REGIONyN is populated.
Executability: Fully Executable
Outcome:
  Message: REGIONy is not populated when REGIONyN is populated.
  Output Variables:
    - 'REGION{{y}}'
    - 'REGION{{y}}N'
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - ADSL
  Domains:
    Include:
      - ALL
Sensitivity: Record

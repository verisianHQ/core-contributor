# Variable: MCRITyML
# Condition: MCRITyMN is populated
# Rule: MCRITyML must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '451'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3; ADaMIG-MD v1.0'
                Section: '3.3.4.3; 3.1'
                Item: 'Table 3.3.4.3.1'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.3.4.3, Table 3.3.4.3.1: There must be a one-to-one relationship between MCRITyMN and MCRITyML within a parameter. Content is sponsor-defined.
                  MCRITyMN cannot be present unless MCRITyML is also present. When MCRITyML and MCRITyMN are present, then on a given record, either both must be populated or both must be null.
                  
                  ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis needs by adding SPDEVID as a required key variable and USUBJID as a conditionally required variable. See the BDS class for further details.
Check:
  all:
    - name: '^MCRIT(?P<y>[1-9])MN$'
      variable_regex_pattern: true
      operator: non_empty
    - name: 'MCRIT{{y}}ML'
      operator: empty
Core:
  Id: AD0451
  Status: Draft
  Version: '1'
Description: MCRITyML must be populated when MCRITyMN is populated.
Executability: Fully Executable
Outcome:
  Message: MCRITyML is not populated when MCRITyMN is populated.
  Output Variables:
    - 'MCRIT{{y}}ML'
    - 'MCRIT{{y}}MN'
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - BDS
      - MDBDS
  Domains:
    Include:
      - ALL
Sensitivity: Record

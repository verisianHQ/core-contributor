# Variable: TRCMPGy
# Condition: TRCMPGyN is populated
# Rule: TRCMPGy must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '465'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3'
                Section: '3.2'
                Item: 'Table 3.2.8'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.2, Table 3.2.8: There must be a one-to-one relationship between TRCMPGyN and TRCMPGy within a study.
                  TRCMPGyN cannot be present unless TRCMPGy is also present. When TRCMPGy and TRCMPGyN are present, then on a given record, either both must be populated or both must be null.
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '465'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.2'
                Section: '3.2'
                Item: 'Table 3.2.8'
                Cited Guidance: |-
                  ADaMIG v1.2, Section 3.2, Table 3.2.8: There must be a one-to-one relationship between TRCMPGyN and TRCMPGy within a study.
                  TRCMPGyN cannot be present unless TRCMPGy is also present. When TRCMPGy and TRCMPGyN are present, then on a given record, either both must be populated or both must be null.
Check:
  all:
    - name: '^TRCMPG(?P<y>[1-9])N$'
      variable_regex_pattern: true
      operator: non_empty
    - name: 'TRCMPG{{y}}'
      operator: empty
Core:
  Id: AD0465
  Status: Draft
  Version: '1'
Description: TRCMPGy must be populated when TRCMPGyN is populated.
Executability: Fully Executable
Outcome:
  Message: TRCMPGy is not populated when TRCMPGyN is populated.
  Output Variables:
    - 'TRCMPG{{y}}'
    - 'TRCMPG{{y}}N'
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - ADSL
  Domains:
    Include:
      - ALL
Sensitivity: Record

# Variable: ATOXGRL
# Condition: ATOXGRLN is populated
# Rule: ATOXGRL must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '394'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: 'ADaMIG v1.3; ADaMIG-MD v1.0'
                Section: '3.3.7; 3.1'
                Item: 'Table 3.3.7.1'
                Cited Guidance: |-
                  ADaMIG v1.3, Section 3.3.7, Table 3.3.7.1: There must be a one-to-one relationship between ATOXGRLN and ATOXGRL within a parameter.
                  ATOXGRLN cannot be present unless ATOXGRL is also present. When ATOXGRL and ATOXGRLN are present, then on a given record, either both must be populated or both must be null.
                  
                  ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis needs by adding SPDEVID as a required key variable and USUBJID as a conditionally required variable. See the BDS class for further details.
Check:
  all:
    - name: ATOXGRLN
      operator: non_empty
    - name: ATOXGRL
      operator: empty
Core:
  Id: AD0394
  Status: Draft
  Version: '1'
Description: 'ATOXGRL must be populated when ATOXGRLN is populated.'
Executability: Fully Executable
Outcome:
  Message: 'ATOXGRL is not populated when ATOXGRLN is populated.'
  Output Variables:
    - ATOXGRL
    - ATOXGRLN
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - BDS
      - MDBDS
  Domains:
    Include:
      - ALL
Sensitivity: Record

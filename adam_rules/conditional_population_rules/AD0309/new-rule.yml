# Variable: SMQzzCD
# Condition: SMQzzSC is populated
# Rule: SMQzzCD must be populated
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: OCCDS
        Version: '1.1'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '309'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: 'OCCDS v1.0; OCCDS v1.1; ADaMIG-MD v1.0'
                Section: '3.2.9; 3.2.9; 3.1'
                Item: 'Table 3.2.9.1; Table 3.2.9.1'
                Cited Guidance: |-
                  OCCDS v1.0, Section 3.2.9, Table 3.2.9.1: CDISC Notes state: "Conditional on whether SMQ analysis is done."
                  
                  OCCDS v1.1, Section 3.2.9, Table 3.2.9.1: CDISC Notes state: "Conditional on whether SMQ analysis is done."
                  
                  ADaMIG-MD v1.0, Section 3.1: The MDOCCDS supports analysis needs by adding SPDEVID as a required identifier and allowing USUBJID be a conditionally required variable. See the OCCDS class for further details.
Check:
  all:
    - name: '^SMQ(?P<zz>0[1-9]|[1-9][0-9])SC$'
      variable_regex_pattern: true
      operator: non_empty
    - name: 'SMQ{{zz}}CD'
      operator: empty
Core:
  Id: AD0309
  Status: Draft
  Version: '1'
Description: 'SMQzzCD must be populated when SMQzzSC is populated.'
Executability: Fully Executable
Outcome:
  Message: 'SMQzzCD is not populated when SMQzzSC is populated.'
  Output Variables:
    - 'SMQ{{zz}}CD'
    - 'SMQ{{zz}}SC'
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - OCCDS
      - MDOCCDS
  Domains:
    Include:
      - ALL
Sensitivity: Record

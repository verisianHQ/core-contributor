# Variable: PHEDTM
# Condition: 
# Rule: On a given record, APHASEN is present and the value of PHEDTM is not equal to the value of variable PHwEDTM where w equals the value of APHASEN
# verified
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.2'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '615'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.2
        Section: 3.3.3
        Item: ''
        Cited Guidance: 'ADaMIG v1.2, Section 3.3.3: The values of period, subperiod,
          and phase start (and end) timing variables must be consistent with their
          subject-level counterparts from ADSL as described in Table 3.2.7 for each
          value of APERIOD, ASPER, and APHASE, respectively.'
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '615'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3
        Section: 3.3.3
        Item: ''
        Cited Guidance: 'ADaMIG v1.3, Section 3.3.3: The values of period, subperiod,
          and phase start (and end) timing variables must be consistent with their
          subject-level counterparts from ADSL as described in Table 3.2.7 for each
          value of APERIOD, ASPER, and APHASE, respectively.'
Check:
  all:
    - name: APHASEN
      operator: non_empty
    - name: PHEDTM
      operator: non_empty
    - name: PH{{APHASEN}}EDTM
      operator: not_equal_to
      value: PHEDTM
Core:
  Id: AD0615
  Status: Draft
  Version: '1'
Description: Raise an error when on a given record, APHASEN is present and the value of PHEDTM is not equal to the value of variable PHwEDTM where w equals the value of APHASEN.
Executability: Fully Executable
Outcome:
  Message: PHEDTM is not equal to PHwEDTM selected by APHASEN.
  Output Variables:
    - APHASEN
    - PHEDTM
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - ALL
  Domains:
    Include:
      - ALL
Sensitivity: Record

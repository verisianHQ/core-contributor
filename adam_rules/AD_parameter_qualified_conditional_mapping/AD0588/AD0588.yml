# Variable: PBCHGCAy where y is an integer [1-9, not zero-padded]
# Condition: On rows where both PBCHGCAy and PBCHGCyN are both populated
# Rule: Within a parameter, there is more than one value of PBCHGCAy for a given value of PBCHGCyN
# verified
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.2'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '588'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.2
        Section: 3.3.4.1
        Item: 3.3.4.1.1
        Cited Guidance: 'ADaMIG v1.2, Section 3.3.4.1, Table 3.3.4.1.1: There must
          be a one-to-one relationship between PBCHGCyN and PBCHGCAy within a parameter.'
      - Document: ADaMIG v1.2
        Section: 3.3.4.1
        Item: 3.3.4.1.1
        Cited Guidance: PBCHGCyN cannot be present unless PBCHGCAy is also present.
          When PBCHGCAy and PBCHGCyN are present, then on a given record, either both
          must be populated or both must be null.
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '588'
        Version: '2'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3
        Section: 3.3.4.1
        Item: 3.3.4.1.1
        Cited Guidance: |-
          ADaMIG v1.3, Section 3.3.4.1, Table 3.3.4.1.1: There must be a one-to-one relationship between PBCHGCyN and PBCHGCAy within a parameter.
          PBCHGCyN cannot be present unless PBCHGCAy is also present. When PBCHGCAy and PBCHGCyN are present, then on a given record, either both must be populated or both must be null.
      - Document: ADaMIG-MD v1.0
        Section: '3.1'
        Item: 3.3.4.1.1
        Cited Guidance: 'ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis
          needs by adding SPDEVID as a required key variable and USUBJID as a conditionally
          required variable. See the BDS class for further details.'
Check:
  all:
  - name: ^PBCHGCA(?P<y>[1-9][0-9]?)$
    variable_regex_pattern: true
    operator: is_inconsistent_across_dataset
    value:
    - PARAMCD
    - PBCHGC{{y}}N
    where_populated: true
Core:
  Id: AD0588
  Status: Draft
  Version: '1'
Description: Raise an error when within a parameter, there is more than one value of PBCHGCAy for a given value of PBCHGCyN, considering only those rows on which both variables are populated.
Executability: Fully Executable
Outcome:
  Message: PBCHGCAy has more than one value for a given PBCHGCyN value within a parameter.
  Output Variables:
  - PBCHGCA{{y}}
  - PARAMCD
  - PBCHGC{{y}}N
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BASIC DATA STRUCTURE
  Domains:
    Include:
    - ALL
Sensitivity: Record

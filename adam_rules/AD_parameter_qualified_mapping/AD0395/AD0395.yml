# Variable: ATOXGRL
# Condition: On rows where both ATOXGRL and ATOXGRLN are both populated
# Rule: Within a parameter, there is more than one value of ATOXGRL for a given value of ATOXGRLN
# verified
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.2'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '395'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.2
        Section: 3.3.7
        Item: Table 3.3.7.1
        Cited Guidance: 'ADaMIG v1.2, Section 3.3.7, Table 3.3.7.1: There must be
          a one-to-one relationship between ATOXGRLN and ATOXGRL within a parameter.'
      - Document: ADaMIG v1.2
        Section: 3.3.7
        Item: Table 3.3.7.1
        Cited Guidance: ATOXGRLN cannot be present unless ATOXGRL is also present.
          When ATOXGRL and ATOXGRLN are present, then on a given record, either both
          must be populated or both must be null.
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '395'
        Version: '2'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3
        Section: 3.3.7
        Item: Table 3.3.7.1
        Cited Guidance: |-
          ADaMIG v1.3, Section 3.3.7, Table 3.3.7.1: There must be a one-to-one relationship between ATOXGRLN and ATOXGRL within a parameter.
          ATOXGRLN cannot be present unless ATOXGRL is also present. When ATOXGRL and ATOXGRLN are present, then on a given record, either both must be populated or both must be null.
      - Document: ADaMIG-MD v1.0
        Section: '3.1'
        Item: Table 3.3.7.1
        Cited Guidance: 'ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis
          needs by adding SPDEVID as a required key variable and USUBJID as a conditionally
          required variable. See the BDS class for further details.'
Check:
  all:
  - name: ATOXGRL
    operator: is_inconsistent_across_dataset
    value:
    - PARAMCD
    - ATOXGRLN
    where_populated: true
Core:
  Id: AD0395
  Status: Draft
  Version: '1'
Description: Raise an error when within a parameter, there is more than one value of ATOXGRL for a given value of ATOXGRLN, considering only those rows on which both variables are populated.
Executability: Fully Executable
Outcome:
  Message: ATOXGRL has more than one value for a given ATOXGRLN value within a parameter.
  Output Variables:
  - ATOXGRL
  - PARAMCD
  - ATOXGRLN
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BASIC DATA STRUCTURE
  Domains:
    Include:
    - ALL
Sensitivity: Record

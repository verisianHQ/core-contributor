# Variable: PCHGCAyN where y is an integer [1-9, not zero-padded]
# Condition: On rows where both PCHGCAyN and PCHGCATy are both populated
# Rule: Within a parameter, there is more than one value of PCHGCAyN for a given value of PCHGCATy
# verified
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.1'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '334'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.1
        Section: 3.3.4
        Item: Table 3.3.4.1
        Cited Guidance: 'ADaMIG v1.1, Section 3.3.4, Table 3.3.4.1: CDISC Notes for
          PCHGCAyN state: "There must be a one-to-one relationship within a parameter
          between PCHGCATy and PCHGCAyN."'
  - Name: ADaMIG
    Version: '1.2'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '334'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.2
        Section: 3.3.4.1
        Item: Table 3.3.4.1.1
        Cited Guidance: 'ADaMIG v1.2, Section 3.3.4.1, Table 3.3.4.1.1: CDISC Notes
          for PCHGCAyN state: "There must be a one-to-one relationship between PCHGCAyN
          and PCHGCATy within a parameter."'
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '334'
        Version: '2'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3
        Section: 3.3.4.1
        Item: Table 3.3.4.1.1
        Cited Guidance: 'ADaMIG v1.3, Section 3.3.4.1, Table 3.3.4.1.1: CDISC Notes
          for PCHGCAyN state: "There must be a one-to-one relationship between PCHGCAyN
          and PCHGCATy within a parameter."'
      - Document: ADaMIG-MD v1.0
        Section: '3.1'
        Item: Table 3.3.4.1.1
        Cited Guidance: 'ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis
          needs by adding SPDEVID as a required key variable and USUBJID as a conditionally
          required variable. See the BDS class for further details.'
Check:
  all:
  - name: ^PCHGCA(?P<y>[1-9][0-9]?)N$
    variable_regex_pattern: true
    operator: is_inconsistent_across_dataset
    value:
    - PARAMCD
    - PCHGCAT{{y}}
    where_populated: true
Core:
  Id: AD0334
  Status: Draft
  Version: '1'
Description: Raise an error when within a parameter, there is more than one value of PCHGCAyN for a given value of PCHGCATy, considering only those rows on which both variables are populated.
Executability: Fully Executable
Outcome:
  Message: PCHGCAyN has more than one value for a given PCHGCATy value within a parameter.
  Output Variables:
  - PCHGCA{{y}}N
  - PARAMCD
  - PCHGCAT{{y}}
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BASIC DATA STRUCTURE
  Domains:
    Include:
    - ALL
Sensitivity: Record

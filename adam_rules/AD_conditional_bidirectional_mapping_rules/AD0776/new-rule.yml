Check:
  all:
  - name: AERELN
    operator: is_inconsistent_across_dataset
    value: AEREL
    where_populated: true
Core:
  Id: AD0776
  Status: Draft
  Version: '1'
Description: Each AEREL value must map to only one AERELN value when both variables are populated.
Executability: Fully Executable
Outcome:
  Message: AERELN has more than one value for a given AEREL value when both variables are populated.
  Output Variables:
  - AERELN
  - AEREL
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - OCCURRENCE DATA STRUCTURE
  Domains:
    Include:
    - ALL
Sensitivity: Record

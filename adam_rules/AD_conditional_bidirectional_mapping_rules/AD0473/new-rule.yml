# Variable: STRATwRN
# Condition: STRATwRN and STRATwR are populated
# Rule: Each STRATwR value must map to only one STRATwRN value
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.2'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '473'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.2
        Section: '3.2'
        Item: Table 3.2.9
        Cited Guidance: 'ADaMIG v1.2, Section 3.2, Table 3.2.9: There must be a one-to-one relationship between STRATwRN and
          STRATwR within a study.

          STRATwRN cannot be present unless STRATwR is also present. When STRATwR and STRATwRN are present, then on a given
          record, either both must be populated or both must be null.'
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '473'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3
        Section: '3.2'
        Item: Table 3.2.9
        Cited Guidance: 'ADaMIG v1.3, Section 3.2, Table 3.2.9: There must be a one-to-one relationship between STRATwRN and
          STRATwR within a study.

          STRATwRN cannot be present unless STRATwR is also present. When STRATwR and STRATwRN are present, then on a given
          record, either both must be populated or both must be null.'
Check:
  all:
  - name: ^STRAT(?P<w>[1-9])RN$
    variable_regex_pattern: true
    operator: is_inconsistent_across_dataset
    value: STRAT{{w}}R
    where_populated: true
Core:
  Id: AD0473
  Status: Draft
  Version: '1'
Description: Each STRATwR value must map to only one STRATwRN value when both variables are populated.
Executability: Fully Executable
Outcome:
  Message: STRATwRN has more than one value for a given STRATwR value when both variables are populated.
  Output Variables:
  - STRAT{{w}}RN
  - STRAT{{w}}R
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - SUBJECT LEVEL ANALYSIS DATASET
  Domains:
    Include:
    - ALL
Sensitivity: Record

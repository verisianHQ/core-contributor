# Variable: DEVGRyN
# Condition: DEVGRyN and DEVGRy are populated
# Rule: Each DEVGRy value must map to only one DEVGRyN value
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG-MD
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '674'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG-MD v1.0
        Section: 3.2.1.2
        Item: None
        Cited Guidance: 'ADaMIG-MD v1.0, Section 3.2.1.2: Numeric representation of grouping "y" of the pooled device group. 
          There must be a one-to-one relationship between DEVGRyN and DEVGRy within a study.'
Check:
  all:
  - name: ^DEVGR(?P<y>[1-9][0-9]?)N$
    variable_regex_pattern: true
    operator: is_inconsistent_across_dataset
    value: DEVGR{{y}}
    where_populated: true
Core:
  Id: AD0674
  Status: Draft
  Version: '1'
Description: Each DEVGRy value must map to only one DEVGRyN value when both variables are populated.
Executability: Fully Executable
Outcome:
  Message: DEVGRyN has more than one value for a given DEVGRy value when both variables are populated.
  Output Variables:
  - DEVGR{{y}}N
  - DEVGR{{y}}
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - ADAM OTHER
  Domains:
    Include:
    - ALL
Sensitivity: Record

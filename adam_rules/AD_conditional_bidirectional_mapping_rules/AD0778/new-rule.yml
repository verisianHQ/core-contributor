Check:
  all:
  - name: ARELN
    operator: is_inconsistent_across_dataset
    value: AREL
    where_populated: true
Core:
  Id: AD0778
  Status: Draft
  Version: '1'
Description: Each AREL value must map to only one ARELN value when both variables are populated.
Executability: Fully Executable
Outcome:
  Message: ARELN has more than one value for a given AREL value when both variables are populated.
  Output Variables:
  - ARELN
  - AREL
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - OCCURRENCE DATA STRUCTURE
  Domains:
    Include:
    - ALL
Sensitivity: Record

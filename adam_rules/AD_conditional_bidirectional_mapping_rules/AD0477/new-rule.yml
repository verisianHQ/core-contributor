# Variable: STRATAVN
# Condition: STRATAVN and STRATAV are populated
# Rule: Each STRATAV value must map to only one STRATAVN value
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.2'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '477'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.2
        Section: '3.2'
        Item: Table 3.2.9
        Cited Guidance: 'ADaMIG v1.2, Section 3.2, Table 3.2.9: There must be a one-to-one relationship between STRATAVN and
          STRATAV within a study.

          STRATAVN cannot be present unless STRATAV is also present. When STRATAV and STRATAVN are present, then on a given
          record, either both must be populated or both must be null.'
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '477'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3
        Section: '3.2'
        Item: Table 3.2.9
        Cited Guidance: 'ADaMIG v1.3, Section 3.2, Table 3.2.9: There must be a one-to-one relationship between STRATAVN and
          STRATAV within a study.

          STRATAVN cannot be present unless STRATAV is also present. When STRATAV and STRATAVN are present, then on a given
          record, either both must be populated or both must be null.'
Check:
  all:
  - name: STRATAVN
    operator: is_inconsistent_across_dataset
    value: STRATAV
    where_populated: true
Core:
  Id: AD0477
  Status: Draft
  Version: '1'
Description: Each STRATAV value must map to only one STRATAVN value when both variables are populated.
Executability: Fully Executable
Outcome:
  Message: STRATAVN has more than one value for a given STRATAV value when both variables are populated.
  Output Variables:
  - STRATAVN
  - STRATAV
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - SUBJECT LEVEL ANALYSIS DATASET
  Domains:
    Include:
    - ALL
Sensitivity: Record

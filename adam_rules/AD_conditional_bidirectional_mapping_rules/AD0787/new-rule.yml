# Variable: SMQzzSC
# Condition: SMQzzSC and SMQzzSCN are populated
# Rule: Each SMQzzSCN value must map to only one SMQzzSC value
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.1'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '787'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.1
        Section: 3.1.1
        Item: '6'
        Cited Guidance: 'ADaMIG v1.1, Section 3.1.1, Item 6: In a pair of corresponding variables (e.g., TRTP and TRTPN),
          the primary or most commonly used variable does not have the suffix or extension (e.g., N for Numeric or C for Character).
          The relevant suffix is used only on the name of the secondary member of the variable pair. For example, in the (TRTP,
          TRTPN) pair, the primary variable, TRTP is character; but it is not named TRTPC. Similarly in the (APERIOD, APERIODC)
          pair, the primary variable, APERIOD, is numeric; but it is not named APERIODN. When the secondary variable is numeric,
          it can only be included if the primary variable is also present in the dataset. If both variables of a variable
          pair are present, there must be a one-to-one mapping between the values of the two variables, as described in ADaMIG
          v1.1, Section 3.1.1, Item 5.'
  - Name: ADaMIG
    Version: '1.2'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '787'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.2
        Section: 3.1.1
        Item: '6'
        Cited Guidance: 'ADaMIG v1.2, Section 3.1.1, Item 6: In a pair of corresponding variables (e.g., TRTP and TRTPN),
          the primary or most commonly used variable does not have the suffix or extension (i.e., N for Numeric or C for Character).
          The relevant suffix is used only on the name of the secondary member of the variable pair. For example, in the (TRTP,
          TRTPN) pair, the primary variable, TRTP is character; but it is not named TRTPC. Similarly in the (APERIOD, APERIODC)
          pair, the primary variable, APERIOD, is numeric; but it is not named APERIODN. When the secondary variable is included
          in the dataset, then the primary variable must also be included. If both variables of a variable pair are present,
          there must be a one-to-one relationship between the values of the two variables, as described in Item 5 above.'
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '787'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3; ADaMIG-MD v1.0
        Section: 3.1.1; 3.1
        Item: '6'
        Cited Guidance: 'ADaMIG v1.3, Section 3.1.1, Item 6: In a pair of corresponding variables (e.g., TRTP and TRTPN),
          the primary or most commonly used variable does not have the suffix or extension (i.e., N for Numeric or C for Character).
          The relevant suffix is used only on the name of the secondary member of the variable pair. For example, in the (TRTP,
          TRTPN) pair, the primary variable, TRTP is character; but it is not named TRTPC. Similarly in the (APERIOD, APERIODC)
          pair, the primary variable, APERIOD, is numeric; but it is not named APERIODN. When the secondary variable is included
          in the dataset, then the primary variable must also be included. If both variables of a variable pair are present,
          there must be a one-to-one relationship between the values of the two variables, as described in Item 5 above.


          ADaMIG-MD v1.0, Section 3.1: The MDOCCDS supports analysis needs by adding SPDEVID as a required identifier and
          allowing USUBJID be a conditionally required variable. See the OCCDS class for further details.'
Check:
  all:
  - name: ^SMQ(?P<zz>0[1-9]|[1-9][0-9])SC$
    variable_regex_pattern: true
    operator: is_inconsistent_across_dataset
    value: SMQ{{zz}}SCN
    where_populated: true
Core:
  Id: AD0787
  Status: Draft
  Version: '1'
Description: Each SMQzzSCN value must map to only one SMQzzSC value when both variables are populated.
Executability: Fully Executable
Outcome:
  Message: SMQzzSC has more than one value for a given SMQzzSCN value when both variables are populated.
  Output Variables:
  - SMQ{{zz}}SC
  - SMQ{{zz}}SCN
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - OCCURRENCE DATA STRUCTURE
  Domains:
    Include:
    - ALL
Sensitivity: Record

Check:
  all:
  - name: ATOXGR
    operator: is_inconsistent_across_dataset
    value: ATOXGRN
    where_populated: true
Core:
  Id: AD0783
  Status: Draft
  Version: '1'
Description: Each ATOXGRN value must map to only one ATOXGR value when both variables are populated.
Executability: Fully Executable
Outcome:
  Message: ATOXGR has more than one value for a given ATOXGRN value when both variables are populated.
  Output Variables:
  - ATOXGR
  - ATOXGRN
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - OCCURRENCE DATA STRUCTURE
  Domains:
    Include:
    - ALL
Sensitivity: Record

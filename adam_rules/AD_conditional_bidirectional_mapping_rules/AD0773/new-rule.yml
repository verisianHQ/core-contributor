# Variable: SEVGRy
# Condition: SEVGRy and SEVGRyN are populated
# Rule: Each SEVGRyN value must map to only one SEVGRy value
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.1'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '773'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.1; OCCDS v1.0; OCCDS v1.1
        Section: 3.1.1; 3.2.8; 3.2.8
        Item: 6; Table 3.2.8.1; Table 3.2.8.1
        Cited Guidance: 'ADaMIG v1.1, Section 3.1.1, Item 6: In a pair of corresponding variables (e.g., TRTP and TRTPN),
          the primary or most commonly used variable does not have the suffix or extension (e.g., N for Numeric or C for Character).
          The relevant suffix is used only on the name of the secondary member of the variable pair. For example, in the (TRTP,
          TRTPN) pair, the primary variable, TRTP is character; but it is not named TRTPC. Similarly in the (APERIOD, APERIODC)
          pair, the primary variable, APERIOD, is numeric; but it is not named APERIODN. When the secondary variable is numeric,
          it can only be included if the primary variable is also present in the dataset. If both variables of a variable
          pair are present, there must be a one-to-one mapping between the values of the two variables, as described in ADaMIG
          v1.1, Section 3.1.1, Item 5.


          OCCDS v1.0, Section 3.2.8, Table 3.2.8.1: CDISC Notes for SEVGRyN state: "Code SEVGRy to numeric".


          OCCDS v1.1, Section 3.2.8, Table 3.2.8.1: CDISC Notes for SEVGRyN state: "Code SEVGRy to numeric".'

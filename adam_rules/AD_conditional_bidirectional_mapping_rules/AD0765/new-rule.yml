# Variable: TRTAGy
# Condition: TRTAGy and TRTAGyN are populated
# Rule: Each TRTAGyN value must map to only one TRTAGy value
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.1'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '765'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.1
        Section: 3.3.2
        Item: Table 3.3.2.1
        Cited Guidance: 'ADaMIG v1.1, Section 3.3.2, Table 3.3.2.1: TRTAGyN: The numeric code for TRTAGy. One-to-one mapping
          within a study to TRTAGy.'
  - Name: ADaMIG
    Version: '1.2'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '765'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.2
        Section: 3.3.2
        Item: Table 3.3.2.1
        Cited Guidance: 'ADaMIG v1.2, Section 3.3.2, Table 3.3.2.1: TRTAGyN: Numeric representation of TRTAGy. There must
          be a one-to-one relationship between TRTAGyN and TRTAGy within a study.TRTAGyN cannot be present unless TRTAGy is
          also present. When TRTAGy and TRTAGyN are present, then on a given record, either both must be populated or both
          must be null.'
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '765'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3; ADaMIG-MD v1.0
        Section: 3.3.2; 3.1
        Item: Table 3.3.2.1
        Cited Guidance: 'ADaMIG v1.3, Section 3.3.2, Table 3.3.2.1: TRTAGyN: Numeric representation of TRTAGy. There must
          be a one-to-one relationship between TRTAGyN and TRTAGy within a study.TRTAGyN cannot be present unless TRTAGy is
          also present. When TRTAGy and TRTAGyN are present, then on a given record, either both must be populated or both
          must be null.


          ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis needs by adding SPDEVID as a required key variable and
          USUBJID as a conditionally required variable. See the BDS class for further details.'
Check:
  all:
  - name: ^TRTAG(?P<y>[1-9][0-9]?)$
    variable_regex_pattern: true
    operator: is_inconsistent_across_dataset
    value: TRTAG{{y}}N
    where_populated: true
Core:
  Id: AD0765
  Status: Draft
  Version: '1'
Description: Each TRTAGyN value must map to only one TRTAGy value when both variables are populated.
Executability: Fully Executable
Outcome:
  Message: TRTAGy has more than one value for a given TRTAGyN value when both variables are populated.
  Output Variables:
  - TRTAG{{y}}
  - TRTAG{{y}}N
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BASIC DATA STRUCTURE
  Domains:
    Include:
    - ALL
Sensitivity: Record

# Variable: TRTA
# Condition: TRTA and TRTAN are populated
# Rule: Each TRTAN value must map to only one TRTA value
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.1'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '724'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.1
        Section: 3.3.2
        Item: Table 3.3.2.1
        Cited Guidance: 'ADaMIG v1.1, Section 3.3.2, Table 3.3.2.1: TRTAN has The numeric code for TRTA. One-to-one mapping
          within a study to TRTA.'
  - Name: ADaMIG
    Version: '1.2'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '724'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.2
        Section: 3.3.2
        Item: Table 3.3.2.1
        Cited Guidance: 'ADaMIG v1.2, Section 3.3.2, Table 3.3.2.1: Numeric representation of TRTA. There must be a one-to-one
          relationship between TRTAN and TRTA within a study.'
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '724'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3; ADaMIG-MD v1.0
        Section: 3.3.2; 3.1
        Item: Table 3.3.2.1
        Cited Guidance: 'ADaMIG v1.3, Section 3.3.2, Table 3.3.2.1: Numeric representation of TRTA. There must be a one-to-one
          relationship between TRTAN and TRTA within a study.


          ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis needs by adding SPDEVID as a required key variable and
          USUBJID as a conditionally required variable. See the BDS class for further details.'
Check:
  all:
  - name: TRTA
    operator: is_inconsistent_across_dataset
    value: TRTAN
    where_populated: true
Core:
  Id: AD0724
  Status: Draft
  Version: '1'
Description: Each TRTAN value must map to only one TRTA value when both variables are populated.
Executability: Fully Executable
Outcome:
  Message: TRTA has more than one value for a given TRTAN value when both variables are populated.
  Output Variables:
  - TRTA
  - TRTAN
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BASIC DATA STRUCTURE
  Domains:
    Include:
    - ALL
Sensitivity: Record

# Variable: ABLFL
# Condition: ABLFL and ABLFN are populated
# Rule: Each ABLFN value must map to only one ABLFL value
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '410'
        Version: '2'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3; ADaMIG-MD v1.0
        Section: 3.3.8; 3.1
        Item: Table 3.3.8.1
        Cited Guidance: 'ADaMIG v1.3, Section 3.3.8, Table 3.3.8.1: There must be a one-to-one relationship between ABLFN
          and ABLFL.

          ABLFN cannot be present unless ABLFL is also present. When ABLFL and ABLFN are present, then on a given record,
          either both must be populated or both must be null.


          ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis needs by adding SPDEVID as a required key variable and
          USUBJID as a conditionally required variable. See the BDS class for further details.'
Check:
  all:
  - name: ABLFL
    operator: is_inconsistent_across_dataset
    value: ABLFN
    where_populated: true
Core:
  Id: AD0410
  Status: Draft
  Version: '1'
Description: Each ABLFN value must map to only one ABLFL value when both variables are populated.
Executability: Fully Executable
Outcome:
  Message: ABLFL has more than one value for a given ABLFN value when both variables are populated.
  Output Variables:
  - ABLFL
  - ABLFN
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BASIC DATA STRUCTURE
    - MEDICAL DEVICE BASIC DATA STRUCTURE
  Domains:
    Include:
    - ALL
Sensitivity: Record

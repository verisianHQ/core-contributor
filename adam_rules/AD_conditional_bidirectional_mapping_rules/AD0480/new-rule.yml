# Variable: STRATwV
# Condition: STRATwV and STRATwVN are populated
# Rule: Each STRATwVN value must map to only one STRATwV value
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.2'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '480'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.2
        Section: '3.2'
        Item: Table 3.2.9
        Cited Guidance: 'ADaMIG v1.2, Section 3.2, Table 3.2.9: There must be a one-to-one relationship between STRATwVN and
          STRATwV within a study.

          STRATwVN cannot be present unless STRATwV is also present. When STRATwV and STRATwVN are present, then on a given
          record, either both must be populated or both must be null.'
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '480'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3
        Section: '3.2'
        Item: Table 3.2.9
        Cited Guidance: 'ADaMIG v1.3, Section 3.2, Table 3.2.9: There must be a one-to-one relationship between STRATwVN and
          STRATwV within a study.

          STRATwVN cannot be present unless STRATwV is also present. When STRATwV and STRATwVN are present, then on a given
          record, either both must be populated or both must be null.'
Check:
  all:
  - name: ^STRAT(?P<w>[1-9])V$
    variable_regex_pattern: true
    operator: is_inconsistent_across_dataset
    value: STRAT{{w}}VN
    where_populated: true
Core:
  Id: AD0480
  Status: Draft
  Version: '1'
Description: Each STRATwVN value must map to only one STRATwV value when both variables are populated.
Executability: Fully Executable
Outcome:
  Message: STRATwV has more than one value for a given STRATwVN value when both variables are populated.
  Output Variables:
  - STRAT{{w}}V
  - STRAT{{w}}VN
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - SUBJECT LEVEL ANALYSIS DATASET
  Domains:
    Include:
    - ALL
Sensitivity: Record

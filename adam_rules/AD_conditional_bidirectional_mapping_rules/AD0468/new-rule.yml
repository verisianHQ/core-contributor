# Variable: STRATAR
# Condition: STRATAR and STRATARN are populated
# Rule: Each STRATARN value must map to only one STRATAR value
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.2'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '468'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.2
        Section: '3.2'
        Item: Table 3.2.9
        Cited Guidance: 'ADaMIG v1.2, Section 3.2, Table 3.2.9: There must be a one-to-one relationship between STRATARN and
          STRATAR within a study.

          STRATARN cannot be present unless STRATAR is also present. When STRATAR and STRATARN are present, then on a given
          record, either both must be populated or both must be null.'
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '468'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3
        Section: '3.2'
        Item: Table 3.2.9
        Cited Guidance: 'ADaMIG v1.3, Section 3.2, Table 3.2.9: There must be a one-to-one relationship between STRATARN and
          STRATAR within a study.

          STRATARN cannot be present unless STRATAR is also present. When STRATAR and STRATARN are present, then on a given
          record, either both must be populated or both must be null.'
Check:
  all:
  - name: STRATAR
    operator: is_inconsistent_across_dataset
    value: STRATARN
    where_populated: true
Core:
  Id: AD0468
  Status: Draft
  Version: '1'
Description: Each STRATARN value must map to only one STRATAR value when both variables are populated.
Executability: Fully Executable
Outcome:
  Message: STRATAR has more than one value for a given STRATARN value when both variables are populated.
  Output Variables:
  - STRATAR
  - STRATARN
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - SUBJECT LEVEL ANALYSIS DATASET
  Domains:
    Include:
    - ALL
Sensitivity: Record

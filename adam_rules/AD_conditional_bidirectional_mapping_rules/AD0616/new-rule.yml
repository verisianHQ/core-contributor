# Variable: TRCMPGy
# Condition: TRCMPGy and TRCMPGyN are populated
# Rule: Each TRCMPGyN value must map to only one TRCMPGy value
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.1'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '616'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.1
        Section: '3.2'
        Item: 3.2.8
        Cited Guidance: 'ADaMIG v1.1, Section 3.2, Table 3.2.8: TRCMPGyN Must have a one-to-one mapping to TRCMPGy.'
  - Name: ADaMIG
    Version: '1.2'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '616'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.2
        Section: '3.2'
        Item: 3.2.8
        Cited Guidance: 'ADaMIG v1.2, Section 3.2, Table 3.2.8: There must be a one-to-one relationship between TRCMPGyN and
          TRCMPGy within a study.

          TRCMPGyN cannot be present unless TRCMPGy is also present. When TRCMPGy and TRCMPGyN are present, then on a given
          record, either both mut be populated or both must be null.'
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '616'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3
        Section: '3.2'
        Item: 3.2.8
        Cited Guidance: 'ADaMIG v1.3, Section 3.2, Table 3.2.8: There must be a one-to-one relationship between TRCMPGyN and
          TRCMPGy within a study.

          TRCMPGyN cannot be present unless TRCMPGy is also present. When TRCMPGy and TRCMPGyN are present, then on a given
          record, either both mut be populated or both must be null.'
Check:
  all:
  - name: ^TRCMPG(?P<y>[1-9][0-9]?)$
    variable_regex_pattern: true
    operator: is_inconsistent_across_dataset
    value: TRCMPG{{y}}N
    where_populated: true
Core:
  Id: AD0616
  Status: Draft
  Version: '1'
Description: Each TRCMPGyN value must map to only one TRCMPGy value when both variables are populated.
Executability: Fully Executable
Outcome:
  Message: TRCMPGy has more than one value for a given TRCMPGyN value when both variables are populated.
  Output Variables:
  - TRCMPG{{y}}
  - TRCMPG{{y}}N
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - SUBJECT LEVEL ANALYSIS DATASET
  Domains:
    Include:
    - ALL
Sensitivity: Record

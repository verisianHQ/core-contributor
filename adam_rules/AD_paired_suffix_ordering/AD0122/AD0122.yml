Check:
  all:
    - name: '^(?P<root>.*)SDTM$'
      variable_regex_pattern: true
      operator: non_empty
    - name: '{{root}}EDTM'
      operator: exists
    - name: '{{root}}EDTM'
      operator: non_empty
    - name: '^(?P<root>.*)SDTM$'
      variable_regex_pattern: true
      operator: greater_than
      value: '{{root}}EDTM'
Core:
  Id: AD0122
  Status: Draft
  Version: '1'
Description: Raise an error when the value of a variable with a suffix of SDTM is greater than the value of a variable with the same root and a suffix of EDTM, considering only rows on which both variables are populated.
Executability: Fully Executable
Outcome:
  Message: '{{root}}SDTM is greater than {{root}}EDTM when both variables are populated.'
  Output Variables:
    - '{{root}}SDTM'
    - '{{root}}EDTM'
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - ALL
  Domains:
    Include:
      - ALL
Sensitivity: Record

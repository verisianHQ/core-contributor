Check:
  all:
    - name: '^(?P<root>.*)STDY$'
      variable_regex_pattern: true
      operator: non_empty
    - name: '{{root}}ENDY'
      operator: exists
    - name: '{{root}}ENDY'
      operator: non_empty
    - name: '^(?P<root>.*)STDY$'
      variable_regex_pattern: true
      operator: greater_than
      value: '{{root}}ENDY'
Core:
  Id: AD0099
  Status: Draft
  Version: '1'
Description: Raise an error when on a given record, a variable with a suffix of STDY has a value greater than a value of a variable with the same root and a suffix of ENDY, and both variables are populated.
Executability: Fully Executable
Outcome:
  Message: '{{root}}STDY is greater than {{root}}ENDY when both variables are populated.'
  Output Variables:
    - '{{root}}STDY'
    - '{{root}}ENDY'
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - BDS
      - MDBDS
  Domains:
    Include:
      - ALL
Sensitivity: Record

Check:
  all:
    - name: '^(?P<root>.*)SDT$'
      variable_regex_pattern: true
      operator: non_empty
    - name: '{{root}}EDT'
      operator: exists
    - name: '{{root}}EDT'
      operator: non_empty
    - name: '^(?P<root>.*)SDT$'
      variable_regex_pattern: true
      operator: greater_than
      value: '{{root}}EDT'
Core:
  Id: AD0121
  Status: Draft
  Version: '1'
Description: Raise an error when the value of a variable with a suffix of SDT is greater than the value of a variable with the same root and a suffix of EDT, considering only rows on which both variables are populated.
Executability: Fully Executable
Outcome:
  Message: '{{root}}SDT is greater than {{root}}EDT when both variables are populated.'
  Output Variables:
    - '{{root}}SDT'
    - '{{root}}EDT'
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - ALL
  Domains:
    Include:
      - ALL
Sensitivity: Record

# Variable: *SDT
# Condition: On rows where *SDTM and *EDTM are both populated
# Rule: A variable with a suffix of SDTM has a value greater than a value of a variable with the same root and a suffix of EDTM
# verified
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.0'
    References:

Check:
  all:
    - name: '^(?P<root>.*)SDT$'
      variable_regex_pattern: true
      operator: non_empty
    - name: '{{root}}EDT'
      operator: exists
    - name: '{{root}}EDT'
      operator: non_empty
    - name: '^(?P<root>.*)SDT$'
      variable_regex_pattern: true
      operator: greater_than
      value: '{{root}}EDT'
Core:
  Id: AD0792
  Status: Draft
  Version: '1'
Description: Raise an error when on a given record, a variable with a suffix of SDT has a value greater than a value of a variable with the same root and a suffix of EDT, and both variables are populated.
Executability: Fully Executable
Outcome:
  Message: '{{root}}SDT is greater than {{root}}EDT when both variables are populated.'
  Output Variables:
    - '{{root}}SDT'
    - '{{root}}EDT'
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - BDS
  Domains:
    Include:
      - ALL
Sensitivity: Record

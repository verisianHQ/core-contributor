# Variable: SITEID
# Condition: The value of ADSL.USUBJID is equal to the value of DM.USUBJID
# Rule: ADSL.SITEID is not equal to DM.SITEID
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '209'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.3
                Section: '3.2'
                Item: 'Table 3.2.2'
                Cited Guidance: 
                  'ADaMIG v1.3, Section 3.2, Table 3.2.2: DM.SITEID'
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '209'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.2
                Section: '3.2'
                Item: 'Table 3.2.2'
                Cited Guidance: 
                  'ADaMIG v1.2, Section 3.2, Table 3.2.2: DM.SITEID'
      - Name: ADaMIG
        Version: '1.1'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '209'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.1
                Section: '3.2'
                Item: 'Table 3.2.2'
                Cited Guidance: 
                  'ADaMIG v1.1, Section 3.2, Table 3.2.2: DM.SITEID'
      - Name: ADaMIG
        Version: '1.0'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '209'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.0
                Section: '3.1'
                Item: 'Table 3.1.1'
                Cited Guidance: 
                  'ADaMIG v1.0, Section 3.1, Table 3.1.1: If the variable is not a copy of DM.SITEID, then an additional differently named variable must be added.'
Check:
  all:
    - name: SITEID
      operator: not_equal_to
      value: DM.SITEID
Core:
  Id: AD0209
  Status: Published
  Version: '1'
Description: Raise an error when the value of ADSL.USUBJID is equal to the value of DM.USUBJID and ADSL.SITEID is not equal to DM.SITEID.
Executability: Fully Executable
Match Datasets:
  - Keys:
      - USUBJID
    Name: DM
Outcome:
  Message: ADSL.SITEID does not match DM.SITEID for the corresponding subject.
  Output Variables:
    - USUBJID
    - SITEID
    - DM.SITEID
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - ADSL
  Domains:
    Include:
      - ADSL
Sensitivity: Record

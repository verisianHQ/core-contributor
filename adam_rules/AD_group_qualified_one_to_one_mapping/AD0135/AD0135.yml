# Variable: SHIFTy where y is an integer [1-9, not zero-padded]
# Condition: 
# Rule: Within a given value of PARAMCD, there is more than one value of SHIFTy for a given value of SHIFTyN
# verified
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '135'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.0
        Section: 3.2.4
        Item: Table 3.2.4.1
        Cited Guidance: 'ADaMIG v1.0, Section 3.2.4, Table 3.2.4.1: SHIFTN has a one-to-one
          mapping relationship with SHIFT.'
      - Document: ADaMIG v1.0
        Section: 3.2.4
        Item: Table 3.2.4.1
        Cited Guidance: The ADaM Team acknowledges that this cited text does not adequately
          support the creation of a conformance rule.  The intent of the ADaM Team
          was clarified in ADaMIG v1.0, Section 3.2.4, Table 3.2.4.1 v1.1.
Check:
  all:
  - name: ^SHIFT(?P<y>[1-9])$
    variable_regex_pattern: true
    operator: is_inconsistent_across_dataset
    value:
    - PARAMCD
    - SHIFT{{y}}N
Core:
  Id: AD0135
  Status: Draft
  Version: '1'
Description: Raise an error when within a given value of PARAMCD, there is more than one value of SHIFTy for a given value of SHIFTyN.
Executability: Fully Executable
Outcome:
  Message: SHIFTy has more than one value for a given SHIFTyN value within a parameter.
  Output Variables:
  - SHIFT{{y}}
  - PARAMCD
  - SHIFT{{y}}N
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BASIC DATA STRUCTURE
  Domains:
    Include:
    - ALL
Sensitivity: Record

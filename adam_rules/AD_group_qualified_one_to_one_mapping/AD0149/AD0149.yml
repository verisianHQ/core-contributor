# Variable: AVALC
# Condition: 
# Rule: Within a given value of PARAMCD, there is more than one value of AVALC for a given value of AVAL
# verified
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '149'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.0
        Section: 3.2.4
        Item: Table 3.2.4.1
        Cited Guidance: 'ADaMIG v1.0, Section 3.2.4, Table 3.2.4.1: AVALC can be a
          character string mapping to AVAL, but if so there must be a one-to-one map
          between AVAL and AVALC within a given PARAM.'
Check:
  all:
  - name: AVALC
    operator: is_inconsistent_across_dataset
    value:
    - PARAMCD
    - AVAL
Core:
  Id: AD0149
  Status: Draft
  Version: '1'
Description: Raise an error when within a given value of PARAMCD, there is more than one value of AVALC for a given value of AVAL.
Executability: Fully Executable
Outcome:
  Message: AVALC has more than one value for a given AVAL value within a parameter.
  Output Variables:
  - AVALC
  - PARAMCD
  - AVAL
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BASIC DATA STRUCTURE
  Domains:
    Include:
    - ALL
Sensitivity: Record

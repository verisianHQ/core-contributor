# Variable: AVISITN
# Condition: 
# Rule: Within a given value of PARAMCD, there is more than one value of AVISITN for a given value of AVISIT
# verified
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '109'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.0
        Section: 3.2.3
        Item: Table 3.2.3.1
        Cited Guidance: 'ADaMIG v1.0, Section 3.2.3, Table 3.2.3.1: Within a parameter,
          there is a one-to-one mapping between AVISITN and AVISIT so that AVISITN
          has the same value for each distinct AVISIT.'
Check:
  all:
  - name: AVISITN
    operator: is_inconsistent_across_dataset
    where_populated: true
    value:
    - PARAMCD
    - AVISIT
Core:
  Id: AD0109
  Status: Draft
  Version: '1'
Description: Raise an error when within a given value of PARAMCD, there is more than one value of AVISITN for a given value of AVISIT.
Executability: Fully Executable
Outcome:
  Message: AVISITN has more than one value for a given AVISIT value within a parameter.
  Output Variables:
  - AVISITN
  - PARAMCD
  - AVISIT
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BASIC DATA STRUCTURE
  Domains:
    Include:
    - ALL
Sensitivity: Record

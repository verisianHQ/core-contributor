Check:
  all:
  - name: ATPTN
    operator: is_inconsistent_across_dataset
    value:
    - PARAMCD
    - ATPT
Core:
  Id: AD0118
  Status: Draft
  Version: '1'
Description: Raise an error when within a given value of PARAMCD, there is more than one value of ATPTN for a given value of ATPT.
Executability: Fully Executable
Outcome:
  Message: ATPTN has more than one value for a given ATPT value within a parameter.
  Output Variables:
  - ATPTN
  - PARAMCD
  - ATPT
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BASIC DATA STRUCTURE
  Domains:
    Include:
    - ALL
Sensitivity: Record

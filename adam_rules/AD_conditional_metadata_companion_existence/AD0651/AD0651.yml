Check:
  all:
    - name: '^ONTR(?P<xx>0[1-9]|[1-9][0-9])FL$'
      variable_regex_pattern: true
      operator: exists
    - name: 'ONTRTFL'
      operator: not_exists
Core:
  Id: AD0651
  Status: Published
  Version: '2'
Description: Raise an error when the ONTRxxFL variable is present within OCCDS or MDOCCDS, but the ONTRTFL variable is not present.
Executability: Fully Executable
Outcome:
  Message: ONTRxxFL is present, but ONTRTFL is not present within OCCDS or MDOCCDS.
  Output Variables:
    - 'ONTR{{xx}}FL'
    - 'ONTRTFL'
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - OCCDS
      - MDOCCDS
  Domains:
    Include:
      - OCCDS
      - MDOCCDS
Sensitivity: Dataset

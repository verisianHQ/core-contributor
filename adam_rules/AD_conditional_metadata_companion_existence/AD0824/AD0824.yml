# Variable: SITEID, SITEIDN
# Condition: SITEIDN is present within BDS
# Rule: SITEID is not present within BDS
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '824'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.3
                Section: 3.1.1
                Item: '6'
                Cited Guidance: 
                  'ADaMIG v1.3, Section 3.1.1, Item 6: When a secondary variable is included in the dataset, then the primary variable must also be included.'
Check:
  all:
    - name: SITEIDN
      operator: exists
    - name: SITEID
      operator: not_exists
Core:
  Id: AD0824
  Status: Published
  Version: '1'
Description: Raise an error when the SITEIDN variable is present within BDS, but the SITEID variable is not present.
Executability: Fully Executable
Outcome:
  Message: SITEIDN is present, but SITEID is not present within BDS.
  Output Variables:
    - SITEIDN
    - SITEID
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - BDS
  Domains:
    Include:
      - BDS
Sensitivity: Dataset
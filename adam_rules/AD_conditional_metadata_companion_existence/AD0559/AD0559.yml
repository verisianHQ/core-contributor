# Variable: TRCMPGyN, TRCMPGy
# Condition: TRCMPGyN is present
# Rule: TRCMPGy is not present
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '559'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.3
                Section: 3.1.1
                Item: '6'
                Cited Guidance: 
                  'ADaMIG v1.3, Section 3.1.1, Item 6: When a secondary variable is included in the dataset, then the primary variable must also be included.'
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '559'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.2
                Section: 3.1.1
                Item: '6'
                Cited Guidance: 
                  'ADaMIG v1.2, Section 3.1.1, Item 6: When a secondary variable is included in the dataset, then the primary variable must also be included.'
      - Name: ADaMIG
        Version: '1.1'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '559'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.1
                Section: 3.1.1
                Item: '6'
                Cited Guidance: 
                  'ADaMIG v1.1, Section 3.1.1, Item 6: When the secondary variable is numeric, it can only be included if the primary variable is also present in the dataset.'
Check:
  all:
    - name: '^TRCMPG(?P<y>[1-9]|[1-9][0-9])N$'
      variable_regex_pattern: true
      operator: exists
    - name: 'TRCMPG{{y}}'
      operator: not_exists
Core:
  Id: AD0559
  Status: Published
  Version: '1'
Description: Raise an error when the TRCMPGyN variable is present within ADSL, but the TRCMPGy variable is not present.
Executability: Fully Executable
Outcome:
  Message: TRCMPGyN is present, but TRCMPGy is not present within ADSL.
  Output Variables:
    - 'TRCMPG{{y}}N'
    - 'TRCMPG{{y}}'
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - ADSL
  Domains:
    Include:
      - ADSL
Sensitivity: Dataset

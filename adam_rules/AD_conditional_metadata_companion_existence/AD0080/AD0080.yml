# Variable: TRTxxA, TRTxxP
# Condition: TRTxxA is present
# Rule: TRTxxP is not present
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '80'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.3
                Section: 3.2
                Item: 'Table 3.2.4'
                Cited Guidance: 
                  'ADaMIG v1.3, Section 3.2, Table 3.2.4: CDISC Notes for TRTxxP state: "At least TRT01P is required."'
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '80'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.2
                Section: 3.2
                Item: 'Table 3.2.4'
                Cited Guidance: 
                  'ADaMIG v1.2, Section 3.2, Table 3.2.4: CDISC Notes for TRTxxP state: "At least TRT01P is required."'
      - Name: ADaMIG
        Version: '1.1'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '80'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.1
                Section: 3.2
                Item: 'Table 3.2.4'
                Cited Guidance: 
                  'ADaMIG v1.1, Section 3.2, Table 3.2.4: CDISC Notes for TRTxxP state: "At least TRT01P is required."'
      - Name: ADaMIG
        Version: '1.0'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '80'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.0
                Section: 3.1
                Item: 'Table 3.1.1'
                Cited Guidance: 
                  'ADaMIG v1.0, Section 3.1, Table 3.1.1: CDISC Notes for TRTxxP state: "At least TRT01P is required."'
Check:
  all:
    - name: '^TRT(?P<xx>0[1-9]|[1-9][0-9])A$'
      variable_regex_pattern: true
      operator: exists
    - name: 'TRT{{xx}}P'
      operator: not_exists
Core:
  Id: AD0080
  Status: Published
  Version: '1'
Description: Raise an error when the TRTxxA variable is present within ADSL, but the TRTxxP variable is not present.
Executability: Fully Executable
Outcome:
  Message: TRTxxA is present, but TRTxxP is not present within ADSL.
  Output Variables:
    - 'TRT{{xx}}A'
    - 'TRT{{xx}}P'
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - ADSL
  Domains:
    Include:
      - ADSL
Sensitivity: Dataset

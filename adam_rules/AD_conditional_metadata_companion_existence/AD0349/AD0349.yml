# Variable: R2AyHI, AyHI
# Condition: R2AyHI is present
# Rule: AyHI is not present
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '349'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: IG v1.3
                Section: 3.3.4.1
                Item: 'Table 3.3.4.1.1'
                Cited Guidance: 
                  'ADaMIG v1.3, Section 3.3.4.1, Table 3.3.4.1.1: CDISC Notes for R2AyHI state: "AyHI must exist in the ADaM dataset."'
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '349'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.2
                Section: 3.3.4.1
                Item: 'Table 3.3.4.1.1'
                Cited Guidance: 
                  'ADaMIG v1.2, Section 3.3.4.1, Table 3.3.4.1.1: CDISC Notes for R2AyHI state: "AyHI must exist in the ADaM dataset."'
      - Name: ADaMIG
        Version: '1.1'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '349'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.1
                Section: 3.3.4
                Item: 'Table 3.3.4.1'
                Cited Guidance: 
                  'ADaMIG v1.1, Section 3.3.4, Table 3.3.4.1: CDISC Notes for R2AyHI state: "AyHI must exist in the ADaM dataset."'
      - Name: ADaMIG-MD
        Version: '1.0'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '349'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: IG-MD v1.0
                Section: 3.1
                Item: 'Table 3.3.4.1.1'
                Cited Guidance: 
                  'ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis needs by adding SPDEVID as a required key variable and USUBJID as a conditionally required variable. See the BDS class for further details.'
Check:
  all:
    - name: '^R2A(?P<y>[1-9]|[1-9][0-9])HI$'
      variable_regex_pattern: true
      operator: exists
    - name: 'A{{y}}HI'
      operator: not_exists
Core:
  Id: AD0349
  Status: Published
  Version: '2'
Description: Raise an error when the R2AyHI variable is present within BDS or MDBDS, but the AyHI variable is not present.
Executability: Fully Executable
Outcome:
  Message: R2AyHI is present, but AyHI is not present within BDS or MDBDS.
  Output Variables:
    - 'R2A{{y}}HI'
    - 'A{{y}}HI'
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - BDS
      - MDBDS
  Domains:
    Include:
      - BDS
      - MDBDS
Sensitivity: Dataset

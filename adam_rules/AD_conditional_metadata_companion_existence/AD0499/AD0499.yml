# Variable: ASPER, APERIOD
# Condition: ASPER is present
# Rule: APERIOD is not present
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '499'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: IG v1.3
                Section: 3.2
                Item: '2'
                Cited Guidance: 
                  'ADaMIG v1.3, Section 3.2: If period timing variables are not included in ADSL, then subperiod timing variables must be excluded from ADSL.'
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '499'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.2
                Section: 3.2
                Item: '2'
                Cited Guidance: 
                  'ADaMIG v1.2, Section 3.2: If period timing variables are not included in ADSL, then subperiod timing variables must be excluded from ADSL.'
      - Name: ADaMIG-MD
        Version: '1.0'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '499'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: IG-MD v1.0
                Section: 3.1
                Item: '2'
                Cited Guidance: 
                  'ADaMIG-MD v1.0, Section 3.1: MDBDS and MDOCCDS support analysis needs by adding SPDEVID as a required key variable and USUBJID as a conditionally required variable. See the BDS and OCCDS class for further details.'
Check:
  all:
    - name: ASPER
      operator: exists
    - name: APERIOD
      operator: not_exists
Core:
  Id: AD0499
  Status: Published
  Version: '2'
Description: Raise an error when the ASPER variable is present within BDS or MDBDS or OCCDS or MDOCCDS, but the APERIOD variable is not present.
Executability: Fully Executable
Outcome:
  Message: ASPER is present, but APERIOD is not present within BDS or MDBDS or OCCDS or MDOCCDS.
  Output Variables:
    - ASPER
    - APERIOD
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - BDS
      - MDBDS
      - OCCDS
      - MDOCCDS
  Domains:
    Include:
      - BDS
      - MDBDS
      - OCCDS
      - MDOCCDS
Sensitivity: Dataset

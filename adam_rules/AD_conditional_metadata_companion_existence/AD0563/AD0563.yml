# Variable: STRATwVN, STRATwV
# Condition: STRATwVN is present
# Rule: STRATwV is not present
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '563'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.3
                Section: 3.1.1
                Item: '6'
                Cited Guidance: 
                  'ADaMIG v1.3, Section 3.1.1, Item 6: When a secondary variable is included in the dataset, then the primary variable must also be included.'
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '563'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.2
                Section: 3.1.1
                Item: '6'
                Cited Guidance: 
                  'ADaMIG v1.2, Section 3.1.1, Item 6: When a secondary variable is included in the dataset, then the primary variable must also be included.'
Check:
  all:
    - name: '^STRAT(?P<w>[1-9])VN$'
      variable_regex_pattern: true
      operator: exists
    - name: 'STRAT{{w}}V'
      operator: not_exists
Core:
  Id: AD0563
  Status: Published
  Version: '1'
Description: Raise an error when the STRATwVN variable is present within ADSL, but the STRATwV variable is not present.
Executability: Fully Executable
Outcome:
  Message: STRATwVN is present, but STRATwV is not present within ADSL.
  Output Variables:
    - 'STRAT{{w}}VN'
    - 'STRAT{{w}}V'
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - ADSL
  Domains:
    Include:
      - ADSL
Sensitivity: Dataset

# Variable: FLGREAS, FLGREASC
# Condition: FLGREASC is present within BDS
# Rule: FLGREAS is not present within BDS
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '829'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.3
                Section: 3.1.1
                Item: '6'
                Cited Guidance: 
                  'ADaMIG v1.3, Section 3.1.1, Item 6: When a secondary variable is included in the dataset, then the primary variable must also be included.'
Check:
  all:
    - name: FLGREASC
      operator: exists
    - name: FLGREAS
      operator: not_exists
Core:
  Id: AD0829
  Status: Published
  Version: '1'
Description: Raise an error when the FLGREASC variable is present within BDS, but the FLGREAS variable is not present.
Executability: Fully Executable
Outcome:
  Message: FLGREASC is present, but FLGREAS is not present within BDS.
  Output Variables:
    - FLGREASC
    - FLGREAS
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - BDS
  Domains:
    Include:
      - BDS
Sensitivity: Dataset
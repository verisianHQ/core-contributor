# Variable: STRATAVN, STRATAV
# Condition: STRATAVN is present
# Rule: STRATAV is not present
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '562'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.3
                Section: 3.1.1
                Item: '6'
                Cited Guidance: 
                  'ADaMIG v1.3, Section 3.1.1, Item 6: When a secondary variable is included in the dataset, then the primary variable must also be included.'
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '562'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.2
                Section: 3.1.1
                Item: '6'
                Cited Guidance: 
                  'ADaMIG v1.2, Section 3.1.1, Item 6: When a secondary variable is included in the dataset, then the primary variable must also be included.'
Check:
  all:
    - name: STRATAVN
      operator: exists
    - name: STRATAV
      operator: not_exists
Core:
  Id: AD0562
  Status: Published
  Version: '1'
Description: Raise an error when the STRATAVN variable is present within ADSL, but the STRATAV variable is not present.
Executability: Fully Executable
Outcome:
  Message: STRATAVN is present, but STRATAV is not present within ADSL.
  Output Variables:
    - STRATAVN
    - STRATAV
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - ADSL
  Domains:
    Include:
      - ADSL
Sensitivity: Dataset

# Variable: ABLFL, ABLFN
# Condition: ABLFN is present within BDS or MDBDS
# Rule: ABLFL is not present within BDS or MDBDS
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '525'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: IG v1.3
                Section: 3.1.1
                Item: '6'
                Cited Guidance: 
                  'ADaMIG v1.3, Section 3.1.1, Item 6: When a secondary variable is included in the dataset, then the primary variable must also be included.'
      - Name: ADaMIG-MD
        Version: '1.0'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '525'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: IG-MD v1.0
                Section: 3.1
                Cited Guidance: 
                  'ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis needs by adding SPDEVID as a required key variable and USUBJID as a conditionally required variable. See the BDS class for further details.'
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '525'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.2
                Section: 3.1.1
                Item: '6'
                Cited Guidance: 
                  'ADaMIG v1.2, Section 3.1.1, Item 6: When a secondary variable is included in the dataset, then the primary variable must also be included.'
      - Name: ADaMIG
        Version: '1.1'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '525'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.1
                Section: 3.1.1
                Item: '6'
                Cited Guidance: 
                  'ADaMIG v1.1, Section 3.1.1, Item 6: When the secondary variable is numeric, it can only be included if the primary variable is also present in the dataset.'
Check:
  all:
    - name: ABLFN
      operator: exists
    - name: ABLFL
      operator: not_exists
Core:
  Id: AD0525
  Status: Published
  Version: '2'
Description: Raise an error when the ABLFN variable is present within BDS or MDBDS, but the ABLFL variable is not present.
Executability: Fully Executable
Outcome:
  Message: ABLFN is present, but ABLFL is not present within BDS or MDBDS.
  Output Variables:
    - ABLFN
    - ABLFL
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - BDS
      - MDBDS
  Domains:
    Include:
      - BDS
      - MDBDS
Sensitivity: Dataset

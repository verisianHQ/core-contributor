# Variable: ARELTM, ARELTMU
# Condition: ARELTMU is present within BDS or MDBDS
# Rule: ARELTM is not present within BDS or MDBDS
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '113'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: IG v1.3
                Section: 3.3.3
                Item: 'Table 3.3.3.1'
                Cited Guidance: 
                  'ADaMIG v1.3, Section 3.3.3, Table 3.3.3.1: The units of ARELTM. For example, "HOURS" or "MINUTES" ARELTMU is required if ARELTM is present.'
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '113'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.2
                Section: 3.3.3
                Item: 'Table 3.3.3.1'
                Cited Guidance: 
                  'ADaMIG v1.2, Section 3.3.3, Table 3.3.3.1: The units of ARELTM. For example, "HOURS" or "MINUTES" ARELTMU is required if ARELTM is present.'
      - Name: ADaMIG
        Version: '1.1'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '113'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.1
                Section: 3.3.3
                Item: 'Table 3.3.3.1'
                Cited Guidance: 
                  'ADaMIG v1.1, Section 3.3.3, Table 3.3.3.1: The units of ARELTM. For example, "HOURS" or "MINUTES" ARELTMU is required if ARELTM is present.'
      - Name: ADaMIG
        Version: '1.0'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '113'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.0
                Section: 3.2.3
                Item: 'Table 3.2.3.1'
                Cited Guidance: 
                  'ADaMIG v1.0, Section 3.2.3, Table 3.2.3.1: The units of ARELTM. For example, "HOURS" or "MINUTES" ARELTMU is required if ARELTM is present.'
      - Name: ADaMIG-MD
        Version: '1.0'
        References:
          - Origin: ADaM Conformance Rules

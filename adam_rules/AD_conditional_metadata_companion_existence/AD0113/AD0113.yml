Check:
  all:
    - name: ARELTMU
      operator: exists
    - name: ARELTM
      operator: not_exists
Core:
  Id: AD0113
  Status: Published
  Version: '2'
Description: Raise an error when the ARELTMU variable is present within BDS or MDBDS, but the ARELTM variable is not present.
Executability: Fully Executable
Outcome:
  Message: ARELTMU is present, but ARELTM is not present within BDS or MDBDS.
  Output Variables:
    - ARELTMU
    - ARELTM
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - BDS
      - MDBDS
  Domains:
    Include:
      - BDS
      - MDBDS
Sensitivity: Dataset

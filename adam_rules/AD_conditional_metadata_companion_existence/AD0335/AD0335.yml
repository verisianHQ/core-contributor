Check:
  all:
    - name: '^CRIT(?P<y>[1-9]|[1-9][0-9])FL$'
      variable_regex_pattern: true
      operator: exists
    - name: 'CRIT{{y}}'
      operator: not_exists
Core:
  Id: AD0335
  Status: Published
  Version: '2'
Description: Raise an error when the CRITyFL variable is present within BDS or MDBDS, but the CRITy variable is not present.
Executability: Fully Executable
Outcome:
  Message: CRITyFL is present, but CRITy is not present within BDS or MDBDS.
  Output Variables:
    - 'CRIT{{y}}FL'
    - 'CRIT{{y}}'
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - BDS
      - MDBDS
  Domains:
    Include:
      - BDS
      - MDBDS
Sensitivity: Dataset

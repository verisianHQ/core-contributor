# Variable: PROJID, PROJIDN
# Condition: PROJIDN is present within BDS
# Rule: PROJID is not present within BDS
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '799'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.3
                Section: 3.1.1
                Item: '6'
                Cited Guidance: 
                  'ADaMIG v1.3, Section 3.1.1, Item 6: When a secondary variable is included in the dataset, then the primary variable must also be included.'
Check:
  all:
    - name: PROJIDN
      operator: exists
    - name: PROJID
      operator: not_exists
Core:
  Id: AD0799
  Status: Published
  Version: '1'
Description: Raise an error when the PROJIDN variable is present within BDS, but the PROJID variable is not present.
Executability: Fully Executable
Outcome:
  Message: PROJIDN is present, but PROJID is not present within BDS.
  Output Variables:
    - PROJIDN
    - PROJID
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - BDS
  Domains:
    Include:
      - BDS
Sensitivity: Dataset
# Variable: BCHGCAyN, BCHGCATy
# Condition: BCHGCAyN is present
# Rule: BCHGCATy is not present
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '565'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: IG v1.3
                Section: 3.1.1
                Item: '6'
                Cited Guidance: 
                  'ADaMIG v1.3, Section 3.1.1, Item 6: When a secondary variable is included in the dataset, then the primary variable must also be included.'
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '565'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.2
                Section: 3.1.1
                Item: '6'
                Cited Guidance: 
                  'ADaMIG v1.2, Section 3.1.1, Item 6: When a secondary variable is included in the dataset, then the primary variable must also be included.'
      - Name: ADaMIG-MD
        Version: '1.0'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '565'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: IG-MD v1.0
                Section: 3.1
                Item: '6'
                Cited Guidance: 
                  'ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis needs by adding SPDEVID as a required key variable and USUBJID as a conditionally required variable. See the BDS class for further details.'
Check:
  all:
    - name: '^BCHGCA(?P<y>[1-9]|[1-9][0-9])N$'
      variable_regex_pattern: true
      operator: exists
    - name: 'BCHGCAT{{y}}'
      operator: not_exists
Core:
  Id: AD0565
  Status: Published
  Version: '2'
Description: Raise an error when the BCHGCAyN variable is present within BDS or MDBDS, but the BCHGCATy variable is not present.
Executability: Fully Executable
Outcome:
  Message: BCHGCAyN is present, but BCHGCATy is not present within BDS or MDBDS.
  Output Variables:
    - 'BCHGCA{{y}}N'
    - 'BCHGCAT{{y}}'
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - BDS
      - MDBDS
  Domains:
    Include:
      - BDS
      - MDBDS
Sensitivity: Dataset

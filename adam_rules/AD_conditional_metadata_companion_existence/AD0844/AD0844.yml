# Variable: ALQFL, ALQFN
# Condition: ALQFN is present within BDS
# Rule: ALQFL is not present within BDS
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '844'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.3
                Section: 3.1.1
                Item: '6'
                Cited Guidance: 
                  'ADaMIG v1.3, Section 3.1.1, Item 6: When a secondary variable is included in the dataset, then the primary variable must also be included.'
Check:
  all:
    - name: ALQFN
      operator: exists
    - name: ALQFL
      operator: not_exists
Core:
  Id: AD0844
  Status: Published
  Version: '1'
Description: Raise an error when the ALQFN variable is present within BDS, but the ALQFL variable is not present.
Executability: Fully Executable
Outcome:
  Message: ALQFN is present, but ALQFL is not present within BDS.
  Output Variables:
    - ALQFN
    - ALQFL
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - BDS
  Domains:
    Include:
      - BDS
Sensitivity: Dataset
# Variable: TRTPGyN, TRTPGy
# Condition: TRTPGyN is present
# Rule: TRTPGy is not present
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '97'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: IG v1.3
                Section: 3.3.2
                Item: 'Table 3.3.2.1'
                Cited Guidance: 
                  'ADaMIG v1.3, Section 3.3.2, Table 3.3.2.1: TRTPGyN cannot be present unless TRTPGy is also present.'
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '97'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.2
                Section: 3.3.2
                Item: 'Table 3.3.2.1'
                Cited Guidance: 
                  'ADaMIG v1.2, Section 3.3.2, Table 3.3.2.1: TRTPGyN cannot be present unless TRTPGy is also present.'
      - Name: ADaMIG
        Version: '1.1'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '97'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.1
                Section: 3.3.2
                Item: 'Table 3.3.2.1'
                Cited Guidance: 
                  'ADaMIG v1.1, Section 3.3.2, Table 3.3.2.1: TRTPGyN has The numeric code for TRTPGy.'
      - Name: ADaMIG
        Version: '1.0'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '97'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.0
                Section: 3.2.2
                Item: 'Table 3.2.2.1'
                Cited Guidance: 
                  'ADaMIG v1.0, Section 3.2.2, Table 3.2.2.1: The numeric code for TRTPGy.'
      - Name: ADaMIG-MD
        Version: '1.0'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '97'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: IG-MD v1.0
                Section: 3.1
                Item: 'Table 3.3.2.1'
                Cited Guidance: 
                  'ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis needs by adding SPDEVID as a required key variable and USUBJID as a conditionally required variable. See the BDS class for further details.'
Check:
  all:
    - name: '^TRTPG(?P<y>[1-9]|[1-9][0-9])N$'
      variable_regex_pattern: true
      operator: exists
    - name: 'TRTPG{{y}}'
      operator: not_exists
Core:
  Id: AD0097
  Status: Published
  Version: '2'
Description: Raise an error when the TRTPGyN variable is present within BDS or MDBDS, but the TRTPGy variable is not present.
Executability: Fully Executable
Outcome:
  Message: TRTPGyN is present, but TRTPGy is not present within BDS or MDBDS.
  Output Variables:
    - 'TRTPG{{y}}N'
    - 'TRTPG{{y}}'
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - BDS
      - MDBDS
  Domains:
    Include:
      - BDS
      - MDBDS
Sensitivity: Dataset

# Variable: PxxSw, TRTxxP
# Condition: PxxSw is present
# Rule: TRTxxP is not present
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '570'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.3
                Section: 3.2
                Item: '2'
                Cited Guidance: 
                  'ADaMIG v1.3, Seciton 3.2, Item 2: If period timing variables are not included in ADSL, then subperiod timing variables must be excluded from ADSL.'
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '570'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.2
                Section: 3.2
                Item: '2'
                Cited Guidance: 
                  'ADaMIG v1.2, Seciton 3.2, Item 2: If period timing variables are not included in ADSL, then subperiod timing variables must be excluded from ADSL.'
Check:
  all:
    - name: '^P(?P<xx>0[1-9]|[1-9][0-9])S(?P<w>[1-9])$'
      variable_regex_pattern: true
      operator: exists
    - name: 'TRT{{xx}}P'
      operator: not_exists
Core:
  Id: AD0570
  Status: Published
  Version: '1'
Description: Raise an error when the PxxSw variable is present within ADSL, but the TRTxxP variable is not present.
Executability: Fully Executable
Outcome:
  Message: PxxSw is present, but TRTxxP is not present within ADSL.
  Output Variables:
    - 'P{{xx}}S{{w}}'
    - 'TRT{{xx}}P'
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - ADSL
  Domains:
    Include:
      - ADSL
Sensitivity: Dataset

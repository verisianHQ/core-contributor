# Variable: MCRITy, MCRITyML
# Condition: MCRITy is present
# Rule: MCRITyML is not present
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '338'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: IG v1.3
                Section: 3.3.4.3
                Item: 'Table 3.3.4.3.1'
                Cited Guidance: 
                  'ADaMIG v1.3, Section 3.3.4.3, Table 3.3.4.3.1: CDISC Notes for MCRITyML state: "Required if MCRITy is present."'
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '338'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.2
                Section: 3.3.4.3
                Item: 'Table 3.3.4.3.1'
                Cited Guidance: 
                  'ADaMIG v1.2, Section 3.3.4.3, Table 3.3.4.3.1: CDISC Notes for MCRITyML state: "Required if MCRITy is present."'
      - Name: ADaMIG
        Version: '1.1'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '338'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.1
                Section: 3.3.4
                Item: 'Table 3.3.4.2'
                Cited Guidance: 
                  'ADaMIG v1.1, Section 3.3.4, Table 3.3.4.2: CDISC Notes for MCRITyML state: "Required if MCRITy exists."'
      - Name: ADaMIG-MD
        Version: '1.0'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '338'
              Version: '2'
            Version: '5.0'
            Citations:
              - Document: IG-MD v1.0
                Section: 3.1
                Item: 'Table 3.3.4.3.1'
                Cited Guidance: 
                  'ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis needs by adding SPDEVID as a required key variable and USUBJID as a conditionally required variable. See the BDS class for further details.'
Check:
  all:
    - name: '^MCRIT(?P<y>[1-9]|[1-9][0-9])$'
      variable_regex_pattern: true
      operator: exists
    - name: 'MCRIT{{y}}ML'
      operator: not_exists
Core:
  Id: AD0338
  Status: Published
  Version: '2'
Description: Raise an error when the MCRITy variable is present within BDS or MDBDS, but the MCRITyML variable is not present.
Executability: Fully Executable
Outcome:
  Message: MCRITy is present, but MCRITyML is not present within BDS or MDBDS.
  Output Variables:
    - 'MCRIT{{y}}'
    - 'MCRIT{{y}}ML'
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - BDS
      - MDBDS
  Domains:
    Include:
      - BDS
      - MDBDS
Sensitivity: Dataset

# Variable: STRATwRN, STRATwR
# Condition: STRATwRN is present
# Rule: STRATwR is not present
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '561'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.3
                Section: 3.1.1
                Item: '6'
                Cited Guidance: 
                  'ADaMIG v1.3, Section 3.1.1, Item 6: When a secondary variable is included in the dataset, then the primary variable must also be included.'
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '561'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.2
                Section: 3.1.1
                Item: '6'
                Cited Guidance: 
                  'ADaMIG v1.2, Section 3.1.1, Item 6: When a secondary variable is included in the dataset, then the primary variable must also be included.'
Check:
  all:
    - name: '^STRAT(?P<w>[1-9])RN$'
      variable_regex_pattern: true
      operator: exists
    - name: 'STRAT{{w}}R'
      operator: not_exists
Core:
  Id: AD0561
  Status: Published
  Version: '1'
Description: Raise an error when the STRATwRN variable is present within ADSL, but the STRATwR variable is not present.
Executability: Fully Executable
Outcome:
  Message: STRATwRN is present, but STRATwR is not present within ADSL.
  Output Variables:
    - 'STRAT{{w}}RN'
    - 'STRAT{{w}}R'
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - ADSL
  Domains:
    Include:
      - ADSL
Sensitivity: Dataset

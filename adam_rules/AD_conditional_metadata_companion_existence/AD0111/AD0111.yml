Check:
  all:
    - name: ARELTM
      operator: exists
    - name: ARELTMU
      operator: not_exists
Core:
  Id: AD0111
  Status: Published
  Version: '2'
Description: Raise an error when the ARELTM variable is present within BDS or MDBDS, but the ARELTMU variable is not present.
Executability: Fully Executable
Outcome:
  Message: ARELTM is present, but ARELTMU is not present within BDS or MDBDS.
  Output Variables:
    - ARELTM
    - ARELTMU
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - BDS
      - MDBDS
  Domains:
    Include:
      - BDS
      - MDBDS
Sensitivity: Dataset

# Variable: PHSTM
# Condition: 
# Rule: On a given record, APHASEN is not present and the value of PHSTM is not equal to the value of at least one PHwSTM variable
# verified
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.2'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '606'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.2
        Section: 3.3.3
        Item: ''
        Cited Guidance: 'ADaMIG v1.2, Section 3.3.3: The values of period, subperiod,
          and phase start (and end) timing variables must be consistent with their
          subject-level counterparts from ADSL as described in Table 3.2.7 for each
          value of APERIOD, ASPER, and APHASE, respectively.'
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '606'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3
        Section: 3.3.3
        Item: ''
        Cited Guidance: 'ADaMIG v1.3, Section 3.3.3: The values of period, subperiod,
          and phase start (and end) timing variables must be consistent with their
          subject-level counterparts from ADSL as described in Table 3.2.7 for each
          value of APERIOD, ASPER, and APHASE, respectively.'
Check:
  all:
    - name: APHASEN
      operator: empty
    - name: PHSTM
      operator: non_empty
    - name: PHSTM
      operator: not_in_enumerated_columns
      value: PHSTM
      regex: '^PH[1-9][0-9]?STM$'
Core:
  Id: AD0606
  Status: Draft
  Version: '1'
Description: Raise an error when on a given record, APHASEN is not present and the value of PHSTM is not equal to the value of at least one PHwSTM variable.
Executability: Fully Executable
Outcome:
  Message: PHSTM is not equal to any PHwSTM variable when APHASEN is not present.
  Output Variables:
    - PHSTM
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - ALL
  Domains:
    Include:
      - ALL
Sensitivity: Record

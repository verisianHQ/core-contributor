# Variable: TRxxPGy where xx is an integer [01-99, zero-padded] and y is an integer [1-99, not zero-padded]
# Condition: 
# Rule: Within a given value of TRTxxP, there is more than one value of TRxxPGy
# verified
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.1'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '756'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.1
        Section: '3.2'
        Item: Table 3.2.4
        Cited Guidance: 'ADaMIG v1.1, Section 3.2, Table 3.2.4: TRxxPGy: Planned pooled
          treatment y for period xx. Useful when planned treatments (TRTxxP) in the
          specified period xx are pooled together for analysis according to pooling
          algorithm y. For example when in period 2 the first pooling algorithm dictates
          that all doses of Drug A (TR02PG1="All doses of Drug A") are pooled together
          for comparison to all doses of Drug B (TR02PG1="All doses of Drug B"). Each
          value of TRTxxP is pooled within at most one value of TRxxPGy.'
  - Name: ADaMIG
    Version: '1.2'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '756'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.2
        Section: '3.2'
        Item: Table 3.2.4
        Cited Guidance: 'ADaMIG v1.2, Section 3.2, Table 3.2.4: TRxxPGy: Planned pooled
          treatment y for period xx. Useful when planned treatments (TRTxxP) in the
          specified period xx are pooled together for analysis according to pooling
          algorithm y. For example when in period 2 the first pooling algorithm dictates
          that all doses of Drug A (TR02PG1="All doses of Drug A") are pooled together
          for comparison to all doses of Drug B (TR02PG1="All doses of Drug B"). Each
          value of TRTxxP is pooled within at most one value of TRxxPGy.'
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '756'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3
        Section: '3.2'
        Item: Table 3.2.4
        Cited Guidance: 'ADaMIG v1.3, Section 3.2, Table 3.2.4: TRxxPGy: Planned pooled
          treatment y for period xx. Useful when planned treatments (TRTxxP) in the
          specified period xx are pooled together for analysis according to pooling
          algorithm y. For example when in period 2 the first pooling algorithm dictates
          that all doses of Drug A (TR02PG1="All doses of Drug A") are pooled together
          for comparison to all doses of Drug B (TR02PG1="All doses of Drug B"). Each
          value of TRTxxP is pooled within at most one value of TRxxPGy.'
Check:
  all:
    - name: '^TR(?P<xx>0[1-9]|[1-9][0-9])PG(?P<y>[1-9][0-9]?)$'
      variable_regex_pattern: true
      operator: is_inconsistent_across_dataset
      value: TRT{{xx}}P
Core:
  Id: AD0756
  Status: Draft
  Version: '1'
Description: Raise an error when within a given value of TRTxxP, there is more than one value of TRxxPGy, where xx is an integer [01-99, zero-padded] and y is an integer [1-99, not zero-padded].
Executability: Fully Executable
Outcome:
  Message: Within a given value of TRT{{xx}}P, there is more than one value of TR{{xx}}PG{{y}}.
  Output Variables:
    - TR{{xx}}PG{{y}}
    - TRT{{xx}}P
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - ADSL
  Domains:
    Include:
      - ALL
Sensitivity: Record

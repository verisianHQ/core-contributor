# Variable: CRITy where y is an integer [1-9, not zero-padded]
# Condition: 
# Rule: Within a given value of PARAMCD, there is more than one value of CRITy
# verified
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '151'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.0
        Section: 4.7.1
        Item: ''
        Cited Guidance: 'ADaMIG v1.0, Section 4.7.1: The definition of CRITy can use
          any variable(s) located on the row and the definition must stay constant
          across all rows within the same value of PARAM.'
  - Name: ADaMIG
    Version: '1.1'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '151'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.1
        Section: 4.7.1
        Item: ''
        Cited Guidance: 'ADaMIG v1.1, Section 4.7.1: The definition of CRITy can use
          any variable(s) located on the row, and the definition must stay constant
          across all rows within the same value of PARAM.'
  - Name: ADaMIG
    Version: '1.2'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '151'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.2
        Section: 4.7.1
        Item: ''
        Cited Guidance: 'ADaMIG v1.2, Section 4.7.1: The definition of CRITy can use
          any variable(s) located on the row, and the definition must stay constant
          across all rows within the same value of PARAM.'
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '151'
        Version: '2'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3
        Section: 4.7.1
        Item: ''
        Cited Guidance: 'ADaMIG v1.3, Section 4.7.1: The definition of CRITy can use
          any variable(s) located on the row, and the definition must stay constant
          across all rows within the same value of PARAM.'
      - Document: ADaMIG-MD v1.0
        Section: '3.1'
        Item: ''
        Cited Guidance: 'ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis
          needs by adding SPDEVID as a required key variable and USUBJID as a conditionally
          required variable. See the BDS class for further details.'
Check:
  all:
    - name: ^CRIT(?P<y>[1-9][0-9]?)$
      variable_regex_pattern: true
      operator: is_inconsistent_across_dataset
      value: PARAMCD
Core:
  Id: AD0151
  Status: Draft
  Version: '1'
Description: Raise an error when within a given value of PARAMCD, there is more than one value of CRITy.
Executability: Fully Executable
Outcome:
  Message: Within a given value of PARAMCD, there is more than one value of CRIT{{y}}.
  Output Variables:
    - '^CRIT(?P<y>[1-9][0-9]?)$'
    - PARAMCD
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - BDS
      - MDBDS
  Domains:
    Include:
      - ALL
Sensitivity: Record

# Variable: AVALC
# Condition: AVALC and AVAL are both populated
# Rule: Within a given value of PARAMCD, there is more than one value of AVALC for a given value of AVAL
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.1'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '742'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.1
                Section: '3.3.4'
                Item: 'Table 3.3.4.1'
                Cited Guidance: 
                  'ADaMIG v1.1, Section 3.3.4, Table 3.3.4.1: AVALC can be a character string mapping to AVAL, but if so there must be a one-to-one map between AVAL and AVALC within a given PARAM.'
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '742'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.2
                Section: '3.3.4.1'
                Item: 'Table 3.3.4.1.1'
                Cited Guidance: 
                  'ADaMIG v1.2, Section 3.3.4.1, Table 3.3.4.1.1: AVALC can be a character string mapping to AVAL, but if so there must be a one-to-one map between AVAL and AVALC within a given PARAM.'
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '742'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.3
                Section: '3.3.4.1'
                Item: 'Table 3.3.4.1.1'
                Cited Guidance: 
                  'ADaMIG v1.3, Section 3.3.4.1, Table 3.3.4.1.1: AVALC can be a character string mapping to AVAL, but if so there must be a one-to-one map between AVAL and AVALC within a given PARAM.'
      - Name: ADaMIG-MD
        Version: '1.0'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '742'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG-MD v1.0
                Section: '3.1'
                Cited Guidance: 
                  'ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis needs by adding SPDEVID as a required key variable and USUBJID as a conditionally required variable. See the BDS class for further details.'
Check:
  all:
    - name: AVALC
      operator: is_inconsistent_across_dataset
      where_populated: true
      value:
        - PARAMCD
        - AVAL
Core:
  Id: AD0742
  Status: Published
  Version: '1'
Description: Raise an error when, within a given value of PARAMCD, there is more than one value of AVALC for a given value of AVAL within BDS or MDBDS.
Executability: Fully Executable
Outcome:
  Message: Within a given value of PARAMCD, there is more than one value of AVALC for a given value of AVAL within BDS or MDBDS.
  Output Variables:
    - PARAMCD
    - AVALC
    - AVAL
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - BDS
      - MDBDS
  Domains:
    Include:
      - BDS
      - MDBDS
Sensitivity: Record

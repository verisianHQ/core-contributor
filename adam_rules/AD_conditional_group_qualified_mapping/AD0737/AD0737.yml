# Variable: SHIFTyN
# Condition: SHIFTyN and SHIFTy are both populated
# Rule: Within a given value of PARAMCD, there is more than one value of SHIFTyN for a given value of SHIFTy
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.1'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '737'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.1
                Section: '3.3.4'
                Item: 'Table 3.3.4.1'
                Cited Guidance: 
                  'ADaMIG v1.1, Section 3.3.4, Table 3.3.4.1: SHIFTyN maps one-to-one to SHIFTy within a parameter.'
      - Name: ADaMIG
        Version: '1.2'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '737'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.2
                Section: '3.3.4.1'
                Item: 'Table 3.3.4.1.1'
                Cited Guidance: 
                  'ADaMIG v1.2, Section 3.3.4.1, Table 3.3.4.1.1: SHIFTyN maps one-to-one to SHIFTy within a parameter.'
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '737'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.3
                Section: '3.3.4.1'
                Item: 'Table 3.3.4.1.1'
                Cited Guidance: 
                  'ADaMIG v1.3, Section 3.3.4.1, Table 3.3.4.1.1: SHIFTyN maps one-to-one to SHIFTy within a parameter.'
      - Name: ADaMIG-MD
        Version: '1.0'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '737'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG-MD v1.0
                Section: '3.1'
                Cited Guidance: 
                  'ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis needs by adding SPDEVID as a required key variable and USUBJID as a conditionally required variable. See the BDS class for further details.'
Check:
  all:
    - name: '^SHIFT(?P<y>[1-9]|[1-9][0-9])N$'
      operator: is_inconsistent_across_dataset
      where_populated: true
      variable_regex_pattern: true
      value:
        - PARAMCD
        - 'SHIFT{{y}}'
Core:
  Id: AD0737
  Status: Published
  Version: '1'
Description: Raise an error when, within a given value of PARAMCD, there is more than one value of SHIFTyN for a given value of SHIFTy within BDS or MDBDS.
Executability: Fully Executable
Outcome:
  Message: Within a given value of PARAMCD, there is more than one value of SHIFTyN for a given value of SHIFTy within BDS or MDBDS.
  Output Variables:
    - PARAMCD
    - 'SHIFT{{y}}N'
    - 'SHIFT{{y}}'
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - BDS
      - MDBDS
  Domains:
    Include:
      - BDS
      - MDBDS
Sensitivity: Record

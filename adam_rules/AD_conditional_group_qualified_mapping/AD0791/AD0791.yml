# Variable: ATPT
# Condition: ATPT and ATPTN are both populated
# Rule: Within a given value of PARAMCD, there is more than one value of ATPT for a given value of ATPTN
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.1'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '791'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.1
                Section: '3.3.3'
                Item: 'Table 3.3.3.1'
                Cited Guidance: 
                  'ADaMIG v1.1, Section 3.3.3, Table 3.3.3.1: Within the same parameter, there is a one-to-one mapping between ATPT and ATPTN.'
Check:
  all:
    - name: ATPT
      operator: is_inconsistent_across_dataset
      where_populated: true
      value:
        - PARAMCD
        - ATPTN
Core:
  Id: AD0791
  Status: Published
  Version: '1'
Description: Raise an error when, within a given value of PARAMCD, there is more than one value of ATPT for a given value of ATPTN within BDS.
Executability: Fully Executable
Outcome:
  Message: Within a given value of PARAMCD, there is more than one value of ATPT for a given value of ATPTN within BDS.
  Output Variables:
    - PARAMCD
    - ATPT
    - ATPTN
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - BDS
  Domains:
    Include:
      - BDS
Sensitivity: Record

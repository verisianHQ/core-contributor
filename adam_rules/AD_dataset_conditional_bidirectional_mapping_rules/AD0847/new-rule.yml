# Variable: FORMN
# Condition: FORMN and FORM are populated
# Rule: Each FORMN value must map to only one FORM value
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADPPKIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '847'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADPPKIG v1.0
        Section: '3.2'
        Item: Table 3.2
        Cited Guidance: 'ADPPKIG v1.0, Section 3.2, Table 3.2: Unique numerical representation
          of FORM. The numeric versions of the primary/character variables can be
          assigned from its corresponding character pair variable.'
Check:
  all:
  - name: FORM
    operator: is_inconsistent_across_dataset
    value: FORMN
    where_populated: true
Core:
  Id: AD0847
  Status: Draft
  Version: '1'
Description: Each FORMN value must map to only one FORM value when both variables
  are populated.
Executability: Fully Executable
Outcome:
  Message: FORM has more than one value for a given FORMN value when both variables
    are populated.
  Output Variables:
  - FORM
  - FORMN
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BDS
  Domains:
    Include:
    - ADPPK
Sensitivity: Record

# Variable: ROUTE
# Condition: ROUTE and ROUTEN are populated
# Rule: Each ROUTE value must map to only one ROUTEN value
# verified 
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADPPKIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '853'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADPPKIG v1.0
        Section: '3.2'
        Item: Table 3.2
        Cited Guidance: 'ADPPKIG v1.0, Section 3.2, Table 3.2: Derived from ROUTE
          as one-on-one unique match. The numeric versions of the primary/character
          variables can be assigned from its corresponding character pair variable.'
Check:
  all:
  - name: ROUTEN
    operator: is_inconsistent_across_dataset
    value: ROUTE
    where_populated: true
Core:
  Id: AD0853
  Status: Draft
  Version: '1'
Description: Each ROUTE value must map to only one ROUTEN value when both variables
  are populated.
Executability: Fully Executable
Outcome:
  Message: ROUTEN has more than one value for a given ROUTE value when both variables
    are populated.
  Output Variables:
  - ROUTEN
  - ROUTE
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BDS
  Domains:
    Include:
    - ADPPK
Sensitivity: Record

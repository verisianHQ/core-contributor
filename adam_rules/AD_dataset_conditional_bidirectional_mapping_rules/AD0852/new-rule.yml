# Variable: ROUTEN
# Condition: ROUTEN and ROUTE are populated
# Rule: Each ROUTEN value must map to only one ROUTE value
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADPPKIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '852'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADPPKIG v1.0
        Section: '3.2'
        Item: Table 3.2
        Cited Guidance: 'ADPPKIG v1.0, Section 3.2, Table 3.2: Derived from ROUTE
          as one-on-one unique match. The numeric versions of the primary/character
          variables can be assigned from its corresponding character pair variable.'
Check:
  all:
  - name: ROUTE
    operator: is_inconsistent_across_dataset
    value: ROUTEN
    where_populated: true
Core:
  Id: AD0852
  Status: Draft
  Version: '1'
Description: Each ROUTEN value must map to only one ROUTE value when both variables
  are populated.
Executability: Fully Executable
Outcome:
  Message: ROUTE has more than one value for a given ROUTEN value when both variables
    are populated.
  Output Variables:
  - ROUTE
  - ROUTEN
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BDS
  Domains:
    Include:
    - ADPPK
Sensitivity: Record

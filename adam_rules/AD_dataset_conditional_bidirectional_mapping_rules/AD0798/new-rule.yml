# Variable: PROJID
# Condition: PROJID and PROJIDN are populated
# Rule: Each PROJID value must map to only one PROJIDN value
# verified 
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADPPKIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '798'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADPPKIG v1.0
        Section: '3.2'
        Item: Table 3.2
        Cited Guidance: 'ADPPKIG v1.0, Section 3.2, Table 3.2: Unique numerical representation
          of PROJID. The numeric versions of the primary/character variables can be
          assigned from its corresponding character pair variable.'
Check:
  all:
  - name: PROJIDN
    operator: is_inconsistent_across_dataset
    value: PROJID
    where_populated: true
Core:
  Id: AD0798
  Status: Draft
  Version: '1'
Description: Each PROJID value must map to only one PROJIDN value when both variables
  are populated.
Executability: Fully Executable
Outcome:
  Message: PROJIDN has more than one value for a given PROJID value when both variables
    are populated.
  Output Variables:
  - PROJIDN
  - PROJID
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BDS
  Domains:
    Include:
    - ADPPK
Sensitivity: Record

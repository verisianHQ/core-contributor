# Variable: STUDYID
# Condition: STUDYID and STUDYIDN are populated
# Rule: Each STUDYID value must map to only one STUDYIDN value
# verified 
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADPPKIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '803'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADPPKIG v1.0
        Section: '3.2'
        Item: Table 3.2
        Cited Guidance: 'ADPPKIG v1.0, Section 3.2, Table 3.2: Unique numerical representation
          of STUDYID. The numeric versions of the primary/character variables can
          be assigned from its corresponding character pair variable.'
Check:
  all:
  - name: STUDYIDN
    operator: is_inconsistent_across_dataset
    value: STUDYID
    where_populated: true
Core:
  Id: AD0803
  Status: Draft
  Version: '1'
Description: Each STUDYID value must map to only one STUDYIDN value when both variables
  are populated.
Executability: Fully Executable
Outcome:
  Message: STUDYIDN has more than one value for a given STUDYID value when both variables
    are populated.
  Output Variables:
  - STUDYIDN
  - STUDYID
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BDS
  Domains:
    Include:
    - ADPPK
Sensitivity: Record

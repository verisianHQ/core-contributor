# Variable: PROJIDN
# Condition: PROJIDN and PROJID are populated
# Rule: Each PROJIDN value must map to only one PROJID value
# verified 
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADPPKIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '797'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADPPKIG v1.0
        Section: '3.2'
        Item: Table 3.2
        Cited Guidance: 'ADPPKIG v1.0, Section 3.2, Table 3.2: Unique numerical representation
          of PROJID. The numeric versions of the primary/character variables can be
          assigned from its corresponding character pair variable.'
Check:
  all:
  - name: PROJID
    operator: is_inconsistent_across_dataset
    value: PROJIDN
    where_populated: true
Core:
  Id: AD0797
  Status: Draft
  Version: '1'
Description: Each PROJIDN value must map to only one PROJID value when both variables
  are populated.
Executability: Fully Executable
Outcome:
  Message: PROJID has more than one value for a given PROJIDN value when both variables
    are populated.
  Output Variables:
  - PROJID
  - PROJIDN
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BDS
  Domains:
    Include:
    - ADPPK
Sensitivity: Record

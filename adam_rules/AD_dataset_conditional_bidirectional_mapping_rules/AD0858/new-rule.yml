# Variable: ACYCLE
# Condition: ACYCLE and ACYCLEC are populated
# Rule: Each ACYCLE value must map to only one ACYCLEC value
# verified 
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADPPKIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '858'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADPPKIG v1.0
        Section: '3.2'
        Item: Table 3.2
        Cited Guidance: 'ADPPKIG v1.0, Section 3.2, Table 3.2: Derived from ACYCLE
          as one-on-one unique match. The character versions of the primary/character
          variables can be assigned from its corresponding numeric pair variable.'
Check:
  all:
  - name: ACYCLEC
    operator: is_inconsistent_across_dataset
    value: ACYCLE
    where_populated: true
Core:
  Id: AD0858
  Status: Draft
  Version: '1'
Description: Each ACYCLE value must map to only one ACYCLEC value when both variables
  are populated.
Executability: Fully Executable
Outcome:
  Message: ACYCLEC has more than one value for a given ACYCLE value when both variables
    are populated.
  Output Variables:
  - ACYCLEC
  - ACYCLE
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BDS
  Domains:
    Include:
    - ADPPK
Sensitivity: Record

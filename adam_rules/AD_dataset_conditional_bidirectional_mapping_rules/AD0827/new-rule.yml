# Variable: FLGREASC
# Condition: FLGREASC and FLGREAS are populated
# Rule: Each FLGREASC value must map to only one FLGREAS value
# verified 
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADPPKIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '827'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADPPKIG v1.0
        Section: '3.2'
        Item: Table 3.2
        Cited Guidance: 'ADPPKIG v1.0, Section 3.2, Table 3.2: Captures primary reason
          for identifying the record for data issues, e.g., dose time imputation flags,
          etc. A sequential number starting with 1 and increments with each unique
          reason. Examples of reasons for identification of Data Issue can be found
          in Section 3.4.'
Check:
  all:
  - name: FLGREAS
    operator: is_inconsistent_across_dataset
    value: FLGREASC
    where_populated: true
Core:
  Id: AD0827
  Status: Draft
  Version: '1'
Description: Each FLGREASC value must map to only one FLGREAS value when both variables
  are populated.
Executability: Fully Executable
Outcome:
  Message: FLGREAS has more than one value for a given FLGREASC value when both variables
    are populated.
  Output Variables:
  - FLGREAS
  - FLGREASC
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BDS
  Domains:
    Include:
    - ADPPK
Sensitivity: Record

# Variable: STUDYIDN
# Condition: STUDYIDN and STUDYID are populated
# Rule: Each STUDYIDN value must map to only one STUDYID value
# verified 
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADPPKIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '802'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADPPKIG v1.0
        Section: '3.2'
        Item: Table 3.2
        Cited Guidance: 'ADPPKIG v1.0, Section 3.2, Table 3.2: Unique numerical representation
          of STUDYID. The numeric versions of the primary/character variables can
          be assigned from its corresponding character pair variable.'
Check:
  all:
  - name: STUDYID
    operator: is_inconsistent_across_dataset
    value: STUDYIDN
    where_populated: true
Core:
  Id: AD0802
  Status: Draft
  Version: '1'
Description: Each STUDYIDN value must map to only one STUDYID value when both variables
  are populated.
Executability: Fully Executable
Outcome:
  Message: STUDYID has more than one value for a given STUDYIDN value when both variables
    are populated.
  Output Variables:
  - STUDYID
  - STUDYIDN
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BDS
  Domains:
    Include:
    - ADPPK
Sensitivity: Record

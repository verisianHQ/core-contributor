# Variable: FORM
# Condition: FORM and FORMN are populated
# Rule: Each FORM value must map to only one FORMN value
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADPPKIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '848'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADPPKIG v1.0
        Section: '3.2'
        Item: Table 3.2
        Cited Guidance: 'ADPPKIG v1.0, Section 3.2, Table 3.2: Unique numerical representation
          of FORM. The numeric versions of the primary/character variables can be
          assigned from its corresponding character pair variable.'
Check:
  all:
  - name: FORMN
    operator: is_inconsistent_across_dataset
    value: FORM
    where_populated: true
Core:
  Id: AD0848
  Status: Draft
  Version: '1'
Description: Each FORM value must map to only one FORMN value when both variables
  are populated.
Executability: Fully Executable
Outcome:
  Message: FORMN has more than one value for a given FORM value when both variables
    are populated.
  Output Variables:
  - FORMN
  - FORM
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BDS
  Domains:
    Include:
    - ADPPK
Sensitivity: Record

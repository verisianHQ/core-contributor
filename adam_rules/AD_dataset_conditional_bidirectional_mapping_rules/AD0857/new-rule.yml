# Variable: ACYCLEC
# Condition: ACYCLEC and ACYCLE are populated
# Rule: Each ACYCLEC value must map to only one ACYCLE value
# verified 
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADPPKIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '857'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADPPKIG v1.0
        Section: '3.2'
        Item: Table 3.2
        Cited Guidance: 'ADPPKIG v1.0, Section 3.2, Table 3.2: Derived from ACYCLE
          as one-on-one unique match. The character versions of the primary/character
          variables can be assigned from its corresponding numeric pair variable.'
Check:
  all:
  - name: ACYCLE
    operator: is_inconsistent_across_dataset
    value: ACYCLEC
    where_populated: true
Core:
  Id: AD0857
  Status: Draft
  Version: '1'
Description: Each ACYCLEC value must map to only one ACYCLE value when both variables
  are populated.
Executability: Fully Executable
Outcome:
  Message: ACYCLE has more than one value for a given ACYCLEC value when both variables
    are populated.
  Output Variables:
  - ACYCLE
  - ACYCLEC
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BDS
  Domains:
    Include:
    - ADPPK
Sensitivity: Record

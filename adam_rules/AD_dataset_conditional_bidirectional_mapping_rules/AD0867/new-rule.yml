# Variable: RACEN
# Condition: RACEN and RACE are populated
# Rule: Each RACEN value must map to only one RACE value
# verified 
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADPPKIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '867'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADPPKIG v1.0
        Section: '3.3'
        Item: Table 3.3
        Cited Guidance: 'ADPPKIG v1.0, Section 3.3, Table 3.3: Numeric version of
          RACE eg. Codes used as per the specification. 1=American Indian OR Alaska
          Native, 2=Asian, 3=Black/African American, 4=Native Hawaiian OR Other Pacific
          Islander, 5=White. If races need to be categorized differently, then use
          variables ARACE and ARACEN.'
Check:
  all:
  - name: RACE
    operator: is_inconsistent_across_dataset
    value: RACEN
    where_populated: true
Core:
  Id: AD0867
  Status: Draft
  Version: '1'
Description: Each RACEN value must map to only one RACE value when both variables
  are populated.
Executability: Fully Executable
Outcome:
  Message: RACE has more than one value for a given RACEN value when both variables
    are populated.
  Output Variables:
  - RACE
  - RACEN
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BDS
  Domains:
    Include:
    - ADPPK
Sensitivity: Record

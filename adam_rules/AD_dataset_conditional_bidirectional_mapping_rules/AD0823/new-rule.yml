# Variable: SITEID
# Condition: SITEID and SITEIDN are populated
# Rule: Each SITEID value must map to only one SITEIDN value
# verified 
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADPPKIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '823'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADPPKIG v1.0
        Section: '3.2'
        Item: Table 3.2
        Cited Guidance: 'ADPPKIG v1.0, Section 3.2, Table 3.2: Unique numerical representation
          of SITEID. The numeric versions of the primary/character variables can be
          assigned from its corresponding character pair variable.'
Check:
  all:
  - name: SITEIDN
    operator: is_inconsistent_across_dataset
    value: SITEID
    where_populated: true
Core:
  Id: AD0823
  Status: Draft
  Version: '1'
Description: Each SITEID value must map to only one SITEIDN value when both variables
  are populated.
Executability: Fully Executable
Outcome:
  Message: SITEIDN has more than one value for a given SITEID value when both variables
    are populated.
  Output Variables:
  - SITEIDN
  - SITEID
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BDS
  Domains:
    Include:
    - ADPPK
Sensitivity: Record

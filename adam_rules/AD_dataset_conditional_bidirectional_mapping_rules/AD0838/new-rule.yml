  Standards:
  - Name: ADPPKIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '838'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADPPKIG v1.0
        Section: '3.2'
        Item: Table 3.2
        Cited Guidance: 'ADPPKIG v1.0, Section 3.2, Table 3.2: 1=Y. The numeric versions
          of the primary/character variables can be assigned from its corresponding
          character pair variable.'
Check:
  all:
  - name: BLQFN
    operator: is_inconsistent_across_dataset

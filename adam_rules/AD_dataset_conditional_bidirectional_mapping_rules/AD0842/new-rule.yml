# Variable: ALQFN
# Condition: ALQFN and ALQFL are populated
# Rule: Each ALQFN value must map to only one ALQFL value
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADPPKIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '842'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADPPKIG v1.0
        Section: '3.2'
        Item: Table 3.2
        Cited Guidance: 'ADPPKIG v1.0, Section 3.2, Table 3.2: 1=Y. The numeric versions
          of the primary/character variables can be assigned from its corresponding
          character pair variable.'
Check:
  all:
  - name: ALQFL
    operator: is_inconsistent_across_dataset
    value: ALQFN
    where_populated: true
Core:
  Id: AD0842
  Status: Draft
  Version: '1'
Description: Each ALQFN value must map to only one ALQFL value when both variables
  are populated.
Executability: Fully Executable
Outcome:
  Message: ALQFL has more than one value for a given ALQFN value when both variables
    are populated.
  Output Variables:
  - ALQFL
  - ALQFN
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BDS
  Domains:
    Include:
    - ADPPK
Sensitivity: Record

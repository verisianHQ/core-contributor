        Section: 3.2.9; 3.2.9; 3.1
        Item: Table 3.2.9.1; Table 3.2.9.1
        Cited Guidance: 'OCCDS v1.0, Section 3.2.9, Table 3.2.9.1: Code List / Controlled Terms have allowable values of: "BROAD", "NARROW".



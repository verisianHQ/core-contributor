Check:
  all:
  - name: ^SMQ(?P<zz>0[1-9]|[1-9][0-9])NAM$
    variable_regex_pattern: true
    operator: non_empty
  - name: SMQ{{zz}}SC
    operator: not_equal_to
    value: BROAD
  - name: SMQ{{zz}}SC
    operator: not_equal_to
    value: NARROW

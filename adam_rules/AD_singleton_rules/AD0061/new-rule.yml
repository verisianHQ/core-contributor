# Variable: TRTSDT or TRTSDTM
# Condition: SDTM.EX is present
# Rule: TRTSDT or TRTSDTM must be present
# verified 
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '61'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.0
        Section: '3.1'
        Item: Table 3.1.1
        Cited Guidance: 'ADaMIG v1.0, Section 3.1, Table 3.1.1: TRTSDT and/or TRTSDTM are required if there is an investigational
          product.'
  - Name: ADaMIG
    Version: '1.1'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '61'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.1
        Section: '3.2'
        Item: Table 3.2.6
        Cited Guidance: 'ADaMIG v1.1, Section 3.2, Table 3.2.6: TRTSDT and/or TRTSDTM are required if there is an investigational
          product.'
  - Name: ADaMIG
    Version: '1.2'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '61'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.2
        Section: '3.2'
        Item: Table 3.2.6
        Cited Guidance: 'ADaMIG v1.2, Section 3.2, Table 3.2.6: TRTSDT and/or TRTSDTM are required if there is an investigational
          product.'
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '61'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3
        Section: '3.2'
        Item: Table 3.2.6
        Cited Guidance: 'ADaMIG v1.3, Section 3.2, Table 3.2.6: TRTSDT and/or TRTSDTM are required if there is an investigational
          product.'
Check:
  all:
  - name: $ex_count
    operator: greater_than
    value: 0
  - name: TRTSDT
    operator: not_exists
  - name: TRTSDTM
    operator: not_exists
Core:
  Id: AD0061
  Status: Draft
  Version: '1'
Description: SDTM.EX is present and neither TRTSDT nor TRTSDTM is present.
Executability: Fully Executable
Operations:
- domain: EX
  id: $ex_count
  operator: record_count
Outcome:
  Message: SDTM.EX is present and neither TRTSDT nor TRTSDTM is present.
  Output Variables:
  - TRTSDT
  - TRTSDTM
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - ADSL
  Domains:
    Include:
    - ALL
Sensitivity: Record

    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '313'
        Version: '2'
      Version: '5.0'
      Citations:
      - Document: OCCDS v1.0; OCCDS v1.1; ADaMIG-MD v1.0
        Section: 3.2.9; 3.2.9; 3.1
        Item: Table 3.2.9.1; Table 3.2.9.1
        Cited Guidance: 'OCCDS v1.0, Section 3.2.9, Table 3.2.9.1: Code List / Controlled Terms have allowable values of: 1, 2.


          OCCDS v1.1, Section 3.2.9, Table 3.2.9.1: Code List / Controlled Terms have allowable values of: 1, 2.


          ADaMIG-MD v1.0, Section 3.1: The MDOCCDS supports analysis needs by adding SPDEVID as a required identifier and allowing USUBJID be a conditionally required variable. See the OCCDS class for further details.'
  - Name: OCCDS
    Version: '1.1'

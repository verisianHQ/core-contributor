Check:
  all:
  - name: ^SMQ(?P<zz>0[1-9]|[1-9][0-9])SCN$
    variable_regex_pattern: true
    operator: non_empty
  - name: SMQ{{zz}}SCN
    operator: not_equal_to
    value: 1
  - name: SMQ{{zz}}SCN
    operator: not_equal_to
    value: 2

        Section: 4.1.2; 3
        Item: 5 (General Variable Naming Conventions)
        Cited Guidance: 'Model v2.1, Section 4.1.2: In developing naming conventions, sponsors should consider the requirements
          noted in the eCTD guidance document as well as the need to conform to the SAS Transport format requirements (e.g.,
          the total length of the name cannot exceed 8 characters).


          ADaMIG v1.0, Section 3, Item 5 (General Variable Naming Conventions): To ensure compliance with SAS Transport file
          and Oracle constraints, all ADaM variable names must be no more than 8 characters in length, start with a letter
          (not underscore), and be comprised only of letters (A-Z), underscore (_), and numerals (0-9). All ADaM variable
          labels must be no more than 40 characters in length. All ADaM character variables must be no more than 200 characters

# Variable: Treatment variables
# Condition: ADaM dataset is present
# Rule: At least one defined treatment variable must be present
# verified 
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.1'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '719'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.1
        Section: 3.3.2
        Item: Table 3.3.2.1
        Cited Guidance: 'ADaMIG v1.1, Section 3.3.2, Table 3.3.2.1: At least one treatment variable is required in a BDS dataset.
          This requirement is satisfied by any of the subject-level or record-level treatment variables (e.g. TRTxxP or TRTP).
          One is allowed to use any treatment variable in analysis of BDS. Any subject-level treatment variable may be copied
          into the BDS dataset from ADSL.'
  - Name: ADaMIG
    Version: '1.2'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '719'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.2
        Section: 3.3.2
        Item: Table 3.3.2.1
        Cited Guidance: 'ADaMIG v1.2, Section 3.3.2, Table 3.3.2.1: At least one treatment variable is required in a BDS dataset.
          This requirement is satisfied by any of the subject-level treatment variables (e.g., TRTxxP) or record-level treatment
          variables (e.g., TRTP). All treatment variables defined in Table 3.3.2.1 are record level, meaning that the values
          contained in the variable may vary by record within a subject. Subject-level treatment variables are described in
          Table 3.2.4.'
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '719'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3
        Section: 3.3.2
        Item: Table 3.3.2.1
        Cited Guidance: 'ADaMIG v1.3, Section 3.3.2, Table 3.3.2.1: At least one treatment variable is required in a BDS dataset.
          This requirement is satisfied by any of the subject-level treatment variables (e.g., TRTxxP) or record-level treatment
          variables (e.g., TRTP). All treatment variables defined in Table 3.3.2.1 are record level, meaning that the values
          contained in the variable may vary by record within a subject. Subject-level treatment variables are described in
          Table 3.2.4.'
Check:
  all:
  - name: ^(?:TRTP|TRTA|ARM|ACTARM|TRTSEQP|TRTSEQA|TRTPG[1-9][0-9]?|TRTAG[1-9][0-9]?|TRT(?:0[1-9]|[1-9][0-9])[PA]|TR(?:0[1-9]|[1-9][0-9])[PA]G[1-9][0-9]?|TSEQ[PA]G[1-9][0-9]?)$
    variable_regex_pattern: true
    operator: not_exists
Core:
  Id: AD0719
  Status: Draft
  Version: '1'
Description: No subject-level or record-level treatment variable defined in the IG is present.
Executability: Fully Executable
Outcome:
  Message: No subject-level or record-level treatment variable defined in the IG is present.
  Output Variables:
  - ^(?:TRTP|TRTA|ARM|ACTARM|TRTSEQP|TRTSEQA|TRTPG[1-9][0-9]?|TRTAG[1-9][0-9]?|TRT(?:0[1-9]|[1-9][0-9])[PA]|TR(?:0[1-9]|[1-9][0-9])[PA]G[1-9][0-9]?|TSEQ[PA]G[1-9][0-9]?)$
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - ALL
  Domains:
    Include:
    - ALL
Sensitivity: Record

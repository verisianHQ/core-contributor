# Variable: BASETYPE
# Condition: BASETYPE is present
# Rule: BASETYPE must be consistently populated within the dataset
# verified 
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.1'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '734'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.1
        Section: 3.3.4; 4.2.1
        Item: Table 3.3.4.1; 6
        Cited Guidance: 'ADaMIG v1.1, Section 3.3.4, Table 3.3.4.1: If used for any PARAM within a dataset, should be non-null for all records of that dataset.


          ADaMIG v1.1, Section 4.2.1, Item 6: Whenever there is more than one definition of baseline, the BASETYPE column is required. BASETYPE identifies the definition of baseline that corresponds to the value of BASE in each row.'
Check:
  all:
  - name: BASETYPE
    operator: is_inconsistent_across_dataset
    value: STUDYID
Core:
  Id: AD0734
  Status: Draft
  Version: '1'
Description: BASETYPE is populated inconsistently within a dataset.
Executability: Fully Executable
Outcome:
  Message: BASETYPE is populated inconsistently within a dataset.
  Output Variables:
    - BASETYPE
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - BDS
  Domains:
    Include:
      - ALL
Sensitivity: Record

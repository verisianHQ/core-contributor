Check:
  all:
  - name: ^TR(?P<xx>0[1-9]|[1-9][0-9])PG(?P<y>[1-9])$
    variable_regex_pattern: true
    operator: exists
  - name: TRT{{xx}}A
    operator: exists
  - name: TR{{xx}}AG{{y}}
    operator: not_exists
Core:
  Id: AD0368
  Status: Draft
  Version: '1'
Description: TRxxPGy and TRTxxA are present while corresponding TRxxAGy is absent.
Executability: Fully Executable
Outcome:
  Message: TRxxPGy and TRTxxA are present while corresponding TRxxAGy is absent.
  Output Variables:
  - TR{{xx}}PG{{y}}
  - TRT{{xx}}A
  - TR{{xx}}AG{{y}}
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - ADSL
  Domains:
    Include:
    - ALL
Sensitivity: Record

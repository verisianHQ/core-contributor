# Variable: CNSR
# Condition: CNSR is populated
# Rule: CNSR is not a nonnegative integer.
# verified 
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '169'
        Version: '2'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3; ADaMIG-MD v1.0
        Section: 3.3.6; 3.1
        Item: Table 3.3.6.1
        Cited Guidance: 'ADaMIG v1.3, Section 3.3.6, Table 3.3.6.1: It is strongly recommended to use 0 as an event indicator
          and positive integers as censoring indicators.


          ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis needs by adding SPDEVID as a required key variable and
          USUBJID as a conditionally required variable. See the BDS class for further details.'
Check:
  all:
  - name: CNSR
    operator: non_empty
  - name: CNSR
    operator: not_matches_regex
    value: ^[0-9]+$
    value_is_literal: true

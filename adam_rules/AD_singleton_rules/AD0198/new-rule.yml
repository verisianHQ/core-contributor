# Variable: AVAL or AVALC
# Condition: BDS dataset is present
# Rule: AVAL or AVALC must be present
# verified 
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '198'
        Version: '2'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3; ADaMIG-MD v1.0
        Section: 3.3.4.1; 3.1
        Item: Table 3.3.4.1.1
        Cited Guidance: 'ADaMIG v1.3, Section 3.3.4.1, Table 3.3.4.1.1: AVALC is required if AVAL is not present, since either
          AVAL or AVALC must be present in the dataset.


          ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis needs by adding SPDEVID as a required key variable and
          USUBJID as a conditionally required variable. See the BDS class for further details.'
Check:
  all:
  - name: AVAL
    operator: not_exists
  - name: AVALC
    operator: not_exists
Core:
  Id: AD0198
  Status: Draft
  Version: '2'
Description: Neither AVAL nor AVALC is present in a BDS dataset.
Executability: Fully Executable
Outcome:
  Message: Neither AVAL nor AVALC is present in a BDS dataset.
  Output Variables:
  - AVAL
  - AVALC
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BDS
    - MDBDS
  Domains:
    Include:
    - ALL
Sensitivity: Record

# Variable: USUBJID/SPDEVID
# Condition: ADDL exists
# Rule: Key values must identify one record
# verified 
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '688'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG-MD v1.0
        Section: 3.1.1
        Cited Guidance: 'ADaMIG-MD v1.0, Section 3.1.1: An ADDL contains one record per device per subject.'
Check:
  all:
  - name: SPDEVID
    operator: present_on_multiple_rows_within
    within: USUBJID
Core:
  Id: AD0688
  Status: Draft
  Version: '1'
Description: Duplicate USUBJID/SPDEVID values exist in ADDL.
Executability: Fully Executable
Outcome:
  Message: Duplicate USUBJID/SPDEVID values exist in ADDL.
  Output Variables:
  - USUBJID
  - SPDEVID
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - ALL
  Domains:
    Include:
    - ADDL
Sensitivity: Record

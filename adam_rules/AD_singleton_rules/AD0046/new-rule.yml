# Variable: *DY
# Condition: *DY is present
# Rule: *DY must not equal zero
# verified 
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '46'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.0
        Section: '3'
        Item: 8 (General Timing Variable Conventions)
        Cited Guidance: 'ADaMIG v1.0, Section 3, Item 8 (General Timing Variable Conventions): Variables whose names end in
          DY are relative day variables. In ADaM as in the SDTM, there is no day 0. If there is a need to create a relative
          day variable that includes day 0, then its name must not end in DY. ADaM relative day variables need not be anchored
          by SDTM RFSTDTC. When SDTM.RFSTDTC is not the anchor date then the anchor date used must be stored in an ADaM dataset.'
  - Name: ADaMIG
    Version: '1.1'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '46'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.1
        Section: 3.1.2
        Item: '8'
        Cited Guidance: 'ADaMIG v1.1, Section 3.1.2, Item 8: Variables whose names end in DY are relative day variables. In
          ADaM as in the SDTM, there is no day 0. If there is a need to create a relative day variable that includes day 0,
          then its name must not end in DY.'
  - Name: ADaMIG
    Version: '1.2'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '46'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.2
        Section: 3.1.2
        Item: '8'
        Cited Guidance: 'ADaMIG v1.2, Section 3.1.2, Item 8: Variables whose names end in DY are relative day variables. In
          ADaM as in the SDTM, there is no day 0. If there is a need to create a relative day variable that includes day 0,
          then its name must not end in DY.'
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '46'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3
        Section: 3.1.2
        Item: '8'
        Cited Guidance: 'ADaMIG v1.3, Section 3.1.2, Item 8: Variables whose names end in DY are relative day variables. In
          ADaM as in the SDTM, there is no day 0. If there is a need to create a relative day variable that includes day 0,
          then its name must not end in DY.'
Check:
  all:
  - name: ^(?P<day>[A-Z][A-Z0-9_]{0,5}DY)$
    variable_regex_pattern: true
    operator: equal_to
    value: 0
Core:
  Id: AD0046
  Status: Draft
  Version: '1'
Description: A variable with a suffix of DY has a value of zero.
Executability: Fully Executable
Outcome:
  Message: A variable with a suffix of DY has a value of zero.
  Output Variables:
  - '{{day}}'
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - ALL
  Domains:
    Include:
    - ALL
Sensitivity: Record

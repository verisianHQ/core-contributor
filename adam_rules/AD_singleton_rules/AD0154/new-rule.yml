# Variable: ABLFL
# Condition: BASETYPE is present
# Rule: At most one ABLFL=Y per subject, PARAMCD, and BASETYPE
# verified 
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '154'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.0
        Section: 3.2.6
        Item: Table 3.2.6.1
        Cited Guidance: 'ADaMIG v1.0, Section 3.2.6, Table 3.2.6.1: Character indicator to identify the baseline record for each parameter, or if there is more than one baseline definition, for each parameter and baseline type (BASETYPE). See BASETYPE in Table 3.2.4.1. ABLFL is required if BASE is present in the dataset. A baseline record may be derived (e.g., it may be an average), in which case DTYPE must also be populated. If BASE is populated for a parameter, and BASE is non-null for a subject for that parameter, then there must be a record flagged by ABLFL for that subject and parameter.'
  - Name: ADaMIG
    Version: '1.1'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '154'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.1
        Section: 3.3.8
        Item: Table 3.3.8.1
        Cited Guidance: 'ADaMIG v1.1, Section 3.3.8, Table 3.3.8.1: Character indicator to identify the baseline record for each subject, parameter, and baseline type (BASETYPE) combination. See BASETYPE in Table 3.3.4.1. ABLFL is required if BASE is present in the dataset. A baseline record may be derived (e.g., it may be an average), in which case DTYPE must also be populated. If BASE is populated for a parameter, and BASE is non-null for a subject for that parameter, then there must be a record flagged by ABLFL for that subject and parameter.'
  - Name: ADaMIG
    Version: '1.2'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '154'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.2
        Section: 3.3.8
        Item: Table 3.3.8.1
        Cited Guidance: 'ADaMIG v1.2, Section 3.3.8, Table 3.3.8.1: Character indicator to identify the baseline record for each subject, parameter, and baseline type (BASETYPE) combination. See BASETYPE in Table 3.3.4.1.1. ABLFL is required if BASE is present in the dataset. A baseline record may be derived (e.g., it may be an average), in which case DTYPE must also be populated. If BASE is populated for a parameter, and BASE is non-null for a subject for that parameter, then there must be a record flagged by ABLFL for that subject and parameter.'
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '154'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3
        Section: 3.3.8
        Item: Table 3.3.8.1
        Cited Guidance: 'ADaMIG v1.3, Section 3.3.8, Table 3.3.8.1: Character indicator to identify the baseline record for each subject, parameter, and baseline type (BASETYPE) combination. See BASETYPE in Table 3.3.4.1.1. ABLFL is required if BASE is present in the dataset. A baseline record may be derived (e.g., it may be an average), in which case DTYPE must also be populated. If BASE is populated for a parameter, and BASE is non-null for a subject for that parameter, then there must be a record flagged by ABLFL for that subject and parameter.'
Check:
  all:
  - name: BASETYPE
    operator: exists
  - name: ABLFL
    operator: equal_to
    value: Y
  - name: ABLFL
    operator: is_not_unique_set
    value:
      - USUBJID
      - PARAMCD
      - BASETYPE
Core:
  Id: AD0154
  Status: Draft
  Version: '1'
Description: More than one record has ABLFL equal to Y within a subject, PARAMCD, and BASETYPE.
Executability: Fully Executable
Outcome:
  Message: More than one record has ABLFL equal to Y within a subject, PARAMCD, and BASETYPE.
  Output Variables:
    - USUBJID
    - PARAMCD
    - BASETYPE
    - ABLFL
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - BDS
  Domains:
    Include:
      - ALL
Sensitivity: Record

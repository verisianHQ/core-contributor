# Variable: Treatment variables
# Condition: BDS or MDBDS dataset is present
# Rule: At least one defined treatment variable must be present
# verified 
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '581'
        Version: '2'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3; ADaMIG-MD v1.0
        Section: 3.3.2; 3.1
        Item: ''
        Cited Guidance: 'ADaMIG v1.3, Section 3.3.2: At least one treatment variable is required in a BDS dataset. This requirement
          is satisfied by any of the subject-level treatment variables (e.g., TRTxxP) or record-level treatment variables
          (e.g., TRTP). All treatment variables defined in Table 3.3.2.1 are record level, meaning that the values contained
          in the variable may vary by record within a subject. Subject-level treatment variables are described in Table 3.2.4.
          See also Section 4.1, Examples of Treatment Variables for Common Trial Designs.


          ADaMIG-MD v1.0, Section 3.1: The MDBDS supports analysis needs by adding SPDEVID as a required key variable and
          USUBJID as a conditionally required variable. See the BDS class for further details.'
Check:
  all:
  - name: ^(?:TRTP|TRTA|ARM|ACTARM|TRTSEQP|TRTSEQA|TRTPG[1-9][0-9]?|TRTAG[1-9][0-9]?|TRT(?:0[1-9]|[1-9][0-9])[PA]|TR(?:0[1-9]|[1-9][0-9])[PA]G[1-9][0-9]?|TSEQ[PA]G[1-9][0-9]?)$
    variable_regex_pattern: true
    operator: not_exists
Core:
  Id: AD0581
  Status: Draft
  Version: '2'
Description: No defined record-level or subject-level treatment variable is present.
Executability: Fully Executable
Outcome:
  Message: No defined record-level or subject-level treatment variable is present.
  Output Variables:
  - ^(?:TRTP|TRTA|ARM|ACTARM|TRTSEQP|TRTSEQA|TRTPG[1-9][0-9]?|TRTAG[1-9][0-9]?|TRT(?:0[1-9]|[1-9][0-9])[PA]|TR(?:0[1-9]|[1-9][0-9])[PA]G[1-9][0-9]?|TSEQ[PA]G[1-9][0-9]?)$
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BDS
    - MDBDS
  Domains:
    Include:
    - ALL
Sensitivity: Record

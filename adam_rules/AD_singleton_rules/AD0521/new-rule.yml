# Variable: *GRyN
# Condition: *GRyN is present
# Rule: Same-root *GRy must be present
# verified 
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.1'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '521'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.1
        Section: 3.1.1
        Item: '6'
        Cited Guidance: 'ADaMIG v1.1, Section 3.1.1, Item 6: When the secondary variable is numeric, it can only be included
          if the primary variable is also present in the dataset.'
  - Name: ADaMIG
    Version: '1.2'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '521'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.2
        Section: 3.1.1
        Item: '6'
        Cited Guidance: 'ADaMIG v1.2, Section 3.1.1, Item 6: When a secondary variable is included in the dataset, then the
          primary variable must also be included.'
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '521'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3
        Section: 3.1.1
        Item: '6'
        Cited Guidance: 'ADaMIG v1.3, Section 3.1.1, Item 6: When a secondary variable is included in the dataset, then the
          primary variable must also be included.'
Check:
  all:
  - name: ^(?P<root>[A-Z][A-Z0-9_]{0,3})GR(?P<y>[1-9][0-9]?)N$
    variable_regex_pattern: true
    operator: exists
  - name: '{{root}}GR{{y}}'
    operator: not_exists
Core:
  Id: AD0521
  Status: Draft
  Version: '1'
Description: A GRyN variable is present without its same-root GRy variable.
Executability: Fully Executable
Outcome:
  Message: A GRyN variable is present without its same-root GRy variable.
  Output Variables:
  - '{{root}}GR{{y}}N'
  - '{{root}}GR{{y}}'
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - ALL
  Domains:
    Include:
    - ALL
Sensitivity: Record

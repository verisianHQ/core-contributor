# Variable: TRTEDT or TRTEDTM
# Condition: SDTM.EX is present
# Rule: TRTEDT or TRTEDTM must be present
# verified 
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.0'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '365'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.0
        Section: '3.1'
        Item: Table 3.1.1
        Cited Guidance: 'ADaMIG v1.0, Section 3.1, Table 3.1.1: TRTEDT and/or TRTEDTM are required if there is an investigational
          product.'
  - Name: ADaMIG
    Version: '1.1'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '365'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.1
        Section: '3.2'
        Item: Table 3.2.6
        Cited Guidance: 'ADaMIG v1.1, Section 3.2, Table 3.2.6: TRTEDT and/or TRTEDTM are required if there is an investigational
          product.'
  - Name: ADaMIG
    Version: '1.2'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '365'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.2
        Section: '3.2'
        Item: Table 3.2.6
        Cited Guidance: 'ADaMIG v1.2, Section 3.2, Table 3.2.6: TRTEDT and/or TRTEDTM are required if there is an investigational
          product.'
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '365'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3
        Section: '3.2'
        Item: Table 3.2.6
        Cited Guidance: 'ADaMIG v1.3, Section 3.2, Table 3.2.6: TRTEDT and/or TRTEDTM are required if there is an investigational
          product.'
Check:
  all:
  - name: $ex_count
    operator: greater_than
    value: 0
  - name: TRTEDT
    operator: not_exists
  - name: TRTEDTM
    operator: not_exists
Core:
  Id: AD0365
  Status: Draft
  Version: '1'
Description: SDTM.EX is present and neither TRTEDT nor TRTEDTM is present.
Executability: Fully Executable
Operations:
- domain: EX
  id: $ex_count
  operator: record_count
Outcome:
  Message: SDTM.EX is present and neither TRTEDT nor TRTEDTM is present.
  Output Variables:
  - TRTEDT
  - TRTEDTM
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - ADSL
  Domains:
    Include:
    - ALL
Sensitivity: Record

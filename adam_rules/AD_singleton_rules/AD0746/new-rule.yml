# Variable: SRCDOM
# Condition: SRCDOM is present
# Rule: SRCDOM must name an SDTM or ADaM dataset in the study
# verified 
Authorities:
- Organization: CDISC
  Standards:
  - Name: ADaMIG
    Version: '1.1'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '746'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.1
        Section: 3.3.9
        Item: Table 3.3.9.1
        Cited Guidance: SRCDOM contains the SDTM domain name or ADaM dataset name related to the analysis value.
  - Name: ADaMIG
    Version: '1.2'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '746'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.2
        Section: 3.3.9
        Item: Table 3.3.9.1
        Cited Guidance: SRCDOM contains the SDTM domain name or ADaM dataset name related to the analysis value.
  - Name: ADaMIG
    Version: '1.3'
    References:
    - Origin: ADaM Conformance Rules
      Rule Identifier:
        Id: '746'
        Version: '1'
      Version: '5.0'
      Citations:
      - Document: ADaMIG v1.3
        Section: 3.3.9
        Item: Table 3.3.9.1
        Cited Guidance: SRCDOM contains the SDTM domain name or ADaM dataset name related to the analysis value.
Check:
  all:
  - name: SRCDOM
    operator: non_empty
  - name: SRCDOM
    operator: is_not_contained_by_case_insensitive
    value: $study_domains
Core:
  Id: AD0746
  Status: Draft
  Version: '1'
Description: SRCDOM is not an SDTM domain name or ADaM dataset name in the study.
Executability: Fully Executable
Operations:
- id: $study_domains
  operator: study_domains
Outcome:
  Message: SRCDOM has a value that is not an SDTM domain name, ADaM dataset name, or null.
  Output Variables:
  - SRCDOM
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
    - BDS
    - MDBDS
    - OCCDS
    - MDOCCDS
  Domains:
    Include:
    - ALL
Sensitivity: Record
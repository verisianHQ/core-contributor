Check:
  all:
    - name: ^TRT(?P<xx>[0-9]{2})P$
      variable_regex_pattern: true
      operator: does_not_have_previous_enumerated_column
Core:
  Id: AD0081
  Status: Published
  Version: '1'
Description: Raise an error when TRTxxP is present and xx is greater than 01 and TRT{xx-1}P is not present.
Executability: Fully Executable
Outcome:
  Message: TRTxxP is present for xx greater than 01, but the previous period treatment variable is missing.
  Output Variables:
    - TRT{{xx}}P
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - ADSL
Sensitivity: Record

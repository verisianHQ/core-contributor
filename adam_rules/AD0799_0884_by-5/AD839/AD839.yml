# Variable: BLQFL, BLQFN
# Condition: BLQFN is present within BDS
# Rule: BLQFL is not present within BDS
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '839'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.3
                Section: 3.1.1
                Item: '6'
                Cited Guidance: 
                  'ADaMIG v1.3, Section 3.1.1, Item 6: When a secondary variable is included in the dataset, then the primary variable must also be included.'
Check:
  all:
    - name: BLQFN
      operator: exists
    - name: BLQFL
      operator: not_exists
Core:
  Id: AD839
  Status: Published
  Version: '1'
Description: Raise an error when the BLQFN variable is present within BDS, but the BLQFL variable is not present.
Executability: Fully Executable
Outcome:
  Message: BLQFN is present, but BLQFL is not present within BDS.
  Output Variables:
    - BLQFN
    - BLQFL
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - BDS
  Domains:
    Include:
      - BDS
Sensitivity: Dataset
# Variable: SUBJID, SUBJIDN
# Condition: SUBJIDN is present within BDS
# Rule: SUBJID is not present within BDS
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '819'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.3
                Section: 3.1.1
                Item: '6'
                Cited Guidance: 
                  'ADaMIG v1.3, Section 3.1.1, Item 6: When a secondary variable is included in the dataset, then the primary variable must also be included.'
Check:
  all:
    - name: SUBJIDN
      operator: exists
    - name: SUBJID
      operator: not_exists
Core:
  Id: AD819
  Status: Published
  Version: '1'
Description: Raise an error when the SUBJIDN variable is present within BDS, but the SUBJID variable is not present.
Executability: Fully Executable
Outcome:
  Message: SUBJIDN is present, but SUBJID is not present within BDS.
  Output Variables:
    - SUBJIDN
    - SUBJID
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - BDS
  Domains:
    Include:
      - BDS
Sensitivity: Dataset
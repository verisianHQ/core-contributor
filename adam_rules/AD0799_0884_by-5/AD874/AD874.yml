# Variable: SEX, SEXN
# Condition: SEXN is present within BDS
# Rule: SEX is not present within BDS
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '874'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.3
                Section: 3.1.1
                Item: '6'
                Cited Guidance: 
                  'ADaMIG v1.3, Section 3.1.1, Item 6: When a secondary variable is included in the dataset, then the primary variable must also be included.'
Check:
  all:
    - name: SEXN
      operator: exists
    - name: SEX
      operator: not_exists
Core:
  Id: AD874
  Status: Published
  Version: '1'
Description: Raise an error when the SEXN variable is present within BDS, but the SEX variable is not present.
Executability: Fully Executable
Outcome:
  Message: SEXN is present, but SEX is not present within BDS.
  Output Variables:
    - SEXN
    - SEX
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - BDS
  Domains:
    Include:
      - BDS
Sensitivity: Dataset
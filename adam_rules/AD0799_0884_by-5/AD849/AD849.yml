# Variable: FORM, FORMN
# Condition: FORMN is present within BDS
# Rule: FORM is not present within BDS
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        Version: '1.3'
        References:
          - Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: '849'
              Version: '1'
            Version: '5.0'
            Citations:
              - Document: IG v1.3
                Section: 3.1.1
                Item: '6'
                Cited Guidance: 
                  'ADaMIG v1.3, Section 3.1.1, Item 6: When a secondary variable is included in the dataset, then the primary variable must also be included.'
Check:
  all:
    - name: FORMN
      operator: exists
    - name: FORM
      operator: not_exists
Core:
  Id: AD849
  Status: Published
  Version: '1'
Description: Raise an error when the FORMN variable is present within BDS, but the FORM variable is not present.
Executability: Fully Executable
Outcome:
  Message: FORMN is present, but FORM is not present within BDS.
  Output Variables:
    - FORMN
    - FORM
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - BDS
  Domains:
    Include:
      - BDS
Sensitivity: Dataset
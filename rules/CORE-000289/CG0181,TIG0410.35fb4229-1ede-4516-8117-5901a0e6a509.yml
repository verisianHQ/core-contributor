Check:
  all:
    - name: LBORRES
      operator: not_matches_regex
      value: ^(<|>|< |> )?(-?((\d+(\.\d+)?)|(\.\d+)))$
    - name: LBORNRHI
      operator: non_empty
    - name: LBORRES
      operator: non_empty
Core:
  Id: CORE-000289
  Status: Published
  Version: '1'
Description: Raise an error when LBORRES is not a continuous measurement but LBORNRHI is populated.
Executability: Fully Executable
Outcome:
  Message: LBORNRHI must not be populated when LBORRES is not a continuous measurment.
  Output Variables:
    - LBTESTCD
    - LBORRES
    - LBORNRHI
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - FINDINGS
  Domains:
    Include:
      - LB
  Use Case: INDH
Sensitivity: Record

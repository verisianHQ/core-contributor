        Version: '3.4'
      - Name: SDTMIG
        References:
          - Citations:
              - Cited Guidance: Upper end of reference range for continuous measurements in
                  original units. Should be populated only for continuous
                  results.
                Document: IG v3.2
                Item: Specification
                Section: '6.3'
            Origin: SDTM and SDTMIG Conformance Rules
            Rule Identifier:
              Id: CG0181

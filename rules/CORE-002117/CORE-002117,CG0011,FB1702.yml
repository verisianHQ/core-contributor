Check:
  all:
    - name: $duplicate_extended_terms
      operator: non_empty
Core:
  Id: CORE-002117
  Status: Published
  Version: '1'
Description: Raise an error when CDISC Controlled Terminology specifies the
 codelist as extensible and a new term is a duplicate, a synonym or a subset of
 an existing submission value.
Executability: Fully Executable
Operations:
  - id: $duplicate_extended_terms
    operator: define_extended_terms_in_ct
Outcome:
  Message: A new term has been added to an extensible code list that is a
    duplicate, a synonym or a subset of an existing submission value.
  Output Variables:
    - $duplicate_extended_terms
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - ALL
  Domains:
    Include:
      - ALL
Sensitivity: Study

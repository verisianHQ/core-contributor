# Variable: ARMNRS
# Condition: USUBJID in EX.USUBJID AND TSVAL = 'INTERVENTIONAL' when TSPARMCD = 'STYPE'
# Rule: ARMNRS in (SCREEN FAILURE; NOT ASSIGNED; ASSIGNED, NOT TREATED)

Authorities:
  - Organization: FDA
    Standards:
      - Name: SDTMIG
        References:
          - Citations:
              - Cited Guidance: For interventional studies all treated subjects should have
                  exposure data.
                Document: FDA
                Section: FDAB023
            Origin: FDA Business Rules
            Rule Identifier:
              Id: FB2304
              Version: '1'
            Version: '1.5'
        Version: '3.3'
      - Name: SDTMIG
        References:
          - Citations:
              - Cited Guidance: For interventional studies all treated subjects should have
                  exposure data.
                Document: FDA
                Section: FDAB023
            Origin: FDA Business Rules
            Rule Identifier:
              Id: FB2304
              Version: '1'
            Version: '1.5'
        Version: '3.4'
Check:
  all:
    - name: ARMNRS
      operator: non_empty
    - name: ARMNRS
      operator: not_equal_to
      value: "UNPLANNED TREATMENT"
      value_is_literal: true
    - name: TSPARMCD
      operator: equal_to
      value: "STYPE"
      value_is_literal: true
    - name: TSVAL
      operator: equal_to
      value: "INTERVENTIONAL"
      value_is_literal: true
    - name: USUBJID
      operator: is_contained_by
      value: $usubjids_in_ex
Core:
  Status: Published
  Version: '1'
  Id: CORE-000927
Description: Raise an error when a subject participating in an interventional study has a record in EX but ARMNRS is populated and is not equal to 'UNPLANNED TREATMENT'.
Executability: Fully Executable
Match Datasets:
  - Keys:
      - STUDYID
    Name: TS
Operations:
  - domain: EX
    id: $usubjids_in_ex
    name: USUBJID
    operator: distinct
Outcome:
  Message: Subject in interventional study with exposure records in EX dataset is not assigned to an actual treatment.
  Output Variables:
    - ARMNRS
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - SPECIAL PURPOSE
  Domains:
    Include:
      - DM
Sensitivity: Record

Check:
  all:
    - name: LBORRES
      operator: matches_regex
      value: ^(<|>|< |> )?(-?((\d+(\.\d+)?)|(\.\d+)))$
    - name: LBSTNRC
      operator: non_empty
Core:
  Id: CORE-002098
  Status: Published
  Version: '1'
Description: Raise an error when LBORRES is a continuous measurement but LBSTNRC is populated.
Executability: Fully Executable
Outcome:
  Message: LBSTNRC must not be populated when LBORRES is a continuous measurement.
  Output Variables:
    - LBTESTCD
    - LBORRES
    - LBSTNRC
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - FINDINGS
  Domains:
    Include:
      - LB
Sensitivity: Record
# Variable: --OBJ
# Condition: Interventions parent record exists and DECOD = null
# Rule: --OBJ = --TRT
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: SDTMIG
        References:
          - Citations:
              - Cited Guidance: When findings are collected about an event or intervention, and
                  the name of the event or intervention is collected in an
                  "Other, specify" CRF field, the value in --OBJ variable
                  depends on whether the FA record has a parent record and
                  whether the "Other, specify" value was coded.
                Document: IG v3.4
                Section: '4.2.7.4'
            Origin: SDTM and SDTMIG Conformance Rules
            Rule Identifier:
              Id: CG0602
              Version: '1'
            Version: '2.0'
        Version: '3.4'
      - Name: TIG
        References:
          - Citations:
              - Cited Guidance: When findings are collected about an event or intervention, and
                  the name of the event or intervention is collected in an
                  "Other, specify" CRF field, the value in --OBJ variable
                  depends on whether the FA record has a parent record and
                  whether the "Other, specify" value was coded.
                Document: TIG 1.0
                Section: 2.8.7.4
            Origin: TIG Conformance Rules
            Rule Identifier:
              Id: TIG0656
              Version: '1'
            Version: '1.0'
        Substandard: SDTM
        Version: '1.0'
Check:
  all:
    - any:
        - name: --DECOD
          operator: empty
        - name: --DECOD
          operator: not_exists
    - name: --TRT
      operator: not_equal_to
      value: RELREC.FAOBJ
Core:
  Id: CORE-000757
  Status: Published
  Version: '1'
Description: Raise an error when interventions parent record exists and --DECOD is not populated or not present, but FAOBJ is not equal
  to --TRT.
Executability: Fully Executable
Match Datasets:
  - Name: RELREC
    Wildcard: FA
Outcome:
  Message: Related record is present in the parent interventions domain dataset with --DECOD not populated or not present, but FAOBJ is not equal to the --TRT in the parent domain dataset.
  Output Variables:
    - RELREC.FAOBJ
    - --DECOD
    - --TRT
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - INTERVENTIONS
  Domains:
    Include:
      - ALL
  Use Case: INDH
Sensitivity: Record
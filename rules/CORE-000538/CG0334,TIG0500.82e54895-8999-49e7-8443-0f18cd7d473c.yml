Check:
  all:
    - name: $dataset_names
      operator: non_empty
      #operator: does_not_equal_string_part
      #operator: equals_string_part
      #regex: .{4}(..).*
      #value: $dataset_names
Core:
  Id: CORE-000538
  Status: Published
  Version: '1'
Description: Raise an error when RDOMAIN does not match characters 5 and 6 of
  the Supplementary dataset name.
Executability: Fully Executable
Operations:
  - operator: dataset_names
    id: $dataset_names
Outcome:
  Message: RDOMAIN must match characters 5 and 6 of the dataset name.
  Output Variables:
    - $dataset_names
    - RDOMAIN
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - ALL
  Domains:
    Include:
      - ALL
  Use Case: INDH, PROD
Sensitivity: Study

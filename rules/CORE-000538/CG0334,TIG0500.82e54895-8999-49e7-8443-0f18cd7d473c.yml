# Variable: RDOMAIN
# Condition: Dataset name begins with 'SUPP'
# Rule: Value of RDOMAIN equals characters 5 and 6 of the dataset name
Authorities:
  - Organization: CDISC
    Standards:
      - Name: SDTMIG
        References:
          - Citations:
              - Cited Guidance: Supplemental Qualifier datasets for split
                  domains would also be split. The nomenclature would include
                  the additional one-to-two characters used to identify the
                  split dataset (e.g., SUPPQS36, SUPPFACM). The value of
                  RDOMAIN in the SUPP-- datasets would be the two-character
                  domain code (e.g., QS, FA).
                Document: IG v3.4
                Item: '7'
                Section: 4.1.7
            Origin: SDTM and SDTMIG Conformance Rules
            Rule Identifier:
              Id: CG0334
              Version: '2'
            Version: '2.0'
        Version: '3.4'
      - Name: SDTMIG
        References:
          - Citations:
              - Cited Guidance: Supplemental Qualifier datasets for split
                  domains would also be split. The nomenclature would include
                  the additional one-to-two characters used to identify the
                  split dataset (e.g., SUPPQS36; SUPPFACM). The value of
                  RDOMAIN in the SUPP-- datasets would be the two-character
                  domain code (e.g., QS; FA).
                Document: IG v3.2
                Item: '7'
                Section: 4.1.1.7
            Origin: SDTM and SDTMIG Conformance Rules
            Rule Identifier:
              Id: CG0334
              Version: '2'
            Version: '2.0'
        Version: '3.2'
      - Name: SDTMIG
        References:
          - Citations:
              - Cited Guidance: Supplemental Qualifier datasets for split
                  domains would also be split. The nomenclature would include
                  the additional one-to-two characters used to identify the
                  split dataset (e.g., SUPPQS36; SUPPFACM). The value of
                  RDOMAIN in the SUPP-- datasets would be the two-character
                  domain code (e.g., QS; FA).
                Document: IG v3.3
                Item: '7'
                Section: 4.1.7
            Origin: SDTM and SDTMIG Conformance Rules
            Rule Identifier:
              Id: CG0334
              Version: '2'
            Version: '2.0'
        Version: '3.3'
      - Name: TIG
        References:
          - Citations:
              - Cited Guidance: Supplemental Qualifier datasets for split
                  domains will also be split. The nomenclature will include
                  the additional one to two characters used to identify the

    - name: TIVERS
      operator: not_exists
    - operator: is_not_unique_set
      name: IETESTCD
      value: DOMAIN
Core:
  Id: CORE-002110
  Status: Published
  Version: '1'
Description: Raise an error when an inclusion/exclusion criterion occurs more than once in the TI dataset but TIVERS is not present in the dataset.
Executability: Fully Executable
Outcome:
  Message: TIVERS must be present in the TI dataset when at least one inclusion/exclusion criterion (IETESTCD) occurs more than once.
  Output Variables:
    - IETESTCD
    - TIVERS
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - TRIAL DESIGN
  Domains:
    Include:
      - TI
Sensitivity: Dataset
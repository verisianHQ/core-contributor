# Variable: ETHNIC, CETHNIC
# Condition: ETHNIC ^= null or SUPPDM.CETHNIC ^= null
# Rule: ETHNIC or ETHNICC codelist in the Define-XML document contains at least: 'HISPANIC OR LATINO' or 'NOT HISPANIC OR LATINO'.
# verified
Authorities:
  - Organization: FDA
    Standards:
      - Name: SDTMIG
        References:
          - Citations:
              - Cited Guidance: >
                  When collecting ethnicity demographic data from clinical
                  trial participants, the following two minimum choices should
                  be offered: 'HISPANIC OR LATINO' or 'NOT HISPANIC OR LATINO'
                Document: FDA
                Section: FDAB057
            Origin: FDA Business Rules
            Rule Identifier:
              Id: FB5701
              Version: '1'
            Version: '1.5'
        Version: '3.2'
      - Name: SDTMIG
        References:
          - Citations:
              - Cited Guidance: >
                  When collecting ethnicity demographic data from clinical
                  trial participants, the following two minimum choices should
                  be offered: 'HISPANIC OR LATINO' or 'NOT HISPANIC OR LATINO'
                Document: FDA
                Section: FDAB057
            Origin: FDA Business Rules
            Rule Identifier:
              Id: FB5701
              Version: '1'
            Version: '1.5'
        Version: '3.3'
      - Name: SDTMIG
        References:
          - Citations:
              - Cited Guidance: >
                  When collecting ethnicity demographic data from clinical
                  trial participants, the following two minimum choices should
                  be offered: 'HISPANIC OR LATINO' or 'NOT HISPANIC OR LATINO'
                Document: FDA
                Section: FDAB057
            Origin: FDA Business Rules
            Rule Identifier:
              Id: FB5701
              Version: '1'
            Version: '1.5'
        Version: '3.4'
Check:
  any:
    - all:
        - name: ETHNIC
          operator: non_empty
        - name: ETHNIC
          operator: is_not_contained_by
          value:
            - HISPANIC OR LATINO
            - NOT HISPANIC OR LATINO
          value_is_literal: true
    - all:
        - name: CETHNIC
          operator: non_empty
        - name: CETHNIC
          operator: is_not_contained_by
          value:
            - HISPANIC OR LATINO
            - NOT HISPANIC OR LATINO
          value_is_literal: true
        - name: ETHNIC
          operator: is_not_contained_by
          value:
            - HISPANIC OR LATINO
            - NOT HISPANIC OR LATINO
          value_is_literal: true
Core:
  Id: CORE-000726
  Status: Published
  Version: '1'
Description: >
 Raise an error when ETHNIC or ETHNICC codelist in the Define-XML document does
 not contain: 'HISPANIC OR LATINO' or 'NOT HISPANIC OR LATINO'.
Executability: Partially Executable
Match Datasets:
  - Keys:
      - USUBJID
    Name: SUPPDM
Outcome:
  Message: >
    Ethnicity is collected, but one of the following ethnicity options are not
    offered: 'HISPANIC OR LATINO' or 'NOT HISPANIC OR LATINO'.
  Output Variables:
    - ETHNIC
    - CETHNIC
    - QVAL
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - SPECIAL PURPOSE
      - RELATIONSHIP
  Domains:
    Include:
      - DM
Sensitivity: Record

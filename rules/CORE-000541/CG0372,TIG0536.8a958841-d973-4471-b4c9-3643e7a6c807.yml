Check:
  any:
    - name: IETESTCD
      operator: not_matches_regex
      value: ^[a-zA-Z_][a-zA-Z0-9_]{0,7}$
Core:
  Id: CORE-000541
  Status: Published
  Version: '1'
Description: Raise an error when IETESTCD is longer than 8 characters or
  contains characters besides letters, numbers, and underscores, or starts with
  a number.
Executability: Fully Executable
Outcome:
  Message: IETESTCD must be shorter than 9 characters and must not contain 
    characters besides letters, numbers, and underscores, and must not start
    with a number.
  Output Variables:
    - IETESTCD
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - TRIAL DESIGN
  Domains:
    Include:
      - ALL
  Use Case: INDH, PROD
Sensitivity: Record

Check:
  all:
    - name: TSVALNF
      operator: non_empty
    - operator: is_not_contained_by
      name: TSVALNF
      value:
        - NI
        - NA
        - INV
        - OTH
        - PINF
        - NINF
        - UNC
        - DER
        - UNK
        - ASKU
        - NAV
        - NASK
        - TRC
        - MSK
        - QS
      value_is_literal: true
Core:
  Id: CORE-002114
  Status: Published
  Version: '1'
Description: Part E - Raise an error when value for TSVALNF is not populated with a valid ISO 21090 NullFlavor.
Executability: Fully Executable
Outcome:
  Message: TSVALNF must be a valid ISO 21090 NullFlavor.
  Output Variables:
    - TSPARMCD
    - TSVALNF
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - TRIAL DESIGN
  Domains:
    Include:
      - TS
Sensitivity: Record

    - name: variable_name
      operator: equal_to
      value: DVTERM
      value_is_literal: true
    - name: define_variable_origin_type
      operator: equal_to
      value: Derived
      value_is_literal: true
Core:
  Id: CORE-000348
  Status: Published
  Version: '1'
Description: Raise an error when deviation event ('DVTERM') is derived.
Executability: Fully Executable
Outcome:
  Message: DVTERM must not be listed as 'Derived' in the define.xml.
  Output Variables:
    - variable_name
    - define_variable_origin_type
Rule Type: Variable Metadata Check against Define XML
Scope:
  Classes:
    Include:
      - EVENTS
  Domains:
    Include:
      - DV

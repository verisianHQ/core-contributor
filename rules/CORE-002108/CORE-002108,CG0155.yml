# Variable: DOMAIN
# Condition: AP Core Domain
# Rule: Value length = 4 characters beginning with 'AP' and ending with 2 character SDTM domain
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: SDTMIG
        References:
          - Citations:
              - Cited Guidance: >-
                  [Associated Persons datasets are given a prefix of AP-- to
                  identify the data as AP data to and distinguish them from
                  study subject data.][Associated Persons domain codes in the
                  DOMAIN column of every record are also given a prefix of AP--
                  to identify the domains as AP domains and to distinguish them
                  from study subject domains. AP domain codes are therefore four
                  characters long.]
                Document: AP Guide v1.0
                Section: '2'
            Origin: SDTM and SDTMIG Conformance Rules
            Rule Identifier:
              Id: CG0155
              Version: '1'
            Version: '2.0'
        Version: '3.2'
      - Name: SDTMIG
        References:
          - Citations:
              - Cited Guidance: >-
                  [Associated Persons datasets are given a prefix of AP-- to
                  identify the data as AP data to and distinguish them from
                  study subject data.][Associated Persons domain codes in the
                  DOMAIN column of every record are also given a prefix of AP--
                  to identify the domains as AP domains and to distinguish them
                  from study subject domains. AP domain codes are therefore four
                  characters long.]
                Document: AP Guide v1.0
                Section: '2'
            Origin: SDTM and SDTMIG Conformance Rules
            Rule Identifier:
              Id: CG0155
              Version: '1'
            Version: '2.0'
        Version: '3.3'
Check:
  any:
    - name: DOMAIN
      operator: prefix_not_equal_to
      prefix: 2
      value: AP
      value_is_literal: true
    - name: DOMAIN
      operator: suffix_is_not_contained_by
      suffix: 2
      value: $DOMAINS
    - name: DOMAIN
      operator: not_matches_regex
      value: "^[A-Z]{4}$"
Core:
  Id: CORE-002108
  Status: Published
  Version: '1'
Description: Raise an error when the dataset is an AP domain but DOMAIN value length is not 4 characters beginning with 'AP' and ending with a 2 character SDTM domain.
Executability: Partially Executable - Possible Overreporting
Operations:
  - ct_attribute: Term Signification
    id: $DOMAINS
    operator: get_codelist_attributes
    name: DOMAINS
    ct_conditions:
      - Codelist Code: C66734
Outcome:
  Message: DOMAIN value for an AP domain must be 4 characters long, beginning with 'AP' and ending with a valid 2-character SDTM domain code.
  Output Variables:
    - DOMAIN
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - ALL
  Domains:
    Exclude:
      - APRELSUB
      - FA
      - POOLDEF
    Include:
      - AP--
Sensitivity: Record
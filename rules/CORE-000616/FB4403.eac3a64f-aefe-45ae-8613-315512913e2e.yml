Check:
  all:
    - name: --STINT
      operator: non_empty
    - any:
      - name: --TPTREF
        operator: empty
      - name: --TPTREF
        operator: not_exists
Core:
  Id: CORE-000616
  Status: Published
  Version: '1'
Description: Raise an error when Planned Start of Assessment Interval (--STINT) is populated and 
  Time Point Reference (--TPTREF) is not populated.
Executability: Fully Executable
Outcome:
  Message: --STINT is populated, but --TPTREF is missing.
  Output Variables:
    - --STINT
    - --TPTREF
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - INTERVENTIONS
      - EVENTS
      - FINDINGS
  Domains:
    Include:
      - ALL
Sensitivity: Record

Check:
  all:
    - name: --TPTREF
      operator: exists
    - name: --STINT
      operator: exists
    - name: --STINT
      operator: non_empty
    - name: --TPTREF
      operator: empty
Core:
  Id: CORE-000616
  Status: Published
  Version: '1'
Description: Raise an error when planned Start of Assessment Interval (--STINT) is populated and Time Point Reference (--TPTREF) is not populated.
Executability: Fully Executable
Outcome:
  Message: --STINT is populated, but --TPTREF is missing.
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - ALL
  Domains:
    Include:
      - ALL
Sensitivity: Record

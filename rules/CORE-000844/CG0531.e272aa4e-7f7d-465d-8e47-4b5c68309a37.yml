# Variable: 
# Condition: RACE = MULTIPLE
# Rule: Multiple SUPPDM.QNAM records exist for the subject
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: SDTMIG
        References:
          - Citations:
              - Cited Guidance: If multiple races are collected then the value
                  of RACE should be 'MULTIPLE' and the additional information
                  will be included in the Supplemental Qualifiers dataset.
                Document: IG v3.3
                Item: Assumption 6
                Section: '5.2'
            Origin: SDTM and SDTMIG Conformance Rules
            Rule Identifier:
              Id: CG0531
              Version: '1'
            Version: '2.0'
        Version: '3.3'
      - Name: SDTMIG
        References:
          - Citations:
              - Cited Guidance: If multiple races are collected, then the value
                  of RACE should be 'MULTIPLE' and the additional information
                  will be included in the Supplemental Qualifiers dataset.
                Document: IG v3.4
                Item: Assumption 6
                Section: '5.2'
            Origin: SDTM and SDTMIG Conformance Rules
            Rule Identifier:
              Id: CG0531
              Version: '1'
            Version: '2.0'
        Version: '3.4'
Check:
  all:
    - name: RACE
      operator: equal_to
      value: MULTIPLE
      value_is_literal: true
    - name: $study_domains
      operator: does_not_contain
      value: SUPPDM
      value_is_literal: true
Core:
  Id: CORE-000844
  Status: Published
  Version: '1'
Description: Part A - Raise an error when RACE in DM equals 'MULTIPLE' and
  SUPPDM dataset is not present.
Executability: Fully Executable
Operations:
  - id: $study_domains
    operator: study_domains
Outcome:
  Message: Multiple SUPPDM.QNAM records must exist for the subject if RACE in
    DM equals 'MULTIPLE'.
  Output Variables:
    - RACE
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - ALL
  Domains:
    Include:
      - DM
Sensitivity: Record

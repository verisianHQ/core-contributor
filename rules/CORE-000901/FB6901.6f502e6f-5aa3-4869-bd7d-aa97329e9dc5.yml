Check:
  all:
    - name: PPCAT
      operator: non_empty
    - name: RELREC.PCRFTDTC
      operator: non_empty
    - name: PPRFTDTC
      operator: equal_to
      value: RELREC.PCRFTDTC
    - name: PPCAT
      operator: not_equal_to
      value: RELREC.PCTEST
Core:
  Id: CORE-000901
  Status: Published
  Version: '1'
Description: Parameter Category for a drug or metabolite (PPCAT) matches Test Name
  (PCTEST) for that same drug or metabolite.
Executability: Partially Executable - Possible Underreporting
Match Datasets:
  - Name: RELREC
    Wildcard: PC
Outcome:
  Message: Parameter Category for a drug or metabolite (PPCAT) does not match a
    Test Name (PCTEST) in the PC dataset.
  Output Variables:
    - PPCAT
    - PPRFTDTC
    - RELREC.PCRFTDTC
    - RELREC.PCTEST
Sensitivity: Record
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - FINDINGS
  Domains:
    Include:
      - PP

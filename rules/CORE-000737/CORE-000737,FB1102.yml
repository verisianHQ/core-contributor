          - OBJSEC
          - ONGOSIND
          - OUTMSPRI
          - PDPSTIND
          - PDSTIND
          - PIPIND
          - PLANSUB
          - RDIND
          - REGID
          - SENDTC
          - SEXPOP
          - SPONSOR
          - SDTMVER
          - SDTIGVER
          - STYPE
          - STOPRULE
          - SSTDTC
          - TBLIND
          - TCNTRL
          - THERAREA
          - TITLE
          - TPHASE
          - TTYPE
          - INDIC
          - SPREFID
        value_is_literal: true
Core:
  Id: CORE-000737
  Status: Published
  Version: '1'
Description: Raise an error when not all FDA Desired Trial Summary (TS)
  Parameters (TSPARMCDs) are present in the TS dataset or TSVAL is not populated.
Executability: Fully Executable
Operations:
  - id: $FDAdesired_missing_tsparmcds
    operator: distinct
    name:
      - ACTSUB
      - ADAPT
      - ADDON
      - AGEMAX
      - AGEMIN
      - COMPTRT
      - DCUTDESC
      - DCUTDTC
      - EXTTIND
      - FCNTRY
      - FDATCHSP
      - HLTSUBJI
      - LENGTH
      - NARMS
      - NCOHORT
      - OBJPRIM
      - OBJSEC
      - ONGOSIND
      - OUTMSPRI
      - PDPSTIND
      - PDSTIND
      - PIPIND
      - PLANSUB
      - RDIND
      - REGID
      - SENDTC
      - SEXPOP
      - SPONSOR
      - SDTMVER
      - SDTIGVER
      - STYPE
      - STOPRULE
      - SSTDTC
      - TBLIND
      - TCNTRL
      - THERAREA
      - TITLE
      - TPHASE
      - TTYPE
      - INDIC
      - SPREFID
  - id: $distinct_tsparmcds
    name: TSPARMCD
    operator: distinct
  - id: $FDAdesired_missing_tsparmcds
    name:
      - ACTSUB
      - ADAPT
      - ADDON
      - AGEMAX
      - AGEMIN
      - COMPTRT
      - DCUTDESC
      - DCUTDTC
      - EXTTIND
      - FCNTRY
      - FDATCHSP
      - HLTSUBJI
      - LENGTH
      - NARMS
      - NCOHORT
      - OBJPRIM
      - OBJSEC
      - ONGOSIND
      - OUTMSPRI
      - PDPSTIND
      - PDSTIND
      - PIPIND
      - PLANSUB
      - RDIND
      - REGID
      - SENDTC
      - SEXPOP
      - SPONSOR
      - SDTMVER
      - SDTIGVER
      - STYPE
      - STOPRULE
      - SSTDTC
      - TBLIND
      - TCNTRL
      - THERAREA
      - TITLE
      - TPHASE
      - TTYPE
      - INDIC
      - SPREFID
    operator: minus
    subtract: $distinct_tsparmcds
  - id: $empty_tsparmcds
    operator: distinct
    name: TSPARMCD
    filter:
      TSVAL: null
  - id: $FDAdesired_empty_tsparmcd
    operator: intersect
    name: $empty_tsparmcds
    substract:
      - ACTSUB
      - ADAPT
      - ADDON
      - AGEMAX
      - AGEMIN
      - COMPTRT
      - DCUTDESC
      - DCUTDTC
      - EXTTIND
      - FCNTRY
      - FDATCHSP
      - HLTSUBJI
      - LENGTH
      - NARMS
      - NCOHORT
      - OBJPRIM
      - OBJSEC
      - ONGOSIND
      - OUTMSPRI
      - PDPSTIND
      - PDSTIND
      - PIPIND
      - PLANSUB
      - RDIND
      - REGID
      - SENDTC
      - SEXPOP
      - SPONSOR
      - SDTMVER
      - SDTIGVER
      - STYPE
      - STOPRULE
      - SSTDTC
      - TBLIND
      - TCNTRL
      - THERAREA
      - TITLE
      - TPHASE
      - TTYPE
      - INDIC
      - SPREFID
Outcome:
  Message: At least one FDA Desired TSPARMCD is missing in the TS dataset or TSVAL is not populated.
  Output Variables:
    - $FDAdesired_missing_tsparmcds
    - $FDAdesired_empty_tsparmcd
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - TRIAL DESIGN
  Domains:
    Include:
      - TS
Sensitivity: Dataset

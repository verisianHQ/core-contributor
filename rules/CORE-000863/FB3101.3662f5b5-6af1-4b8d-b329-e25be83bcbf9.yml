Check:
  all:
    - name: --STRESC
      operator: non_empty
    - name: --STRESC
      operator: matches_regex
      value: ^-?(0|[1-9]\d*)(\.\d+)?$
    - name: --STRESN
      operator: empty
Core:
  Id: CORE-000863
  Status: Published
  Version: '1'
Description: --STRESC is populated with a numeric value and --STRESN is also
  populated.
Executability: Fully Executable
Outcome:
  Message: Missing value for --STRESN when --STRESC is numeric.
  Output Variables:
    - --STRESC
    - --STRESN
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - FINDINGS
  Domains:
    Include:
      - ALL
Sensitivity: Record

Check:
  all:
    - name: IECAT
      operator: equal_to_case_insensitive
      value: $domain_name
Core:
  Id: CORE-002111
  Status: Published
  Version: '1'
Description: Raise an error when IECAT is equal to Domain Name.
Executability: Fully Executable
Operations:
  - id: $domain_name
    operator: domain_label
Outcome:
  Message: IECAT must not be equal to Domain Name.
  Output Variables:
    - IECAT
    - $domain_name
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - ALL
  Domains:
    Include:
      - TI
  Use Case: INDH, PROD
Sensitivity: Record
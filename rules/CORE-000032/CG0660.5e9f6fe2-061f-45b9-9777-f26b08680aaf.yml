# Variable: --EVALID
# Condition: Domain in ('QS', 'FT') or (Domain = 'RS' and it's the Clinical Classification Use Case)
# Rule: --EVALID not present in dataset
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: SDTMIG
        Version: '3.4'
        References:
          - Origin: SDTM and SDTMIG Conformance Rules
            Rule Identifier:
              Id: CG0660
              Version: '1'
            Version: '2.0'
            Citations:
              - Cited Guidance: --EVAL and --EVALID must not be used to model QRS
                  data in SDTM.
                Document: IG v3.4
                Item: Assumption 8
                Section: 6.3.9.1
              - Cited Guidance: --EVAL and --EVALID must not be used to model QRS
                  data in SDTM.
                Document: IG v3.4
                Item: Assumption 8
                Section: 6.3.9.2
              - Cited Guidance: --EVAL and --EVALID must not be used to model QRS
                  data in SDTM.
                Document: IG v3.4
                Item: Assumption 8
                Section: 6.3.9.3.2
Check:
  any:
    - name: QSEVALID
      operator: exists
    - name: FTEVALID
      operator: exists
    - name: RSCAT
      operator: is_contained_by
      value: $cccat_terms
Operations:
  - id: $cccat_terms
    operator: get_codelist_attributes
    name: CCCAT
    ct_attribute: Term Value
    ct_conditions:
      - Codelist Code: C118971
Core:
  Id: CORE-000032
  Status: Published
  Version: '1'
Description: Raise an error when --EVALID is present in the dataset.
Executability: Fully Executable
Outcome:
  Message: --EVALID must not be present.
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - FINDINGS
  Domains:
    Include:
      - QS
      - FT
      - RS
Sensitivity: Dataset

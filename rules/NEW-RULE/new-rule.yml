Check:
  all:
    - name: CMDECOD
      operator: non_empty
    - name: CMDECOD
      operator: is_not_valid_whodrug_term_reference
      case_insensitive: true
Core:
  Id: CDISC.SDTMIG.CG0096
  Status: Draft
  Version: '1'
Description: Raise an error when CMDECOD is populated with a value that is not a valid WHODrug dictionary preferred drug name.
Executability: Fully Executable
Outcome:
  Message: CMDECOD is not a valid WHODrug dictionary preferred drug name.
  Output Variables:
    - CMTRT
    - CMDECOD
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - INTERVENTIONS
  Domains:
    Include:
      - CM
Sensitivity: Record
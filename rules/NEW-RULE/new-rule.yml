Check:
  all:
    - any:
        - name: --ENDTC
          operator: non_empty
        - name: --ENRF
          operator: non_empty
        - name: --ENRTPT
          operator: non_empty
    - all:
        - any:
            - name: --DTC
              operator: not_exists
            - name: --DTC
              operator: empty
        - any:
            - name: --STRF
              operator: not_exists
            - name: --STRF
              operator: empty
        - any:
            - name: --STRTPT
              operator: not_exists
            - name: --STRTPT
              operator: empty
Core:
  Id: FDA.SDTMIG.FB4307
  Status: Published
  Version: '1'
Description: Raise an error when end timepoint (--ENDTC, --ENRF or --ENRTPT) is populated but
  related start timepoint (--DTC, --STRF or --STRTPT) is not populated.
Executability: Fully Executable
Outcome:
  Message: End timepoint is populated but start timepoint is missing.
  Output Variables:
    - --DTC
    - --STRF
    - --STRTPT
    - --ENDTC
    - --ENRF
    - --ENRTPT
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - FINDINGS
  Domains:
    Include:
      - ALL
Sensitivity: Record

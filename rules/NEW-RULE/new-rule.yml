Check:
  all:
    - operator: does_not_contain
      name: $alpha_3_iso3166_1_country_codes
      value: COUNTRY
Core:
  Id: ''
  Status: Draft
  Version: '1'
Description: Part A - Raise an error when value for COUNTRY in DM dataset is not populated with a valid 3-letter country code found in ISO 3166-1.
Executability: Fully Executable
Operations:
  - id: $alpha_3_iso3166_1_country_codes
    operator: get_countries
    attribute_name: alpha_3
    codelist: ISO 3166-1
Outcome:
  Message: COUNTRY value must be a valid ISO 3166-1 3-letter country code.
  Output Variables:
    - COUNTRY
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - SPECIAL PURPOSE
  Domains:
    Include:
      - DM
Sensitivity: Record

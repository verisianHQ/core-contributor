# Variable: FATESTCD
# Condition: Collected data fit a Qualifier variable listed in SDTM: Sections 2.2.1, 2.2.2, or 2.2.3, and are represented in the Findings About domain
# Rule: The name of the variable is used as the value of FATESTCD.
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: SDTMIG
        References:
          - Citations:
              - Cited Guidance: >-
                  When collected data fit a Qualifier variable listed in SDTM:
                  Sections 3.1.1, 3.1.2, or 3.1.3, and are represented in the
                  Findings About domain, then the name of the variable should be
                  used as the value of FATESTCD.
                Document: IG v3.4
                Section: 6.4.3
            Origin: SDTM and SDTMIG Conformance Rules
            Rule Identifier:
              Id: CG0173
              Version: '1'
            Version: '2.0'
        Version: '3.4'
      - Name: SDTMIG
        References:
          - Citations:
              - Cited Guidance: >-
                  When collected data fit a Qualifier variable listed in SDTM:
                  Sections 2.2.1, 2.2.2, or 2.2.3, and are represented in the
                  Findings About domain, then the name of the variable should be
                  used as the value of FATESTCD.
                Document: IG v3.2
                Section: 6.4.3
            Origin: SDTM and SDTMIG Conformance Rules
            Rule Identifier:
              Id: CG0173
              Version: '1'
            Version: '2.0'
        Version: '3.2'
      - Name: SDTMIG
        References:
          - Citations:
              - Cited Guidance: >-
                  When collected data fit a Qualifier variable listed in SDTM:
                  Sections 2.2.1, 2.2.2, or 2.2.3, and are represented in the
                  Findings About domain, then the name of the variable should be
                  used as the value of FATESTCD.
                Document: IG v3.3
                Section: 6.4.3
            Origin: SDTM and SDTMIG Conformance Rules
            Rule Identifier:
              Id: CG0173
              Version: '1'
            Version: '2.0'
        Version: '3.3'
Check:
 all: 
  - any:
    - name: $fatest_lib_roles
      operator: contains
      value: Record Qualifier
      value_is_literal: true
    - name: $fatest_lib_roles
      operator: contains
      value: Variable Qualifier
      value_is_literal: true
    - name: $fatest_lib_roles
      operator: contains
      value: Result Qualifier
      value_is_literal: true
    - name: $fatest_lib_roles
      operator: contains
      value: Grouping Qualifier
      value_is_literal: true
    - name: $fatest_lib_roles
      operator: contains
      value: Synonym Qualifier
      value_is_literal: true
  - name: FATESTCD
    operator: is_not_substring_of
    value: $fatest_lib_names
Core:
  Id: CDISC.SDTMIG.CG0173
  Status: Draft
  Version: '1'
Description: Raise an error when collected data fits a Qualifier variable listed
  in specified SDTM Sections and are represented in the Findings About domain,
  and the name of the variable is used as FATEST.
Executability: Partially Executable - Possible Underreporting
Operations:
  - id: $fatest_lib_roles
    operator: label_referenced_variable_metadata
    name: FATEST
    attribute_name: role
  - id: $fatest_lib_names
    operator: label_referenced_variable_metadata
    name: FATEST
    attribute_name: name
Outcome:
  Message: FATEST matches a qualifier variable label defined in the SDTM model, but FATESTCD does not match the corresponding variable name.
  Output Variables:
    - FATEST
    - FATESTCD
    - $fatest_lib_names
    - $fatest_lib_roles
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - FINDINGS ABOUT
  Domains:
    Include:
      - FA
Sensitivity: Record

# Variable: TSVCDVER
# Condition: Reference Terminology is versioned.
# Rule: TSVCDVER ^= null
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: SDTMIG
        References:
          - Citations:
              - Cited Guidance: The version number of the Reference Terminology, if applicable.
                Document: IG v3.2
                Item: Specification
                Section: '7.4'
            Origin: SDTM and SDTMIG Conformance Rules
            Rule Identifier:
              Id: CG0267
              Version: '1'
            Version: '2.0'
        Version: '3.2'
      - Name: SDTMIG
        References:
          - Citations:
              - Cited Guidance: The version number of the Reference Terminology, if applicable.
                Document: IG v3.3
                Item: Specification
                Section: '7.4.2'
            Origin: SDTM and SDTMIG Conformance Rules
            Rule Identifier:
              Id: CG0267
              Version: '1'
            Version: '2.0'
        Version: '3.3'
      - Name: SDTMIG
        References:
          - Citations:
              - Cited Guidance: The version number of the Reference Terminology, if applicable.
                Document: IG v3.4
                Item: Specification
                Section: '7.4.2'
            Origin: SDTM and SDTMIG Conformance Rules
            Rule Identifier:
              Id: CG0267
              Version: '1'
            Version: '2.0'
        Version: '3.4'
Check:
  all:
    - operator: is_contained_by
      name: TSVCDREF
      value:
        - CDISC CT
        - UNII
        - SNOMED
        - MED-RT
      value_is_literal: true
    - name: TSVCDVER
      operator: empty
Core:
  Id: ''
  Status: Draft
  Version: '1'
Description: Raise an error when the reference terminology used in the TS dataset is versioned ('CDISC CT', 'UNII', 'SNOMED', 'MED-RT') but the version of the reference terminology is not provided.
Executability: Partially Executable - Possible Underreporting
Outcome:
  Message: The reference terminology used in the TS dataset is versioned ('CDISC CT', 'UNII', 'SNOMED', 'MED-RT') but TSVCDVER is not populated.
  Output Variables:
    - TSPARMCD
    - TSVCDREF
    - TSVCDVER
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - TRIAL DESIGN
  Domains:
    Include:
      - TS
Sensitivity: Record

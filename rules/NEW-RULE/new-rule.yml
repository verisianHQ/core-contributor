# Variable: TSVAL
# Condition: TSVAL when TSPARMCD = 'SSDTC'
# Rule: TSVAL =  min(DM.RFICDTC)
Authorities:
  - Organization: FDA
    Standards:
      - Name: SDTMIG
        References:
          - Citations:
              - Cited Guidance: All trial design data should be submitted as
                  specified in the FDA Study Data Technical Conformance Guide
                  (TCG).
                Document: FDA
                Section: FDAB011
            Origin: FDA Business Rules
            Rule Identifier:
              Id: FB1113
              Version: '1'
            Version: '1.5'
        Version: '3.2'
      - Name: SDTMIG
        References:
          - Citations:
              - Cited Guidance: All trial design data should be submitted as
                  specified in the FDA Study Data Technical Conformance Guide
                  (TCG).
                Document: FDA
                Section: FDAB011
            Origin: FDA Business Rules
            Rule Identifier:
              Id: FB1113
              Version: '1'
            Version: '1.5'
        Version: '3.3'
      - Name: SDTMIG
        References:
          - Citations:
              - Cited Guidance: All trial design data should be submitted as
                  specified in the FDA Study Data Technical Conformance Guide
                  (TCG).
                Document: FDA
                Section: FDAB011
            Origin: FDA Business Rules
            Rule Identifier:
              Id: FB1113
              Version: '1'
            Version: '1.5'
        Version: '3.4'
Check:
  all:
    - name: TSPARMCD
      operator: equal_to
      value: SSDTC
      value_is_literal: true
    - name: TSVAL
      operator: non_empty
    - name: TSVAL
      operator: equal_to
      value: $dm_rficdtc
      value_is_literal: true
Core:
  Id: NEW-RULE
  Status: Draft
  Version: '1'
Description: Raise an error when trial Summary Parameter Study Start Date
  (SSTDTC) is not equal to the earliest date of informed consent (min RFICDTC)
  in the DM dataset.
Executability: Fully Executable
Operations:
  - operator: min_date
    domain: DM
    name: RFICDTC
    id: $dm_rficdtc
Outcome:
  Message: TS parameter SSTDTC is not equal to the earliest RFICDTC in the DM
    dataset.
  Output Variables:
    - TSPARMCD
    - TSVAL
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - TRIAL DESIGN
  Domains:
    Include:
      - TS
Sensitivity: Record

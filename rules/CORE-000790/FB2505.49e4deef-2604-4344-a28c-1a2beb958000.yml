# Variable: USUBJID
# Condition: ARM not in (Screen Failure, Not Assigned)
# Rule: USUBJID in EX.USUBJID
# verified
Authorities:
  - Organization: FDA
    Standards:
      - Name: SDTMIG
        References:
          - Citations:
              - Cited Guidance: Randomized subjects are expected to receive a
                  study treatment.
                Document: FDA
                Section: FDAB025
            Origin: FDA Business Rules
            Rule Identifier:
              Id: FB2505
              Version: '1'
            Version: '1.5'
        Version: '3.2'
Check:

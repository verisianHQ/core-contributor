    - name: ARM
      operator: is_not_contained_by_case_insensitive
      value:
        - Screen Failure
        - Not Assigned
      value_is_literal: true
    - name: ACTARM
      operator: is_not_contained_by_case_insensitive
      value:
        - Not Treated
      value_is_literal: true
    - name: USUBJID
      operator: is_not_contained_by
      value: $usubjids_in_ex
Core:
  Id: CORE-000790
  Status: Published
  Version: '1'
Description: Subject is assigned to an arm code (randomized) and the subject
  has a record in EX
Executability: Partially Executable
Operations:
  - domain: EX
    id: $usubjids_in_ex
    name: USUBJID
    operator: distinct
Outcome:
  Message: Subject is assigned to an arm code (randomized) but has no record in
    EX.
  Output Variables:
    - ARM
    - ACTARM
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - SPECIAL PURPOSE
  Domains:
    Include:
      - DM
Sensitivity: Record

Core:
  Id: CORE-000892
  Status: Published
  Version: '1'
Description: End timepoint (--ENDTC, --ENRF or --ENRTPT) is populated and 
  related start timepoint (--STDTC, --STRF or --STRTPT) is also populated.
Executability: Fully Executable
Outcome:
  Message: End timepoint is populated but start timepoint is missing.
  Output Variables:
    - --STDTC
    - --STRF
    - --STRTPT
    - --ENDTC
    - --ENRF
    - --ENRTPT
Rule Type: Record Data
Scope:
  Classes:
    Include:
      - INTERVENTIONS
      - EVENTS
      - FINDINGS
  Domains:
    Exclude:
      - NONE
Sensitivity: Record
